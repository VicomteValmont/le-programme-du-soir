/**
 * Compose un cycle thématique de plusieurs titres, ordonné du plus accessible au plus exigeant.
 * Fonction pure à graine égale.
 * @param {object} parametres - {cycle, profil, catalogue, graine, combien}
 * @returns {object[]}
 */
function composer_cycle({cycle, profil, catalogue, graine = 1, combien = 5}){
  if(!cycle || typeof cycle.filtre !== "function"){
    throw new Error("Cycle invalide : un objet avec une fonction `filtre` est attendu.");
  }
  const alea = fabriquer_alea(graine);
  const interdits = calculer_interdits(profil, catalogue);
  const af = profil.affinites;

  const candidats = catalogue
    .filter(oeuvre => cycle.filtre(oeuvre))
    .filter(oeuvre => interdits.indexOf(cle_oeuvre(oeuvre)) === -1)
    .filter(oeuvre => oeuvre.x <= af.exigence)
    .filter(oeuvre => !(af.exclus || []).some(ex =>
      ex === "sombre" ? oeuvre.fin === "sombre" : oeuvre.tg.includes(ex)))
    .map(oeuvre => {
      const proximite = compter_communs(oeuvre.tg, af.aimes);
      const rejet = compter_communs(oeuvre.tg, af.tiedes || []);
      return {oeuvre, score: proximite * 2 - rejet * 2 + alea() * 4};
    })
    .sort((a, b) => b.score - a.score);

  const retenus = [];
  const auteurs = [];
  for(const candidat of candidats){
    if(retenus.length >= combien) break;
    if(auteurs.includes(candidat.oeuvre.r)) continue;
    retenus.push(candidat.oeuvre);
    auteurs.push(candidat.oeuvre.r);
  }
  return retenus.sort((a, b) => a.x - b.x || a.a - b.a);
}

/**
 * Graine stable pour une journée donnée : la suggestion du jour ne change pas
 * entre deux ouvertures, mais change à minuit.
 * @param {Date} date
 * @param {string} sel - discriminant, typiquement l'identifiant du profil
 * @returns {number}
 */
function graine_du_jour(date, sel = ""){
  const jour = date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
  let empreinte = jour;
  for(let i = 0; i < sel.length; i++){
    empreinte = (empreinte * 31 + sel.charCodeAt(i)) >>> 0;
  }
  return empreinte;
}

/**
 * Choisit un titre unique, sans questionnaire, sur la seule base du profil.
 * @param {object} parametres - {profil, catalogue, graine, format}
 * @returns {object|null}
 */
function tirer_au_sort({profil, catalogue, graine = 1, format = null}){
  const alea = fabriquer_alea(graine);
  const interdits = calculer_interdits(profil, catalogue);
  const af = profil.affinites;

  const eligibles = catalogue.filter(oeuvre => {
    if(format && oeuvre.f !== format) return false;
    if(interdits.indexOf(cle_oeuvre(oeuvre)) !== -1) return false;
    if(oeuvre.x > af.exigence) return false;
    return !(af.exclus || []).some(ex =>
      ex === "sombre" ? oeuvre.fin === "sombre" : oeuvre.tg.includes(ex));
  });
  if(eligibles.length === 0) return null;

  const notes = eligibles.map(oeuvre => ({
    oeuvre,
    score: compter_communs(oeuvre.tg, af.aimes) * 1.5
         - compter_communs(oeuvre.tg, af.tiedes || []) * 2
         + (af.registres[oeuvre.g[0]] || 0)
         + alea() * 6
  }));
  notes.sort((a, b) => b.score - a.score);
  return notes[0].oeuvre;
}

/**
 * Retrouve les séries que la personne a commencées sans les terminer.
 * @param {object} profil
 * @param {object[]} catalogue
 * @returns {object[]}
 */
function series_en_cours(profil, catalogue){
  const index = new Map(catalogue.map(oeuvre => [cle_oeuvre(oeuvre), oeuvre]));
  return profil.journal
    .filter(entree => entree.statut === "en_cours")
    .map(entree => index.get(entree.cle))
    .filter(Boolean);
}

/**
 * Récupère les œuvres d'une liste de clés, dans l'ordre de la liste.
 * @param {string[]} cles
 * @param {object[]} catalogue
 * @returns {object[]}
 */
function resoudre_cles(cles, catalogue){
  const index = new Map(catalogue.map(oeuvre => [cle_oeuvre(oeuvre), oeuvre]));
  return (cles || []).map(cle => index.get(cle)).filter(Boolean);
}

/**
 * Propose des titres proches d'une œuvre donnée, par recoupement d'étiquettes.
 * @param {object} oeuvre
 * @param {object[]} catalogue
 * @param {number} combien
 * @returns {object[]}
 */
function trouver_voisins(oeuvre, catalogue, combien = 4){
  const reference = cle_oeuvre(oeuvre);
  return catalogue
    .filter(autre => cle_oeuvre(autre) !== reference)
    .map(autre => ({
      autre,
      proximite: compter_communs(oeuvre.tg, autre.tg)
               + (autre.c === oeuvre.c ? 1 : 0)
               + (autre.e === oeuvre.e ? 1 : 0)
               + (autre.r === oeuvre.r ? 3 : 0)
    }))
    .filter(paire => paire.proximite >= 2)
    .sort((a, b) => b.proximite - a.proximite)
    .slice(0, combien)
    .map(paire => paire.autre);
}

/**
 * Inventaire des étiquettes réellement présentes dans le catalogue, par fréquence.
 * @param {object[]} catalogue
 * @returns {Array<[string, number]>}
 */
function inventorier_etiquettes(catalogue){
  const compte = {};
  for(const oeuvre of catalogue){
    for(const etiquette of oeuvre.tg){ compte[etiquette] = (compte[etiquette] || 0) + 1; }
  }
  return Object.entries(compte).sort((a, b) => b[1] - a[1]);
}

/* ── Distinctions ─────────────────────────────────────────────────
   Le champ `prix` est du texte libre, parce qu'aucune nomenclature ne
   couvre proprement une Palme, un Emmy et un César à la fois. Les
   familles ci-dessous le rangent après coup, par reconnaissance de
   motif. L'ordre compte : « Oscar du meilleur film étranger » doit être
   reconnu avant « Oscar du meilleur film », sinon il tomberait dedans.
   ─────────────────────────────────────────────────────────────── */

/**
 * Familles de distinctions, testées dans l'ordre. `majeure` désigne les
 * récompenses suprêmes d'une manifestation, celles qu'on cherche en premier.
 */
const FAMILLES_DISTINCTION = [
  // En tête, sans quoi « 7 nominations aux Oscars, aucune statuette » serait
  // rangé parmi les Oscars gagnés et compterait comme une récompense.
  {id:"nomination",  nom:"Nommé sans être primé",    majeure:false, reconnait:p => /nomination/.test(p)},
  {id:"palme",       nom:"Palme d'or",              majeure:true,  reconnait:p => /palme d.or/.test(p)},
  {id:"grand-prix",  nom:"Grand Prix de Cannes",     majeure:true,  reconnait:p => /grand prix/.test(p) && /cannes|festival/.test(p)},
  {id:"cannes",      nom:"Autre prix à Cannes",      majeure:false, reconnait:p => /cannes/.test(p)},
  {id:"oscar-etr",   nom:"Oscar du film étranger",   majeure:true,  reconnait:p => /oscar/.test(p) && /etranger/.test(p)},
  {id:"oscar-doc",   nom:"Oscar du documentaire",    majeure:true,  reconnait:p => /oscar/.test(p) && /documentaire/.test(p)},
  {id:"oscar-anim",  nom:"Oscar de l'animation",     majeure:true,  reconnait:p => /oscar/.test(p) && /animation/.test(p)},
  {id:"oscar-film",  nom:"Oscar du meilleur film",   majeure:true,  reconnait:p => /oscar/.test(p) && /meilleur film/.test(p)},
  {id:"oscar",       nom:"Autre Oscar",              majeure:false, reconnait:p => /oscar/.test(p)},
  {id:"cesar-film",  nom:"César du meilleur film",   majeure:true,  reconnait:p => /cesar/.test(p) && /meilleur film/.test(p)},
  {id:"cesar",       nom:"Autre César",              majeure:false, reconnait:p => /cesar/.test(p)},
  {id:"ours",        nom:"Ours d'or",                majeure:true,  reconnait:p => /ours d.or/.test(p)},
  {id:"lion",        nom:"Lion d'or",                majeure:true,  reconnait:p => /lion d.or/.test(p)},
  {id:"venise",      nom:"Autre prix à Venise",      majeure:false, reconnait:p => /lion|venise/.test(p)},
  {id:"berlin",      nom:"Autre prix à Berlin",      majeure:false, reconnait:p => /berlin|ours/.test(p)},
  {id:"emmy",        nom:"Emmy Award",               majeure:true,  reconnait:p => /emmy/.test(p)},
  {id:"bafta",       nom:"BAFTA",                    majeure:false, reconnait:p => /bafta/.test(p)},
  {id:"sundance",    nom:"Sundance",                 majeure:false, reconnait:p => /sundance/.test(p)},
  {id:"autre",       nom:"Autre distinction",        majeure:false, reconnait:() => true}
];

/**
 * Range une distinction dans sa famille. Fonction pure.
 * @param {string} prix - libellé libre, par exemple « Palme d'or 1963 »
 * @returns {object} la famille reconnue ; jamais null, « autre » sert de refuge
 */
function famille_distinction(prix){
  const texte = normaliser(prix);
  for(const famille of FAMILLES_DISTINCTION){
    if(famille.reconnait(texte)) return famille;
  }
  return FAMILLES_DISTINCTION[FAMILLES_DISTINCTION.length - 1];
}

/**
 * Les distinctions d'une œuvre qui relèvent d'une famille majeure.
 * @param {object} oeuvre
 * @returns {string[]}
 */
function distinctions_majeures(oeuvre){
  return (oeuvre.prix || []).filter(prix => famille_distinction(prix).majeure);
}

/**
 * Recense les familles de distinctions présentes au catalogue.
 * Une œuvre primée deux fois dans la même famille n'y compte qu'une fois.
 * @param {object[]} catalogue
 * @returns {Array<{famille: object, oeuvres: object[]}>} triées, majeures d'abord
 */
function inventorier_distinctions(catalogue){
  if(!Array.isArray(catalogue)) throw new Error("Catalogue attendu, reçu : " + typeof catalogue);
  const parFamille = new Map();
  for(const oeuvre of catalogue){
    const vues = new Set();
    for(const prix of oeuvre.prix || []){
      const famille = famille_distinction(prix);
      if(vues.has(famille.id)) continue;
      vues.add(famille.id);
      if(parFamille.has(famille.id)) parFamille.get(famille.id).oeuvres.push(oeuvre);
      else parFamille.set(famille.id, {famille, oeuvres:[oeuvre]});
    }
  }
  return [...parFamille.values()].sort((a, b) =>
    (b.famille.majeure - a.famille.majeure) || (b.oeuvres.length - a.oeuvres.length));
}

/**
 * Valide une œuvre saisie à la main avant de l'ajouter au catalogue.
 * @param {object} oeuvre
 * @returns {string[]} liste des problèmes, vide si l'œuvre est valide
 */
function valider_oeuvre(oeuvre){
  const problemes = [];
  const annee = parseInt(oeuvre.a, 10);
  if(!oeuvre.t || !String(oeuvre.t).trim()) problemes.push("Le titre est obligatoire.");
  if(!Number.isFinite(annee) || annee < 1890 || annee > 2100) problemes.push("Année attendue entre 1890 et 2100.");
  if(["film","serie","doc"].indexOf(oeuvre.f) === -1) problemes.push("Format attendu : film, série ou documentaire.");
  if(!Array.isArray(oeuvre.g) || oeuvre.g.length === 0) problemes.push("Au moins un registre est nécessaire.");
  else {
    // Les valeurs de registre n'étaient pas contrôlées, seulement leur présence.
    // Une étiquette glissée là — « aventure » au lieu de « eblouissement » —
    // passait toute la validation et rendait l'œuvre introuvable par son envie.
    const connus = ["eblouissement","tension","refuge","rire","apprendre"];
    for(const registre of oeuvre.g){
      if(connus.indexOf(registre) === -1) problemes.push("Registre inconnu : " + registre + ".");
    }
  }
  if(["soleil","pluie","ville","ailleurs"].indexOf(oeuvre.c) === -1) problemes.push("Climat manquant.");
  if(["passe","present","imaginaire"].indexOf(oeuvre.e) === -1) problemes.push("Époque manquante.");
  if([1,2,3].indexOf(Number(oeuvre.x)) === -1) problemes.push("Exigence attendue entre 1 et 3.");
  if(["sombre","douce","ouverte"].indexOf(oeuvre.fin) === -1) problemes.push("Type de fin manquant.");
  // Les distinctions et le repère historique sont facultatifs : la plupart des
  // œuvres n'en ont pas. On ne contrôle donc que leur forme quand ils existent.
  if(oeuvre.prix !== undefined){
    if(!Array.isArray(oeuvre.prix)) problemes.push("Les distinctions doivent former une liste.");
    else if(oeuvre.prix.some(prix => typeof prix !== "string" || !prix.trim())){
      problemes.push("Une distinction est vide ou n'est pas du texte.");
    }
  }
  if(oeuvre.hist !== undefined && (typeof oeuvre.hist !== "string" || !oeuvre.hist.trim())){
    problemes.push("Le repère historique doit être une phrase non vide.");
  }
  return problemes;
}

/* ── Audit du catalogue ───────────────────────────────────────────
   Les contrôles ci-dessous existent parce que chacun d'eux a déjà
   attrapé un défaut réel : 754 voisins pointant sur l'œuvre elle-même,
   et 101 entrées qui étaient le même titre saisi deux fois.
   ─────────────────────────────────────────────────────────────── */

/** Seuil en deçà duquel un fil rouge n'est plus proposé. */
const SEUIL_FIL_ROUGE = 6;

/**
 * Vrai si deux étiquettes ne diffèrent que d'un caractère.
 * Sert à repérer les synonymes involontaires du vocabulaire.
 * @param {string} a
 * @param {string} b
 * @returns {boolean}
 */
function etiquettes_voisines(a, b){
  if(Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, ecarts = 0;
  while(i < a.length && j < b.length){
    if(a[i] === b[j]){ i++; j++; continue; }
    if(++ecarts > 1) return false;
    if(a.length > b.length) i++;
    else if(b.length > a.length) j++;
    else { i++; j++; }
  }
  return ecarts + (a.length - i) + (b.length - j) <= 1;
}

/**
 * Passe un catalogue au crible et retourne ses anomalies.
 * Fonction pure : ne lit ni l'horloge ni le stockage, et ne modifie rien.
 * Les gravités : « bloquant » casse une fonctionnalité, « sérieux » produit
 * un affichage faux, « signal » mérite un coup d'œil sans être une erreur.
 * @param {object[]} catalogue
 * @returns {{anomalies: Array<{nature: string, gravite: string, sujet: string, detail: string}>, resume: object}}
 */
function auditer_catalogue(catalogue){
  if(!Array.isArray(catalogue)) throw new Error("Catalogue attendu, reçu : " + typeof catalogue);
  const anomalies = [];
  const noter = (nature, gravite, sujet, detail) => anomalies.push({nature, gravite, sujet, detail});

  const titres = new Set(catalogue.map(oeuvre => normaliser(oeuvre.t)));
  const clesVues = new Map();
  const parTitre = new Map();
  const parAuteurAnnee = new Map();
  const frequenceTags = new Map();

  for(const oeuvre of catalogue){
    const sujet = oeuvre.t || "(sans titre)";

    for(const probleme of valider_oeuvre(oeuvre)){
      noter("Champ invalide", "bloquant", sujet, probleme);
    }

    const cle = cle_oeuvre(oeuvre);
    if(clesVues.has(cle)) noter("Clé en double", "bloquant", sujet, "déjà utilisée par « " + clesVues.get(cle) + " »");
    else clesVues.set(cle, sujet);

    const titreNormalise = normaliser(oeuvre.t);
    if(parTitre.has(titreNormalise)) parTitre.get(titreNormalise).push(oeuvre);
    else parTitre.set(titreNormalise, [oeuvre]);

    const cleAuteur = oeuvre.a + "|" + oeuvre.r;
    if(parAuteurAnnee.has(cleAuteur)) parAuteurAnnee.get(cleAuteur).push(oeuvre);
    else parAuteurAnnee.set(cleAuteur, [oeuvre]);

    for(const etiquette of oeuvre.tg || []){
      frequenceTags.set(etiquette, (frequenceTags.get(etiquette) || 0) + 1);
    }

    const voisinsVus = new Set();
    for(const voisin of oeuvre.v || []){
      const voisinNormalise = normaliser(voisin);
      if(voisinNormalise === titreNormalise) noter("Voisin : l'œuvre elle-même", "sérieux", sujet, "« " + voisin + " »");
      else if(!titres.has(voisinNormalise)) noter("Voisin absent du catalogue", "sérieux", sujet, "« " + voisin + " »");
      if(voisinsVus.has(voisinNormalise)) noter("Voisin répété", "signal", sujet, "« " + voisin + " »");
      voisinsVus.add(voisinNormalise);
    }

    if(oeuvre.prix){
      const vues = new Set();
      for(const prix of oeuvre.prix){
        const normalise = normaliser(prix);
        if(vues.has(normalise)) noter("Distinction répétée", "signal", sujet, "« " + prix + " »");
        vues.add(normalise);
        // Une récompense sans millésime devient inexploitable dès qu'on veut la situer.
        if(!/\d{4}/.test(prix)) noter("Distinction sans année", "signal", sujet, "« " + prix + " »");
      }
    }
    // Le repère a droit à deux ou trois phrases : expliquer en quoi une œuvre
    // compte demande souvent de dire ce qu'elle a changé, pas seulement ce
    // qu'elle a gagné. Au-delà, c'est un article, plus un repère.
    if(oeuvre.hist && oeuvre.hist.length > 320){
      noter("Repère trop long", "signal", sujet, oeuvre.hist.length + " caractères : trois phrases suffisent");
    }

    // Les suffixes de remplissage : chacune de ces formes a déjà servi à gonfler
    // le catalogue avec une œuvre déjà présente. « (reprise) » avait produit
    // 79 doublons, « restauré » et « saison N » sont apparus au lot suivant.
    // Pas de \b après « restauré » : en JavaScript, la frontière de mot ne
    // reconnaît pas les lettres accentuées, et le motif ne trouverait rien.
    // « Le Grand Restaurant » n'est pas capturé : le motif exige é ou e après
    // « restaur », jamais le a de « restaurant ».
    const suffixe = /\(reprise\)|restaur[ée]e?s?|saison \d|version longue|director'?s cut/i.exec(oeuvre.t);
    if(suffixe) noter("Titre suffixé", "signal", sujet, "« " + suffixe[0] + " » : suffixe à retirer ou doublon à supprimer");
    if(oeuvre.f === "film" && duree_minutes(oeuvre.d) === null){
      noter("Durée illisible", "signal", sujet, "« " + oeuvre.d + " » : le sablier ignorera ce titre");
    }
  }

  for(const [, groupe] of parTitre){
    if(groupe.length > 1){
      noter("Titre identique", "signal", groupe[0].t,
        groupe.map(o => o.a + " · " + o.f).join(" et ") + " — deux œuvres distinctes ou un doublon ?");
    }
  }

  for(const [, groupe] of parAuteurAnnee){
    if(groupe.length < 2) continue;
    for(let i = 0; i < groupe.length; i++){
      for(let j = i + 1; j < groupe.length; j++){
        const a = groupe[i], b = groupe[j];
        const na = normaliser(a.t), nb = normaliser(b.t);
        const indices = [];
        if(na !== nb && (na.includes(nb) || nb.includes(na))) indices.push("un titre contient l'autre");
        if(a.p === b.p) indices.push("pitch identique");
        if(a.d === b.d && a.f === b.f) indices.push("durée et format identiques");
        if(indices.length > 0){
          noter("Doublon probable", "sérieux", a.t + " / " + b.t,
            a.a + ", " + a.r + " — " + indices.join(", "));
        }
      }
    }
  }

  const etiquettes = [...frequenceTags.keys()].sort();
  for(const [etiquette, compte] of frequenceTags){
    if(compte === 1) noter("Étiquette unique", "signal", etiquette, "n'apparaît que sur un titre : faute de frappe ?");
  }
  // Deux étiquettes proches ne sont un problème que si l'une est presque
  // inemployée : c'est la signature d'une faute de frappe. Deux étiquettes
  // bien installées qui se ressemblent — « coree » et « corse », « irlande »
  // et « islande » — sont distinctes à dessein. Les décennies, toutes de la
  // forme « annees12 », se ressemblent par construction : on les ignore.
  const decennie = /^annees\d+$/;
  for(let i = 0; i < etiquettes.length; i++){
    if(etiquettes[i].length < 5 || decennie.test(etiquettes[i])) continue;
    for(let j = i + 1; j < etiquettes.length; j++){
      if(decennie.test(etiquettes[j])) continue;
      if(!etiquettes_voisines(etiquettes[i], etiquettes[j])) continue;
      const rare = Math.min(frequenceTags.get(etiquettes[i]), frequenceTags.get(etiquettes[j]));
      if(rare > 2) continue;
      noter("Étiquettes trop proches", "signal", etiquettes[i] + " / " + etiquettes[j],
        frequenceTags.get(etiquettes[i]) + " et " + frequenceTags.get(etiquettes[j]) + " titres — à fusionner ?");
    }
  }

  for(const cycle of CYCLES){
    const compte = catalogue.filter(oeuvre => cycle.filtre(oeuvre)).length;
    if(compte === 0) noter("Cycle vide", "sérieux", cycle.nom, "aucun titre ne correspond");
  }
  for(const fil of FILS_ROUGES){
    const compte = catalogue.filter(oeuvre => fil.tient(oeuvre)).length;
    if(compte < SEUIL_FIL_ROUGE){
      noter("Fil rouge sous le seuil", "signal", fil.nom,
        compte + " titre" + (compte > 1 ? "s" : "") + " sur les " + SEUIL_FIL_ROUGE + " nécessaires : jamais affiché");
    }
  }

  const parGravite = {bloquant: 0, "sérieux": 0, signal: 0};
  for(const anomalie of anomalies) parGravite[anomalie.gravite]++;

  return {
    anomalies,
    resume: {
      titres: catalogue.length,
      etiquettes: frequenceTags.size,
      realisateurs: new Set(catalogue.map(oeuvre => oeuvre.r)).size,
      total: anomalies.length,
      parGravite
    }
  };
}

/**
 * Convertit une durée en minutes vers un affichage lisible.
 * @param {number} minutes
 * @returns {string}
 */
function formater_duree(minutes){
  if(!Number.isFinite(minutes) || minutes <= 0) return "";
  const heures = Math.floor(minutes / 60);
  const reste = minutes % 60;
  if(heures === 0) return reste + " min";
  return heures + " h" + (reste > 0 ? " " + String(reste).padStart(2, "0") : "");
}

/**
 * Estime le temps total passé devant les titres retenus.
 * Les séries comptent forfaitairement, faute de durée exploitable.
 * @param {object} profil
 * @param {object[]} catalogue
 * @returns {{minutes: number, series: number}}
 */
function calculer_temps(profil, catalogue){
  const index = new Map(catalogue.map(oeuvre => [cle_oeuvre(oeuvre), oeuvre]));
  let minutes = 0, series = 0;
  for(const entree of profil.journal){
    if(entree.statut !== "pris" && entree.statut !== "deja_vu") continue;
    const oeuvre = index.get(entree.cle);
    if(!oeuvre) continue;
    const duree = duree_minutes(oeuvre.d);
    if(duree === null) series++; else minutes += duree;
  }
  return {minutes, series};
}

/* ═══════════════════════════════════════════════════════════════
   4 bis. MOTEUR — ACCÈS LIBRE
   ═══════════════════════════════════════════════════════════════ */

/**
 * Filtre le catalogue selon un ensemble de critères combinables librement.
 * Chaque axe est indépendant : à l'intérieur d'un axe les valeurs s'unissent (OU),
 * entre axes elles se cumulent (ET). Un axe vide n'impose aucune contrainte.
 * Fonction pure.
 * @param {object[]} catalogue
 * @param {object} criteres - {texte, formats, registres, climats, epoques, fins,
 *   decennies, exigenceMax, familleSeule, dureeMax, dureeMin, tagsInclus, tagsExclus, plateforme}
 * @returns {object[]}
 */
function filtrer_avance(catalogue, criteres = {}){
  const c = criteres;
  const requete = normaliser(c.texte || "");
  const dansAxe = (valeur, axe) => !axe || axe.length === 0 || axe.indexOf(valeur) !== -1;

  return catalogue.filter(oeuvre => {
    if(!dansAxe(oeuvre.f, c.formats)) return false;
    if(!dansAxe(oeuvre.c, c.climats)) return false;
    if(!dansAxe(oeuvre.e, c.epoques)) return false;
    if(!dansAxe(oeuvre.fin, c.fins)) return false;
    if(c.registres && c.registres.length > 0 && !oeuvre.g.some(g => c.registres.indexOf(g) !== -1)) return false;
    if(c.decennies && c.decennies.length > 0 && c.decennies.indexOf(Math.floor(oeuvre.a / 10) * 10) === -1) return false;
    if(typeof c.exigenceMax === "number" && oeuvre.x > c.exigenceMax) return false;
    if(c.familleSeule && !oeuvre.fam) return false;
    if(c.plateforme && oeuvre.pf !== c.plateforme) return false;
    if(c.primeSeulement && !(oeuvre.prix && oeuvre.prix.length > 0)) return false;
    if(c.majeuresSeulement && distinctions_majeures(oeuvre).length === 0) return false;
    if(c.familleDistinction){
      const familles = (oeuvre.prix || []).map(prix => famille_distinction(prix).id);
      if(familles.indexOf(c.familleDistinction) === -1) return false;
    }

    if(typeof c.dureeMax === "number" || typeof c.dureeMin === "number"){
      const minutes = duree_minutes(oeuvre.d);
      if(minutes !== null){
        if(typeof c.dureeMax === "number" && minutes > c.dureeMax) return false;
        if(typeof c.dureeMin === "number" && minutes < c.dureeMin) return false;
      } else if(c.filmsSeuls){
        return false;
      }
    }
    if(c.tagsInclus && c.tagsInclus.length > 0 && !oeuvre.tg.some(t => c.tagsInclus.indexOf(t) !== -1)) return false;
    if(c.tagsExclus && c.tagsExclus.length > 0 && oeuvre.tg.some(t => c.tagsExclus.indexOf(t) !== -1)) return false;

    if(requete){
      // Les distinctions entrent dans la recherche : « palme », « oscar », « césar »
      // deviennent des requêtes utiles.
      const foin = normaliser(oeuvre.t) + " " + normaliser(oeuvre.r) + " " + oeuvre.tg.map(normaliser).join(" ")
        + " " + (oeuvre.prix || []).map(normaliser).join(" ");
      if(!foin.includes(requete)) return false;
    }
    return true;
  });
}

/**
 * Sélectionne un sous-ensemble varié parmi des candidats déjà notés.
 * Fonction pure : partage la logique de diversification entre plusieurs modes.
 * @param {Array<{oeuvre: object, score: number}>} candidats - triés par score décroissant
 * @param {number} combien
 * @returns {object[]}
 */
function diversifier(candidats, combien){
  if(candidats.length === 0) return [];
  const retenus = [];
  const auteurs = [];
  const decennies = [];
  const plafond = candidats[0].score;
  for(const candidat of candidats){
    if(retenus.length >= combien) break;
    const decennie = Math.floor(candidat.oeuvre.a / 10);
    if(auteurs.indexOf(candidat.oeuvre.r) !== -1) continue;
    if(retenus.length > 0 && decennies.indexOf(decennie) !== -1 && candidat.score < plafond - 4) continue;
    retenus.push(candidat.oeuvre);
    auteurs.push(candidat.oeuvre.r);
    decennies.push(decennie);
  }
  for(const candidat of candidats){
    if(retenus.length >= combien) break;
    if(retenus.indexOf(candidat.oeuvre) === -1) retenus.push(candidat.oeuvre);
  }
  return retenus;
}

/**
 * Compose des recommandations à partir de pondérations fines plutôt que d'un seul choix.
 * Chaque registre et chaque climat reçoivent un poids de 0 à 3.
 * @param {object} parametres - {profil, poidsRegistres, poidsClimats, audace, compagnie,
 *   formats, catalogue, ecartes, graine, combien}
 * @returns {object[]}
 */
function composer_pondere({profil, poidsRegistres = {}, poidsClimats = {}, audace = "cote",
                           compagnie = "seul", formats = [], catalogue, ecartes = [],
                           graine = 1, combien = 3}){
  const alea = fabriquer_alea(graine);
  const interdits = calculer_interdits(profil, catalogue).concat(ecartes);
  const af = profil.affinites;

  const candidats = [];
  for(const oeuvre of catalogue){
    if(formats.length > 0 && formats.indexOf(oeuvre.f) === -1) continue;
    if(interdits.indexOf(cle_oeuvre(oeuvre)) !== -1) continue;
    if(compagnie === "famille" && !oeuvre.fam) continue;
    if(oeuvre.x > af.exigence) continue;
    if((af.exclus || []).some(ex => ex === "sombre" ? oeuvre.fin === "sombre" : oeuvre.tg.includes(ex))) continue;

    let score = 0;
    for(const registre of oeuvre.g){ score += (poidsRegistres[registre] || 0) * 3; }
    score += (poidsClimats[oeuvre.c] || 0) * 2.5;
    for(const registre of oeuvre.g){ score += (af.registres[registre] || 0) * 0.5; }
    score += (af.epoques[oeuvre.e] || 0) * 0.5;

    const proximite = compter_communs(oeuvre.tg, af.aimes);
    if(audace === "sure") score += proximite * 2;
    if(audace === "cote") score += (proximite >= 1 && proximite <= 4) ? 4 : 0;
    if(audace === "angle") score += proximite <= 1 ? 7 : -proximite * 1.5;
    score -= compter_communs(oeuvre.tg, af.tiedes || []) * 1.6;

    candidats.push({oeuvre, score: score + alea() * 3});
  }
  candidats.sort((a, b) => b.score - a.score);
  return diversifier(candidats, combien);
}

/**
 * Calcule la durée totale d'une sélection.
 * Les séries, sans durée exploitable, sont comptées à part.
 * Fonction pure.
 * @param {object[]} oeuvres
 * @returns {{minutes: number, series: number}}
 */
function duree_totale(oeuvres){
  let minutes = 0, series = 0;
  for(const oeuvre of oeuvres){
    const m = duree_minutes(oeuvre.d);
    if(m === null) series++; else minutes += m;
  }
  return {minutes, series};
}

/**
 * Renvoie toute la filmographie d'un réalisateur présente au catalogue, par année.
 * Fonction pure.
 * @param {object[]} catalogue
 * @param {string} realisateur
 * @returns {object[]}
 */
function filmographie(catalogue, realisateur){
  return catalogue
    .filter(oeuvre => oeuvre.r === realisateur)
    .sort((a, b) => a.a - b.a);
}

/**
 * Recense les plateformes citées au catalogue, avec le nombre de titres.
 * Fonction pure.
 * @param {object[]} catalogue
 * @returns {Array<[string, number]>}
 */
function plateformes_presentes(catalogue){
  const compte = {};
  for(const oeuvre of catalogue){
    if(oeuvre.pf) compte[oeuvre.pf] = (compte[oeuvre.pf] || 0) + 1;
  }
  return Object.entries(compte).sort((a, b) => b[1] - a[1]);
}

/**
 * Déplace un élément d'une liste. Fonction pure : renvoie une nouvelle liste.
 * @param {Array} liste
 * @param {number} index
 * @param {"haut"|"bas"|"tete"} direction
 * @returns {Array}
 */
function deplacer(liste, index, direction){
  if(index < 0 || index >= liste.length) return liste.slice();
  const copie = liste.slice();
  const [element] = copie.splice(index, 1);
  if(direction === "tete") copie.unshift(element);
  else if(direction === "haut") copie.splice(Math.max(0, index - 1), 0, element);
  else if(direction === "bas") copie.splice(Math.min(copie.length, index + 1), 0, element);
  else copie.splice(index, 0, element);
  return copie;
}

/* ═══════════════════════════════════════════════════════════════
   4 ter. MOTEUR — PROFIL CINÉMA (dérivé des films vus)
   Toutes les fonctions de cette section sont pures.
   ═══════════════════════════════════════════════════════════════ */

/** Étiquettes qui désignent un pays ou une aire culturelle (pour le passeport). */
const PAYS_ETIQUETTES = {
  france:"France", italie:"Italie", espagne:"Espagne", angleterre:"Angleterre",
  irlande:"Irlande", autriche:"Autriche", russie:"Russie", amerique:"États-Unis",
  "new-york":"États-Unis", asie:"Asie", japon:"Japon", coree:"Corée", afrique:"Afrique",
  mediterranee:"Méditerranée"
};

/** Contribution d'une note (1–5) au score d'un axe. */
const POIDS_PAR_NOTE = {5: 2, 4: 1, 3: 0, 2: -1, 1: -2};

/** Un statut compte comme « vu ». */
function est_vu(statut){ return statut === "deja_vu" || statut === "pris"; }

/**
 * Poids d'une entrée de journal : combien elle pèse dans l'empreinte de goûts.
 * Une note explicite prime ; à défaut, le statut donne un signal plus faible.
 * @param {object} entree - {statut, note}
 * @returns {number} positif si aimé, négatif si rejeté, 0 si neutre
 */
function poids_note(entree){
  if(typeof entree.note === "number" && entree.note >= 1 && entree.note <= 5){
    return POIDS_PAR_NOTE[entree.note];
  }
  if(est_vu(entree.statut)) return 0.5;
  if(entree.statut === "refuse" || entree.statut === "jamais") return -1;
  return 0;
}

/**
 * Associe chaque entrée de journal à son œuvre au catalogue.
 * Les entrées dont l'œuvre n'existe plus sont ignorées.
 * @param {object[]} journal
 * @param {object[]} catalogue
 * @returns {Array<{entree: object, oeuvre: object, poids: number}>}
 */
function apparier_journal(journal, catalogue){
  const parCle = new Map(catalogue.map(oeuvre => [cle_oeuvre(oeuvre), oeuvre]));
  const paires = [];
  for(const entree of journal || []){
    const oeuvre = parCle.get(entree.cle);
    if(oeuvre) paires.push({entree, oeuvre, poids: poids_note(entree)});
  }
  return paires;
}

/** Ramène une valeur dans l'intervalle [min, max]. */
function borner(valeur, min, max){ return Math.max(min, Math.min(max, valeur)); }

/**
 * Transforme un ensemble de scores bruts par clé en affinités sur l'échelle 0–4.
 * La normalisation se fait par le plus grand écart observé, pour rester bornée quel
 * que soit le nombre de films vus. Une clé sans signal reste à la base neutre (1).
 * @param {object} scoresBruts - {cle: score}
 * @param {string[]} clesConnues - toutes les clés de l'axe (pour garder les absentes à 1)
 * @returns {object} {cle: valeur ∈ [0,4]}
 */
function normaliser_axe(scoresBruts, clesConnues){
  const amplitude = Math.max(1, ...clesConnues.map(cle => Math.abs(scoresBruts[cle] || 0)));
  const resultat = {};
  for(const cle of clesConnues){
    resultat[cle] = borner(1 + 2.2 * ((scoresBruts[cle] || 0) / amplitude), 0, 4);
  }
  return resultat;
}

/**
 * Construit l'empreinte de goûts à partir des films vus et notés.
 * Agrège les signaux pondérés (par note) sur chaque axe, les étiquettes, les
 * réalisateurs, les décennies, puis en déduit des affinités prêtes à recommander.
 * @param {object[]} journal
 * @param {object[]} catalogue
 * @returns {object} empreinte complète (voir la feuille de route T1)
 */
function empreinte_gouts(journal, catalogue){
  const paires = apparier_journal(journal, catalogue);

  const registres = {eblouissement:0, tension:0, refuge:0, rire:0, apprendre:0};
  const climats = {soleil:0, pluie:0, ville:0, ailleurs:0};
  const epoques = {passe:0, present:0, imaginaire:0};
  const fins = {sombre:0, douce:0, ouverte:0};
  const tags = {};
  const realisateurs = {};
  const decennies = {};
  let vus = 0, notes = 0, sommeExigence = 0;

  for(const {entree, oeuvre, poids} of paires){
    if(est_vu(entree.statut)){
      vus += 1;
      sommeExigence += oeuvre.x;
      const decennie = Math.floor(oeuvre.a / 10) * 10;
      decennies[decennie] = (decennies[decennie] || 0) + 1;
    }
    if(typeof entree.note === "number") notes += 1;
    if(poids === 0) continue;

    for(const registre of oeuvre.g) registres[registre] += poids;
    climats[oeuvre.c] += poids;
    epoques[oeuvre.e] += poids;
    fins[oeuvre.fin] += poids;
    for(const etiquette of oeuvre.tg) tags[etiquette] = (tags[etiquette] || 0) + poids;

    if(!realisateurs[oeuvre.r]) realisateurs[oeuvre.r] = {nom: oeuvre.r, score: 0, films: []};
    realisateurs[oeuvre.r].score += poids;
    if(poids > 0) realisateurs[oeuvre.r].films.push(oeuvre.t);
  }

  const tagsTries = Object.entries(tags)
    .map(([tag, score]) => ({tag, score}))
    .sort((a, b) => b.score - a.score);
  const realisateursTries = Object.values(realisateurs)
    .filter(r => r.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 8);

  const affinites = {
    registres: normaliser_axe(registres, Object.keys(registres)),
    climats:   normaliser_axe(climats, Object.keys(climats)),
    epoques:   normaliser_axe(epoques, Object.keys(epoques)),
    fins:      normaliser_axe(fins, Object.keys(fins)),
    exigence:  vus > 0 ? borner(Math.round(sommeExigence / vus), 1, 3) : 2,
    aimes:     tagsTries.filter(t => t.score > 0).slice(0, 12).map(t => t.tag),
    tiedes:    tagsTries.filter(t => t.score < 0).slice(-8).map(t => t.tag),
    exclus:    []
  };

  return {vus, notes, registres, climats, epoques, fins,
          tags: tagsTries, realisateurs: realisateursTries, decennies,
          exigenceMoyenne: vus > 0 ? sommeExigence / vus : null, affinites};
}

/**
 * Mélange les affinités d'origine (questionnaire) avec celles déduites des films vus.
 * @param {object} affinitesBase
 * @param {object} empreinte - issue de empreinte_gouts
 * @param {number} poids - force de l'historique, dans [0,1] (0 = ignore, 1 = remplace)
 * @returns {object} nouvelles affinités (les entrées ne sont pas modifiées)
 */
function profil_recalibre(affinitesBase, empreinte, poids){
  if(typeof poids !== "number" || Number.isNaN(poids)){
    throw new Error("Poids attendu : un nombre dans [0,1], reçu : " + poids);
  }
  const p = borner(poids, 0, 1);
  const derivees = empreinte.affinites;

  const melangerAxe = (base, autre) => {
    const resultat = {};
    for(const cle of new Set([...Object.keys(base), ...Object.keys(autre)])){
      resultat[cle] = (base[cle] || 0) * (1 - p) + (autre[cle] || 0) * p;
    }
    return resultat;
  };
  const unir = (x, y) => [...new Set([...(x || []), ...(y || [])])];

  return {
    registres: melangerAxe(affinitesBase.registres, derivees.registres),
    climats:   melangerAxe(affinitesBase.climats, derivees.climats),
    epoques:   melangerAxe(affinitesBase.epoques, derivees.epoques),
    fins:      melangerAxe(affinitesBase.fins, derivees.fins),
    exigence:  Math.round(affinitesBase.exigence * (1 - p) + derivees.exigence * p),
    aimes:     unir(affinitesBase.aimes, derivees.aimes),
    tiedes:    unir(affinitesBase.tiedes, derivees.tiedes),
    exclus:    (affinitesBase.exclus || []).slice() // les exclusions restent délibérées
  };
}

/** Ensemble des clés d'œuvres déjà vues ou écartées (à ne pas re-suggérer). */
function cles_deja_traitees(journal){
  const clefs = new Set();
  for(const entree of journal || []){
    if(est_vu(entree.statut) || entree.statut === "refuse" || entree.statut === "jamais"){
      clefs.add(entree.cle);
    }
  }
  return clefs;
}

/**
 * Note une œuvre selon des affinités (échelle 0–4) et une empreinte de réalisateurs.
 * @param {object} oeuvre
 * @param {object} affinites
 * @param {Map<string,number>} scoresRealisateurs
 * @returns {number}
 */
function noter_selon_gouts(oeuvre, affinites, scoresRealisateurs){
  let score = 0;
  for(const registre of oeuvre.g) score += affinites.registres[registre] || 0;
  score += affinites.climats[oeuvre.c] || 0;
  score += affinites.epoques[oeuvre.e] || 0;
  score += affinites.fins[oeuvre.fin] || 0;
  score += 1.5 * compter_communs(oeuvre.tg, affinites.aimes);
  score -= 1.5 * compter_communs(oeuvre.tg, affinites.tiedes || []);
  score += (scoresRealisateurs.get(oeuvre.r) || 0) * 0.8;
  return score;
}

/**
 * Recommande des titres à partir de l'empreinte de goûts, en excluant les films déjà
 * vus ou écartés. Chaque proposition est accompagnée des films aimés qui l'expliquent.
 * @param {object[]} catalogue
 * @param {object} empreinte - issue de empreinte_gouts
 * @param {object} profil - pour le journal (exclusions) et les exclusions permanentes
 * @param {object} options - {graine, combien}
 * @returns {Array<{oeuvre: object, proches: string[]}>}
 */
function recommander_depuis_empreinte(catalogue, empreinte, profil, {graine = 1, combien = 3} = {}){
  const alea = fabriquer_alea(graine);
  const traitees = cles_deja_traitees(profil.journal);
  const af = empreinte.affinites;
  const exclusPermanents = (profil.affinites && profil.affinites.exclus) || [];
  const scoresRealisateurs = new Map(empreinte.realisateurs.map(r => [r.nom, r.score]));

  const candidats = [];
  for(const oeuvre of catalogue){
    if(traitees.has(cle_oeuvre(oeuvre))) continue;
    if(oeuvre.x > af.exigence + 1) continue;
    if(exclusPermanents.some(ex => ex === "sombre" ? oeuvre.fin === "sombre" : oeuvre.tg.includes(ex))) continue;
    const score = noter_selon_gouts(oeuvre, af, scoresRealisateurs) + alea() * 2;
    candidats.push({oeuvre, score});
  }
  candidats.sort((a, b) => b.score - a.score);

  const retenus = diversifier(candidats, combien);
  return retenus.map(oeuvre => ({
    oeuvre,
    proches: pourquoi_ce_gout(oeuvre, empreinte, profil.journal, catalogue)
  }));
}

/**
 * Trouve, parmi les films aimés, ceux qui expliquent le mieux une recommandation
 * (réalisateur commun, étiquettes partagées, même registre).
 * @param {object} oeuvre
 * @param {object} empreinte
 * @param {object[]} journal
 * @param {object[]} catalogue
 * @returns {string[]} un ou deux titres, du plus proche au moins proche
 */
function pourquoi_ce_gout(oeuvre, empreinte, journal, catalogue){
  const aimes = apparier_journal(journal, catalogue).filter(p => p.poids > 0);
  const proximite = (autre) => {
    if(cle_oeuvre(autre) === cle_oeuvre(oeuvre)) return -1;
    let score = 0;
    if(autre.r === oeuvre.r) score += 3;
    score += compter_communs(autre.tg, oeuvre.tg);
    if(autre.g.some(g => oeuvre.g.includes(g))) score += 1;
    if(autre.c === oeuvre.c) score += 0.5;
    return score;
  };
  return aimes
    .map(p => ({titre: p.oeuvre.t, score: proximite(p.oeuvre)}))
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 2)
    .map(x => x.titre);
}

/**
 * Les films préférés du profil : ceux qui ont reçu les meilleures notes.
 * @param {object[]} journal
 * @param {object[]} catalogue
 * @param {number} combien
 * @returns {Array<{oeuvre: object, note: number}>}
 */
function films_favoris(journal, catalogue, combien = 6){
  return apparier_journal(journal, catalogue)
    .filter(p => typeof p.entree.note === "number" && p.entree.note >= 4)
    .sort((a, b) => (b.entree.note - a.entree.note) || (b.entree.date || "").localeCompare(a.entree.date || ""))
    .slice(0, combien)
    .map(p => ({oeuvre: p.oeuvre, note: p.entree.note}));
}

/**
 * Passeport cinéphile : une photographie chiffrée de ce qui a été vu.
 * @param {object[]} journal
 * @param {object[]} catalogue
 * @returns {object} {vus, notes, minutes, noteMoyenne, decenniesVisitees, paysTraverses,
 *   realisateursFavoris, registreDominant, climatDominant}
 */
function passeport(journal, catalogue){
  const vusPaires = apparier_journal(journal, catalogue).filter(p => est_vu(p.entree.statut));
  const decennies = {}, pays = {}, realisateurs = {}, registres = {}, climats = {};
  let minutes = 0, sommeNotes = 0, nbNotes = 0;

  for(const {entree, oeuvre} of vusPaires){
    const min = duree_minutes(oeuvre.d);
    if(min !== null) minutes += min;
    const decennie = Math.floor(oeuvre.a / 10) * 10;
    decennies[decennie] = (decennies[decennie] || 0) + 1;
    realisateurs[oeuvre.r] = (realisateurs[oeuvre.r] || 0) + 1;
    for(const registre of oeuvre.g) registres[registre] = (registres[registre] || 0) + 1;
    climats[oeuvre.c] = (climats[oeuvre.c] || 0) + 1;
    for(const etiquette of oeuvre.tg){
      if(PAYS_ETIQUETTES[etiquette]){
        const nom = PAYS_ETIQUETTES[etiquette];
        pays[nom] = (pays[nom] || 0) + 1;
      }
    }
    if(typeof entree.note === "number"){ sommeNotes += entree.note; nbNotes += 1; }
  }

  const classer = (objet) => Object.entries(objet).sort((a, b) => b[1] - a[1]);
  const dominant = (objet) => { const t = classer(objet); return t.length ? t[0][0] : null; };

  return {
    vus: vusPaires.length,
    notes: nbNotes,
    minutes,
    noteMoyenne: nbNotes > 0 ? sommeNotes / nbNotes : null,
    decenniesVisitees: classer(decennies).map(([d, n]) => ({decennie: parseInt(d, 10), nombre: n})),
    paysTraverses: classer(pays).map(([nom, n]) => ({pays: nom, nombre: n})),
    realisateursFavoris: classer(realisateurs).slice(0, 6).map(([nom, n]) => ({nom, nombre: n})),
    registreDominant: dominant(registres),
    climatDominant: dominant(climats)
  };
}

/* ═══════════════════════════════════════════════════════════════
   4 quater. MOTEUR — ACTEURS, ROMANS, MOMENT, COLLECTIONS,
             VOISINAGE, COMPARAISON, DÉFIS, CHRONIQUE
   Toutes les fonctions de cette section sont pures.
   ═══════════════════════════════════════════════════════════════ */

/* ── T2. Acteurs ─────────────────────────────────────────────── */

/**
 * Tous les titres du catalogue où figure un acteur, du plus ancien au plus récent.
 * @param {object[]} catalogue
 * @param {string} acteur - nom exact tel qu'il figure dans le champ `dist`
 * @returns {object[]}
 */
function filmographie_acteur(catalogue, acteur){
  if(!acteur) return [];
  return catalogue
    .filter(oeuvre => Array.isArray(oeuvre.dist) && oeuvre.dist.indexOf(acteur) !== -1)
    .sort((a, b) => a.a - b.a);
}

/**
 * Recense les acteurs présents au catalogue, du plus présent au moins présent.
 * @param {object[]} catalogue
 * @param {number} minimum - nombre de titres à partir duquel l'acteur est retenu
 * @returns {Array<[string, number]>}
 */
function inventorier_acteurs(catalogue, minimum = 2){
  const compte = {};
  for(const oeuvre of catalogue){
    for(const acteur of oeuvre.dist || []) compte[acteur] = (compte[acteur] || 0) + 1;
  }
  return Object.entries(compte)
    .filter(([, n]) => n >= minimum)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "fr"));
}

/**
 * Les acteurs que le profil retrouve le plus souvent dans ce qu'il a aimé.
 * @param {object[]} journal
 * @param {object[]} catalogue
 * @param {number} combien
 * @returns {Array<{nom: string, nombre: number}>}
 */
function acteurs_favoris(journal, catalogue, combien = 6){
  const compte = {};
  for(const {oeuvre, poids} of apparier_journal(journal, catalogue)){
    if(poids <= 0) continue;
    for(const acteur of oeuvre.dist || []) compte[acteur] = (compte[acteur] || 0) + 1;
  }
  return Object.entries(compte)
    .sort((a, b) => b[1] - a[1])
    .slice(0, combien)
    .map(([nom, nombre]) => ({nom, nombre}));
}

/* ── T3. Le pont vers les romans ─────────────────────────────── */

/**
 * Toutes les adaptations d'un même auteur présentes au catalogue.
 * @param {object[]} catalogue
 * @param {string} auteur
 * @returns {object[]}
 */
function adaptations_de(catalogue, auteur){
  if(!auteur) return [];
  return catalogue
    .filter(oeuvre => oeuvre.src && oeuvre.src.auteur === auteur)
    .sort((a, b) => a.a - b.a);
}

/**
 * Les autres adaptations de la même œuvre d'origine (autres versions).
 * @param {object[]} catalogue
 * @param {object} oeuvre
 * @returns {object[]}
 */
function meme_source(catalogue, oeuvre){
  if(!oeuvre || !oeuvre.src) return [];
  const reference = cle_oeuvre(oeuvre);
  return catalogue.filter(autre =>
    autre.src
    && autre.src.auteur === oeuvre.src.auteur
    && autre.src.oeuvre === oeuvre.src.oeuvre
    && cle_oeuvre(autre) !== reference
  ).sort((a, b) => a.a - b.a);
}

/**
 * Recense les auteurs adaptés, du plus adapté au moins adapté.
 * @param {object[]} catalogue
 * @returns {Array<{auteur: string, nombre: number, oeuvres: string[]}>}
 */
function inventorier_auteurs(catalogue){
  const par_auteur = {};
  for(const oeuvre of catalogue){
    if(!oeuvre.src) continue;
    const auteur = oeuvre.src.auteur;
    if(!par_auteur[auteur]) par_auteur[auteur] = {auteur, nombre: 0, oeuvres: []};
    par_auteur[auteur].nombre += 1;
    if(par_auteur[auteur].oeuvres.indexOf(oeuvre.src.oeuvre) === -1){
      par_auteur[auteur].oeuvres.push(oeuvre.src.oeuvre);
    }
  }
  return Object.values(par_auteur)
    .sort((a, b) => b.nombre - a.nombre || a.auteur.localeCompare(b.auteur, "fr"));
}

/* ── T4. Le moment : saison et heure ─────────────────────────── */

const SAISONS = {
  hiver:     {nom:"hiver",     climats:["pluie","ville"],    registres:["refuge","eblouissement"]},
  printemps: {nom:"printemps", climats:["soleil","ville"],   registres:["rire","refuge"]},
  ete:       {nom:"été",       climats:["soleil","ailleurs"],registres:["eblouissement","rire"]},
  automne:   {nom:"automne",   climats:["pluie","ville"],    registres:["refuge","apprendre"]}
};

const MOMENTS = {
  matin:      {nom:"matin",       registres:["apprendre","refuge"]},
  apresmidi:  {nom:"après-midi",  registres:["rire","eblouissement"]},
  soir:       {nom:"soir",        registres:["eblouissement","tension"]},
  nuit:       {nom:"nuit",        registres:["tension","eblouissement"]}
};

/** Phrase d'ambiance associée à un couple saison / moment. */
const PHRASES_MOMENT = {
  "hiver|soir":"Un soir d'hiver : la lampe allumée, quelque chose d'enveloppant.",
  "hiver|nuit":"Nuit d'hiver, dehors il fait noir depuis longtemps.",
  "printemps|soir":"Un soir de printemps, la lumière traîne encore un peu.",
  "ete|soir":"Un soir d'été : la Méditerranée n'est jamais loin.",
  "ete|nuit":"Nuit d'été, fenêtre ouverte.",
  "automne|soir":"Un soir d'automne, la pluie contre la vitre.",
  "automne|nuit":"Nuit d'automne, le monde s'est tu."
};

/**
 * Déduit la saison et le moment de la journée d'une date donnée.
 * La date est injectée : la fonction ne lit jamais l'horloge elle-même,
 * ce qui la garde pure et testable.
 * @param {Date} date
 * @returns {{saison: object, moment: object, climats: string[], registres: string[], phrase: string}}
 */
function climat_du_moment(date){
  if(!(date instanceof Date) || Number.isNaN(date.getTime())){
    throw new Error("Date attendue, reçu : " + date);
  }
  const mois = date.getMonth() + 1;
  const heure = date.getHours();

  const cleSaison = (mois === 12 || mois <= 2) ? "hiver"
                  : mois <= 5 ? "printemps"
                  : mois <= 8 ? "ete" : "automne";
  const cleMoment = heure < 12 ? "matin"
                  : heure < 18 ? "apresmidi"
                  : heure < 23 ? "soir" : "nuit";

  const saison = SAISONS[cleSaison];
  const moment = MOMENTS[cleMoment];
  const registres = [...new Set([...moment.registres, ...saison.registres])];
  const phrase = PHRASES_MOMENT[cleSaison + "|" + cleMoment]
    || ("Un " + moment.nom + " d'" + saison.nom + ".").replace("d'printemps", "de printemps");

  return {saison, moment, climats: saison.climats.slice(), registres, phrase};
}

/**
 * Choisit un titre accordé au moment de la journée et à la saison.
 * @param {object[]} catalogue
 * @param {object} profil
 * @param {Date} date
 * @param {number} graine
 * @returns {object|null}
 */
function suggestion_du_moment(catalogue, profil, date, graine = 1){
  const air = climat_du_moment(date);
  const alea = fabriquer_alea(graine);
  const traitees = cles_deja_traitees(profil.journal);
  const af = profil.affinites;

  const candidats = [];
  for(const oeuvre of catalogue){
    if(traitees.has(cle_oeuvre(oeuvre))) continue;
    if(oeuvre.x > af.exigence) continue;
    if((af.exclus || []).some(ex => ex === "sombre" ? oeuvre.fin === "sombre" : oeuvre.tg.includes(ex))) continue;
    let score = 0;
    if(air.climats.indexOf(oeuvre.c) !== -1) score += 3;
    score += oeuvre.g.filter(g => air.registres.indexOf(g) !== -1).length * 2;
    score += compter_communs(oeuvre.tg, af.aimes) * 0.6;
    candidats.push({oeuvre, score: score + alea() * 2});
  }
  if(candidats.length === 0) return null;
  candidats.sort((a, b) => b.score - a.score);
  return candidats[0].oeuvre;
}

/* ── T5. Collections et recherches épinglées ─────────────────── */

/**
 * Crée une collection. Fonction pure : renvoie une nouvelle liste.
 * @param {object[]} collections
 * @param {string} nom
 * @returns {object[]}
 */
function creer_collection(collections, nom){
  const propre = (nom || "").trim();
  if(!propre) throw new Error("Nom de collection attendu, reçu une chaîne vide.");
  const identifiant = "c" + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36);
  return (collections || []).concat([{id: identifiant, nom: propre, cles: []}]);
}

/** Ajoute une clé d'œuvre à une collection, sans doublon. Fonction pure. */
function ajouter_a_collection(collections, identifiant, cle){
  return (collections || []).map(collection =>
    collection.id !== identifiant ? collection
      : Object.assign({}, collection, {
          cles: collection.cles.indexOf(cle) !== -1 ? collection.cles : collection.cles.concat([cle])
        })
  );
}

/** Retire une clé d'œuvre d'une collection. Fonction pure. */
function retirer_de_collection(collections, identifiant, cle){
  return (collections || []).map(collection =>
    collection.id !== identifiant ? collection
      : Object.assign({}, collection, {cles: collection.cles.filter(existante => existante !== cle)})
  );
}

/** Supprime une collection entière. Fonction pure. */
function supprimer_collection(collections, identifiant){
  return (collections || []).filter(collection => collection.id !== identifiant);
}

/**
 * Épingle une combinaison de critères de l'atelier sous un nom.
 * @param {object[]} recherches
 * @param {string} nom
 * @param {object} criteres - copié en profondeur pour rester indépendant de l'atelier
 * @returns {object[]}
 */
function enregistrer_recherche(recherches, nom, criteres){
  const propre = (nom || "").trim();
  if(!propre) throw new Error("Nom de recherche attendu, reçu une chaîne vide.");
  const identifiant = "r" + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36);
  return (recherches || []).concat([{
    id: identifiant, nom: propre, criteres: JSON.parse(JSON.stringify(criteres))
  }]);
}

/** Supprime une recherche épinglée. Fonction pure. */
function supprimer_recherche(recherches, identifiant){
  return (recherches || []).filter(recherche => recherche.id !== identifiant);
}

/* ── T6. La toile des voisins ────────────────────────────────── */

/**
 * Un pas dans la toile : l'œuvre courante et les titres qui lui tiennent la main.
 * Les voisins déclarés au catalogue priment, complétés par les voisins déduits.
 * @param {object} oeuvre
 * @param {object[]} catalogue
 * @param {number} combien
 * @returns {{oeuvre: object, voisins: Array<{oeuvre: object, lien: string}>}}
 */
function toile_voisins(oeuvre, catalogue, combien = 6){
  const reference = cle_oeuvre(oeuvre);
  const retenus = [];
  const vus = new Set([reference]);

  // Les voisins déclarés au catalogue le sont par titre : on les retrouve par titre normalisé.
  const parTitre = new Map();
  for(const autre of catalogue){
    if(!parTitre.has(normaliser(autre.t))) parTitre.set(normaliser(autre.t), autre);
  }
  for(const titre of oeuvre.v || []){
    const trouve = parTitre.get(normaliser(titre));
    if(trouve && !vus.has(cle_oeuvre(trouve))){
      retenus.push({oeuvre: trouve, lien: "cité comme voisin"});
      vus.add(cle_oeuvre(trouve));
    }
  }

  for(const autre of trouver_voisins(oeuvre, catalogue, combien * 2)){
    if(retenus.length >= combien) break;
    if(vus.has(cle_oeuvre(autre))) continue;
    const lien = autre.r === oeuvre.r ? "même réalisateur"
      : compter_communs(autre.tg, oeuvre.tg) >= 2 ? "mêmes motifs"
      : autre.c === oeuvre.c ? "même climat" : "air de famille";
    retenus.push({oeuvre: autre, lien});
    vus.add(cle_oeuvre(autre));
  }
  return {oeuvre, voisins: retenus.slice(0, combien)};
}

/* ── T7. Comparateur et défis ────────────────────────────────── */

/**
 * Compare deux œuvres et dégage ce qui les rapproche et ce qui les sépare.
 * @param {object} premiere
 * @param {object} seconde
 * @returns {object} {communs:{…}, ecarts:{…}}
 */
function comparer(premiere, seconde){
  if(!premiere || !seconde) throw new Error("Deux œuvres sont attendues pour comparer.");
  const dureeA = duree_minutes(premiere.d);
  const dureeB = duree_minutes(seconde.d);
  return {
    communs: {
      realisateur: premiere.r === seconde.r,
      registres: premiere.g.filter(registre => seconde.g.indexOf(registre) !== -1),
      climat: premiere.c === seconde.c ? premiere.c : null,
      epoque: premiere.e === seconde.e ? premiere.e : null,
      fin: premiere.fin === seconde.fin ? premiere.fin : null,
      etiquettes: premiere.tg.filter(etiquette => seconde.tg.indexOf(etiquette) !== -1),
      auteurSource: (premiere.src && seconde.src && premiere.src.auteur === seconde.src.auteur)
        ? premiere.src.auteur : null,
      acteurs: (premiere.dist || []).filter(acteur => (seconde.dist || []).indexOf(acteur) !== -1)
    },
    ecarts: {
      annees: Math.abs(premiere.a - seconde.a),
      exigence: Math.abs(premiere.x - seconde.x),
      duree: (dureeA !== null && dureeB !== null) ? Math.abs(dureeA - dureeB) : null
    }
  };
}

 * @returns {Array<{cle: string, libelle: string, nombre: number, titres: string[]}>}

  for(const {entree, oeuvre} of apparier_journal(journal, catalogue)){

/* ═══════════════════════════════════════════════════════════════
   MOTEUR ATLAS — les vingt fonctionnalités de la session 4.
   Toutes les fonctions de ce module sont pures : aucune lecture de
   l'horloge, aucun accès au stockage, aucun effet de bord. Les dates

/* ── F1. Le sablier ───────────────────────────────────────────── */

/**
 * Cherche ce qui tient exactement dans un temps disponible.
 * Un titre est retenu s'il occupe entre `part_minimale` et 100 % du temps :
 * inutile de proposer un film d'une heure quand on en a trois devant soi.
 * @param {object[]} catalogue - œuvres candidates
 * @param {number} minutes - temps disponible, entier strictement positif
 * @param {object} [options]
 * @param {number} [options.part_minimale=0.6] - fraction du temps à occuper au moins
 * @param {string[]} [options.exclure=[]] - clés d'œuvres à écarter
 * @param {number} [options.combien=12] - nombre maximal de résultats
 * @returns {object[]} œuvres triées du plus long au plus court
 * @throws {Error} si `minutes` n'est pas un entier positif
 */
function tenir_dans(catalogue, minutes, options = {}){
  if(!Array.isArray(catalogue)) throw new Error("Catalogue attendu, reçu : " + typeof catalogue);
  if(!Number.isFinite(minutes) || minutes <= 0){
    throw new Error("Durée en minutes attendue (nombre > 0), reçu : " + minutes);
  }
  const part_minimale = options.part_minimale != null ? options.part_minimale : 0.6;
  const exclure = new Set(options.exclure || []);
  const combien = options.combien != null ? options.combien : 12;
  const plancher = minutes * part_minimale;

  return catalogue
    .filter(oeuvre => {
      if(exclure.has(cle_oeuvre(oeuvre))) return false;
      const duree = duree_minutes(oeuvre.d);
      return duree !== null && duree <= minutes && duree >= plancher;
    })
    .sort((a, b) => duree_minutes(b.d) - duree_minutes(a.d))
    .slice(0, combien);
}

/**
 * Minutes de battement entre deux titres d'une même soirée.
 * Valeur unique partagée par la composition de la soirée et l'affichage des horaires :
 * les deux doivent réserver exactement le même temps, sans quoi la grille horaire
 * déborde du créneau que l'on vient d'annoncer comme tenable.
 */
const ENTRACTE_MINUTES = 15;

/**
 * Construit une soirée de plusieurs titres qui remplit le temps disponible.
 * Algorithme glouton : on prend le plus long qui rentre encore, puis on recommence.
 * Le temps réservé inclut les entractes, si bien que `total + entractes` ne dépasse
 * jamais le créneau demandé et que `reste` est le battement réellement disponible.
 * @param {object[]} catalogue
 * @param {number} minutes
 * @param {number} [graine=1] - graine du tirage, pour la reproductibilité
 * @returns {{titres: object[], total: number, entractes: number, reste: number}}
 */
function remplir_soiree(catalogue, minutes, graine = 1){
  if(!Number.isFinite(minutes) || minutes <= 0){
    throw new Error("Durée en minutes attendue (nombre > 0), reçu : " + minutes);
  }
  const alea = fabriquer_alea(graine);
  const disponibles = catalogue
    .filter(oeuvre => duree_minutes(oeuvre.d) !== null)
    .map(oeuvre => ({oeuvre, rang: alea()}))
    .sort((a, b) => a.rang - b.rang)
    .map(entree => entree.oeuvre);

  const titres = [];
  let reste = minutes;
  for(const oeuvre of disponibles){
    if(titres.length >= 4) break;
    const duree = duree_minutes(oeuvre.d);
    // À partir du deuxième titre, l'entracte qui le précède fait partie de son coût.
    const cout = duree + (titres.length > 0 ? ENTRACTE_MINUTES : 0);
    if(cout <= reste){ titres.push(oeuvre); reste -= cout; }
  }
  const total = titres.reduce((somme, oeuvre) => somme + duree_minutes(oeuvre.d), 0);
  const entractes = Math.max(0, titres.length - 1) * ENTRACTE_MINUTES;
  return {titres, total, entractes, reste: minutes - total - entractes};
}

function tirer_fils_rouges(catalogue, seuil = 6){

/* ── F3. La palette ───────────────────────────────────────────── */

/** Teintes de base par climat, en degrés de teinte HSL. */
const TEINTES_CLIMAT = {soleil: 38, pluie: 205, ville: 268, ailleurs: 152};
/** Décalage de saturation et de clarté selon l'époque. */
const NUANCES_EPOQUE = {passe: {sat:-14, clarte:-6}, present: {sat:0, clarte:0}, imaginaire: {sat:16, clarte:8}};

/**
 * Déduit une palette de cinq couleurs des attributs d'une œuvre.
 * Purement déterministe : la même œuvre donne toujours la même palette.
 * @param {object} oeuvre
 * @returns {string[]} cinq couleurs CSS au format hsl()
 * @throws {Error} si l'œuvre est absente
 */
function palette_oeuvre(oeuvre){
  if(!oeuvre || !oeuvre.t) throw new Error("Œuvre attendue, reçu : " + oeuvre);
  const base = TEINTES_CLIMAT[oeuvre.c] != null ? TEINTES_CLIMAT[oeuvre.c] : 210;
  const nuance = NUANCES_EPOQUE[oeuvre.e] || NUANCES_EPOQUE.present;
  // L'année fait dériver la teinte de quelques degrés : deux films du même
  // climat mais de décennies éloignées n'ont pas exactement la même couleur.
  const derive = ((oeuvre.a || 2000) % 40) - 20;
  const ecart = oeuvre.fin === "sombre" ? -12 : (oeuvre.fin === "douce" ? 10 : 0);

  const couleurs = [];
  for(let rang = 0; rang < 5; rang++){
    const teinte = (base + derive + rang * 14 + 360) % 360;
    const saturation = Math.max(8, Math.min(78, 30 + nuance.sat + rang * 6 + oeuvre.x * 4));
    const clarte = Math.max(12, Math.min(86, 20 + nuance.clarte + ecart + rang * 13));
    couleurs.push("hsl(" + Math.round(teinte) + " " + Math.round(saturation) + "% " + Math.round(clarte) + "%)");
  }
  return couleurs;
}

/* ── F4. Les six degrés ───────────────────────────────────────── */

/** Construit la table d'adjacence du catalogue à partir des voisins déclarés et déduits. */
function construire_liens(catalogue){
  const par_titre = new Map();
  for(const oeuvre of catalogue) par_titre.set(normaliser(oeuvre.t), oeuvre);

  const liens = new Map();
  for(const oeuvre of catalogue){
    const cle = cle_oeuvre(oeuvre);
    const voisins = new Set();
    for(const nom of oeuvre.v || []){
      const trouve = par_titre.get(normaliser(nom));
      if(trouve && cle_oeuvre(trouve) !== cle) voisins.add(cle_oeuvre(trouve));
    }
    liens.set(cle, voisins);
  }
  // Les liens déclarés sont rendus symétriques : si A cite B, on peut aller de B à A.
  for(const [cle, voisins] of liens){
    for(const voisin of voisins){
      if(liens.has(voisin)) liens.get(voisin).add(cle);
    }
  }
  // Renfort : même réalisateur, ou deux étiquettes partagées.
  const par_realisateur = new Map();
  for(const oeuvre of catalogue){
    const nom = normaliser(oeuvre.r);
    if(!par_realisateur.has(nom)) par_realisateur.set(nom, []);
    par_realisateur.get(nom).push(cle_oeuvre(oeuvre));
  }
  for(const cles of par_realisateur.values()){
    if(cles.length < 2) continue;
    for(const cle of cles){
      for(const autre of cles){ if(autre !== cle) liens.get(cle).add(autre); }
    }
  }
  return liens;
}

/**
 * Cherche le plus court chemin entre deux œuvres, de voisin en voisin.
 * Parcours en largeur : le chemin renvoyé est garanti minimal.
 * @param {object} depart
 * @param {object} arrivee
 * @param {object[]} catalogue
 * @param {number} [profondeur_max=6]
 * @returns {object[]|null} la suite d'œuvres du départ à l'arrivée, ou null
 * @throws {Error} si l'une des deux bornes manque
 */
function chemin_entre(depart, arrivee, catalogue, profondeur_max = 6){
  if(!depart || !arrivee) throw new Error("Deux œuvres attendues, reçu : " + depart + " et " + arrivee);
  const cle_depart = cle_oeuvre(depart);
  const cle_arrivee = cle_oeuvre(arrivee);
  if(cle_depart === cle_arrivee) return [depart];

  const liens = construire_liens(catalogue);
  const par_cle = new Map(catalogue.map(oeuvre => [cle_oeuvre(oeuvre), oeuvre]));
  const vus = new Set([cle_depart]);
  let front = [[cle_depart]];

  for(let pas = 0; pas < profondeur_max; pas++){
    const suivant = [];
    for(const chemin of front){
      const voisins = liens.get(chemin[chemin.length - 1]) || new Set();
      for(const voisin of voisins){
        if(vus.has(voisin)) continue;
        const allonge = chemin.concat([voisin]);
        if(voisin === cle_arrivee) return allonge.map(cle => par_cle.get(cle));
        vus.add(voisin);
        suivant.push(allonge);
      }
    }
    if(suivant.length === 0) break;
    front = suivant;
  }
  return null;
}

/**
 * Programme un festival de plusieurs jours, une ligne directrice par jour.
 * @param {object[]} catalogue
 * @param {object} profil - sert à écarter ce qui a déjà été vu
 * @param {number} jours - entre 2 et 7
 * @param {number} [graine=1]
 * @returns {Array<{ligne: object, oeuvres: object[]}>}
 * @throws {Error} si le nombre de jours sort de la plage permise
 */
function programmer_festival(catalogue, profil, jours, graine = 1){
  if(!Number.isInteger(jours) || jours < 2 || jours > 7){
    throw new Error("Nombre de jours attendu entre 2 et 7, reçu : " + jours);
  }
  const alea = fabriquer_alea(graine);
  const vues = new Set((profil && profil.journal || [])
    .filter(entree => entree.statut === "deja_vu").map(entree => entree.cle));
  const deja_programme = new Set();
  const programme = [];

  for(let jour = 0; jour < jours; jour++){
    const ligne = LIGNES_FESTIVAL[jour % LIGNES_FESTIVAL.length];
    const candidats = catalogue
      .filter(oeuvre => ligne.tient(oeuvre)
        && !vues.has(cle_oeuvre(oeuvre))
        && !deja_programme.has(cle_oeuvre(oeuvre)))
      .map(oeuvre => ({oeuvre, rang: alea()}))
      .sort((a, b) => a.rang - b.rang)
      .slice(0, 2)
      .map(entree => entree.oeuvre);
    candidats.forEach(oeuvre => deja_programme.add(cle_oeuvre(oeuvre)));
    programme.push({ligne, oeuvres: candidats});
  }
  return programme;
}

/* ── F6. Les éphémérides ──────────────────────────────────────── */

/**
 * Les anniversaires ronds de l'année en cours : titres qui fêtent
 * dix, vingt-cinq, cinquante ans, etc.
 * @param {object[]} catalogue
 * @param {Date} date - date de référence, injectée
 * @returns {Array<{age: number, oeuvres: object[]}>} triés par âge croissant
 * @throws {Error} si la date n'est pas une Date valide
 */
function ephemerides(catalogue, date){
  if(!(date instanceof Date) || isNaN(date.getTime())){
    throw new Error("Date attendue, reçu : " + date);
  }
  const annee = date.getFullYear();
  const jalons = [10, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90, 100];
  return jalons
    .map(age => ({age, oeuvres: catalogue.filter(oeuvre => oeuvre.a === annee - age)}))
    .filter(entree => entree.oeuvres.length > 0);
}

/* ── F7. Le baromètre ─────────────────────────────────────────── */

/**
 * Mesure l'audace des choix dans le temps : moyenne du niveau d'exigence
 * des titres vus, mois par mois.
 * @param {object[]} journal
 * @param {object[]} catalogue
 * @returns {Array<{cle: string, libelle: string, audace: number, nombre: number}>}
 */
function barometre_audace(journal, catalogue){
  if(!Array.isArray(journal)) throw new Error("Journal attendu, reçu : " + typeof journal);
  const par_cle = new Map(catalogue.map(oeuvre => [cle_oeuvre(oeuvre), oeuvre]));
  const mois = new Map();

  for(const entree of journal){
    if(entree.statut !== "deja_vu") continue;
    const oeuvre = par_cle.get(entree.cle);
    if(!oeuvre) continue;
    const date = new Date(entree.date);
    if(isNaN(date.getTime())) continue;
    const cle = date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0");
    if(!mois.has(cle)) mois.set(cle, {cle, somme: 0, nombre: 0});
    const seau = mois.get(cle);
    seau.somme += oeuvre.x;
    seau.nombre += 1;
  }

  return [...mois.values()]
    .sort((a, b) => a.cle.localeCompare(b.cle))
    .map(seau => ({
      cle: seau.cle,
      libelle: seau.cle,
      audace: Math.round((seau.somme / seau.nombre) * 100) / 100,
      nombre: seau.nombre
    }));
}

/* ── F8. Le kaléidoscope ──────────────────────────────────────── */

/**
 * Tire une grille de découverte aussi variée que possible : on force
 * la diversité de climat, de format et de décennie.
 * @param {object[]} catalogue
 * @param {number} [combien=12]
 * @param {number} [graine=1]
 * @returns {object[]}
 */
function kaleidoscope(catalogue, combien = 12, graine = 1){
  if(!Array.isArray(catalogue)) throw new Error("Catalogue attendu, reçu : " + typeof catalogue);
  const alea = fabriquer_alea(graine);
  const melange = catalogue
    .map(oeuvre => ({oeuvre, rang: alea()}))
    .sort((a, b) => a.rang - b.rang)
    .map(entree => entree.oeuvre);

  const choisis = [];
  const climats = new Map();
  const decennies = new Map();
  for(const oeuvre of melange){
    if(choisis.length >= combien) break;
    const decennie = Math.floor(oeuvre.a / 10) * 10;
    const vu_climat = climats.get(oeuvre.c) || 0;
    const vu_decennie = decennies.get(decennie) || 0;
    if(vu_climat >= Math.ceil(combien / 3)) continue;
    if(vu_decennie >= Math.ceil(combien / 4)) continue;
    choisis.push(oeuvre);
    climats.set(oeuvre.c, vu_climat + 1);
    decennies.set(decennie, vu_decennie + 1);
  }
  // Si les contraintes ont trop réduit la moisson, on complète sans elles.
  for(const oeuvre of melange){
    if(choisis.length >= combien) break;
    if(choisis.indexOf(oeuvre) === -1) choisis.push(oeuvre);
  }
  return choisis;
}

/**
 * Propose deux titres qui se répondent pour une même soirée.
 * @param {object[]} catalogue
 * @param {object} profil
 * @param {number} [graine=1]
 * @param {string|null} [accord_impose=null] - identifiant d'un accord de ACCORDS_DOUBLE
 * @returns {{accord: object, premier: object, second: object}|null}
 */
function composer_double(catalogue, profil, graine = 1, accord_impose = null){
  const alea = fabriquer_alea(graine);
  const vues = new Set((profil && profil.journal || [])
    .filter(entree => entree.statut === "deja_vu").map(entree => entree.cle));
  const disponibles = catalogue.filter(oeuvre => !vues.has(cle_oeuvre(oeuvre)));
  if(disponibles.length < 2) return null;

  const accords = accord_impose
    ? ACCORDS_DOUBLE.filter(accord => accord.id === accord_impose)
    : ACCORDS_DOUBLE;
  if(accords.length === 0) throw new Error("Accord inconnu : " + accord_impose);

  const accord = accords[Math.floor(alea() * accords.length)];
  const melange = disponibles
    .map(oeuvre => ({oeuvre, rang: alea()}))
    .sort((a, b) => a.rang - b.rang)
    .map(entree => entree.oeuvre);

  for(const premier of melange.slice(0, 140)){
    for(const second of melange){
      if(cle_oeuvre(second) === cle_oeuvre(premier)) continue;
      if(accord.accorde(premier, second)) return {accord, premier, second};
    }
  }
  return null;
}

/* ── F11. Les rituels ─────────────────────────────────────────── */

const JOURS_SEMAINE = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

/**
 * Crée un rituel. Fonction pure : renvoie une nouvelle liste.
 * @param {object[]} rituels - liste existante, non modifiée
 * @param {string} nom
 * @param {number} jour - index de jour, 0 pour dimanche
 * @param {object} [criteres={}] - critères au format de `filtrer_avance`
 * @returns {object[]} nouvelle liste
 * @throws {Error} si le nom est vide ou le jour hors plage
 */
function creer_rituel(rituels, nom, jour, criteres = {}){
  if(!Array.isArray(rituels)) throw new Error("Liste de rituels attendue, reçu : " + typeof rituels);
  const propre = String(nom || "").trim();
  if(!propre) throw new Error("Nom de rituel attendu, reçu une chaîne vide.");
  if(!Number.isInteger(jour) || jour < 0 || jour > 6){
    throw new Error("Jour attendu entre 0 et 6, reçu : " + jour);
  }
  // Copie en profondeur : les tableaux de critères ne doivent pas rester
  // partagés avec l'appelant, qui pourrait les modifier après coup.
  const criteres_copies = {};
  for(const [champ, valeur] of Object.entries(criteres)){
    criteres_copies[champ] = Array.isArray(valeur) ? valeur.slice() : valeur;
  }
  return rituels.concat([{
    id: "r" + Date.now().toString(36) + rituels.length,
    nom: propre,
    jour,
    criteres: criteres_copies
  }]);
}

/** Supprime un rituel par identifiant. Renvoie une nouvelle liste. */
function supprimer_rituel(rituels, id){
  if(!Array.isArray(rituels)) throw new Error("Liste de rituels attendue, reçu : " + typeof rituels);
  return rituels.filter(rituel => rituel.id !== id);
}

/**
 * Renvoie le rituel du jour, s'il y en a un.
 * @param {object[]} rituels
 * @param {Date} date - injectée
 * @returns {object|null}
 */
function rituel_du_jour(rituels, date){
  if(!(date instanceof Date) || isNaN(date.getTime())){
    throw new Error("Date attendue, reçu : " + date);
  }
  return (rituels || []).find(rituel => rituel.jour === date.getDay()) || null;
}

/* ── F12. Les notes de séance ─────────────────────────────────── */

/**
 * Enregistre les circonstances d'une séance. Fonction pure.
 * @param {object[]} seances - liste existante, non modifiée
 * @param {object} seance - {cle, date, lieu, avec, note}
 * @returns {object[]} nouvelle liste, la séance la plus récente en tête
 * @throws {Error} si la clé de l'œuvre manque
 */
function consigner_seance(seances, seance){
  if(!Array.isArray(seances)) throw new Error("Liste de séances attendue, reçu : " + typeof seances);
  if(!seance || !seance.cle) throw new Error("Séance avec une clé d'œuvre attendue, reçu : " + JSON.stringify(seance));
  const propre = {
    cle: seance.cle,
    date: seance.date || "",
    lieu: String(seance.lieu || "").trim(),
    avec: String(seance.avec || "").trim(),
    note: String(seance.note || "").trim()
  };
  return [propre].concat(seances.filter(autre =>
    !(autre.cle === propre.cle && autre.date === propre.date)));
}

/** Retrouve les séances consignées pour une œuvre. */
function seances_de(seances, cle){
  return (seances || []).filter(seance => seance.cle === cle);
}

/* ── F13 et F18. Cartes et chronomètre de soirée ──────────────── */

/**
 * Calcule les horaires d'une soirée à plusieurs titres, entractes compris.
 * @param {object[]} oeuvres
 * @param {string} depart - heure de début au format "20:30"
 * @param {number} [entracte=ENTRACTE_MINUTES] - minutes entre deux titres
 * @returns {Array<{oeuvre: object, debut: string, fin: string}>}
 * @throws {Error} si l'heure de départ est mal formée
 */
function horaires_soiree(oeuvres, depart, entracte = ENTRACTE_MINUTES){
  if(!Array.isArray(oeuvres)) throw new Error("Liste d'œuvres attendue, reçu : " + typeof oeuvres);
  const decoupe = /^(\d{1,2}):(\d{2})$/.exec(String(depart || "").trim());
  if(!decoupe) throw new Error('Heure attendue au format "20:30", reçu : ' + depart);

  let minute = parseInt(decoupe[1], 10) * 60 + parseInt(decoupe[2], 10);
  const formater = total => {
    const t = ((total % 1440) + 1440) % 1440;
    return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
  };

  return oeuvres.map((oeuvre, rang) => {
    if(rang > 0) minute += entracte;
    const debut = minute;
    minute += duree_minutes(oeuvre.d) || 100;
    return {oeuvre, debut: formater(debut), fin: formater(minute)};
  });
}

/* ── F14. La constellation ────────────────────────────────────── */

/**
 * Prépare les données d'une constellation : les œuvres d'un même auteur
 * placées selon l'année (abscisse) et l'exigence (ordonnée).
 * @param {object[]} oeuvres - filmographie déjà constituée
 * @returns {{points: Array<{oeuvre: object, x: number, y: number}>, min: number, max: number}}
 */
function constellation(oeuvres){
  if(!Array.isArray(oeuvres)) throw new Error("Liste d'œuvres attendue, reçu : " + typeof oeuvres);
  if(oeuvres.length === 0) return {points: [], min: 0, max: 0};
  const annees = oeuvres.map(oeuvre => oeuvre.a);
  const min = Math.min(...annees);
  const max = Math.max(...annees);
  const amplitude = max - min || 1;
  return {
    min, max,
    points: oeuvres.map(oeuvre => ({
      oeuvre,
      x: Math.round(((oeuvre.a - min) / amplitude) * 1000) / 1000,
      y: Math.round(((oeuvre.x - 1) / 2) * 1000) / 1000
    }))
  };
}

/* ── F15. L'import de collection ──────────────────────────────── */

/**
 * Reconnaît des titres dans un texte collé, une ligne par titre.
 * La reconnaissance est tolérante : titre normalisé, sans accent ni ponctuation.
 * @param {string} texte
 * @param {object[]} catalogue
 * @returns {{reconnus: object[], inconnus: string[]}}
 */
function reconnaitre_titres(texte, catalogue){
  if(typeof texte !== "string") throw new Error("Texte attendu, reçu : " + typeof texte);
  const par_titre = new Map();
  for(const oeuvre of catalogue){
    const cle = normaliser(oeuvre.t);
    if(!par_titre.has(cle)) par_titre.set(cle, oeuvre);
  }
  const reconnus = [];
  const inconnus = [];
  const deja = new Set();

  for(const ligne of texte.split("\n")){
    const propre = ligne.trim().replace(/^[-•*\d.)\s]+/, "").trim();
    if(!propre) continue;
    const trouve = par_titre.get(normaliser(propre));
    if(trouve && !deja.has(cle_oeuvre(trouve))){
      reconnus.push(trouve);
      deja.add(cle_oeuvre(trouve));
    } else if(!trouve){
      inconnus.push(propre);
    }
  }
  return {reconnus, inconnus};
}
