       + "aimé et atténue le reste. Trois films notés suffisent pour que les suggestions changent."},
    {titre:"Explorer sans questionnaire",
     texte:"L'atelier permet de composer toi-même : registres, climats, époques, durée, exigence. "
       + "Tu peux épingler une combinaison pour la rejouer plus tard. « Par l'ambiance » accepte "
       + "une description en mots libres."},
    {titre:"Se laisser guider autrement",
     texte:"Le sablier part du temps disponible. Le kaléidoscope tire au hasard mais varié. Le mode "
       + "aveugle décrit un titre sans le nommer. Le défi impose une contrainte. Le double programme "
       + "propose deux films qui se répondent."},
    {titre:"Naviguer dans le catalogue",
     texte:"Chaque fiche mène ailleurs : le réalisateur, les acteurs, l'auteur du livre adapté, les "
       + "voisins. Le fil permet d'avancer de titre en titre. Les six degrés cherchent le plus court "
       + "chemin entre deux films."},
    {titre:"Garder une trace",
     texte:"Les collections rangent tes titres par thème. Le carnet de bord montre tes mois, tes "
       + "décennies, tes angles morts. Les notes de séance retiennent où et avec qui tu as vu un film."},
    {titre:"Tes données",
     texte:"Tout vit dans le navigateur. Depuis les réglages, tu peux exporter une sauvegarde et la "
       + "réimporter ailleurs. Effacer les données du navigateur efface le profil : pense à exporter."}
  ];

  let html = '<section class="ecran">' + entete("Comment ça marche", "accueil")
    + '<h2 class="titre-question" tabindex="-1" data-focus>Mode d\'emploi</h2>';
  for(const section of sections){
    html += '<div class="bloc"><h3 class="section-titre">' + echapper(section.titre) + '</h3>'
      + '<p class="pitch">' + echapper(section.texte) + '</p></div>';
  }
  html += filet()
    + '<h3 class="section-titre">En une phrase</h3>'
    + '<p class="pitch">Plus tu marques ce que tu vois, plus les propositions te ressemblent. '
    + 'Et si tu ne veux rien décider, il y a toujours le hasard.</p>';
  return html + bandeau() + '</section>';
}

/* ── Câblage des écrans et des actions ────────────────────────── */

Object.assign(ECRANS, {
  sablier: ecran_sablier,
  fils_rouges: ecran_fils_rouges,
  degres: ecran_degres,
  festival: ecran_festival,
  ephemerides: ecran_ephemerides,
  kaleidoscope: ecran_kaleidoscope,
  double: ecran_double,
  aveugle: ecran_aveugle,
  rituels: ecran_rituels,
  import_liste: ecran_import,
  ambiance: ecran_ambiance,
  almanach: ecran_almanach,
  mode_emploi: ecran_mode_emploi
});

Object.assign(ACTIONS, {
  /* — Sablier — */
  "sablier-duree": (el) => { sablier_minutes = parseInt(el.dataset.minutes, 10); rendre(); },
  "sablier-mode": (el) => { sablier_mode = el.dataset.mode; rendre(); },
  "sablier-relancer": () => { graine_sablier = (graine_sablier + 1) % 100000; rendre(); },

  /* — Fils rouges — */
  "fil-rouge-ouvrir": (el) => { fil_rouge_ouvert = el.dataset.id; rendre(); },
  "fil-rouge-fermer": () => { fil_rouge_ouvert = null; rendre(); },

  /* — Six degrés — */
  "degres-cible": (el) => { degres_choix = el.dataset.cible; rendre({focus:false}); },
  "degres-poser": (el) => {
    const oeuvre = oeuvre_par_cle(el.dataset.cle);
    if(!oeuvre) return;
    if(degres_choix === "depart"){ degres_depart = oeuvre; degres_choix = "arrivee"; }
    else { degres_arrivee = oeuvre; degres_choix = "depart"; }
    brouillon_degres = "";
    rendre({focus:false});
  },
  "degres-vider": () => {
    degres_depart = null; degres_arrivee = null;
    degres_choix = "depart"; brouillon_degres = "";
    rendre();
  },

  /* — Festival — */
  "festival-jours": (el) => { festival_jours = parseInt(el.dataset.jours, 10); rendre(); },
  "festival-relancer": () => { graine_festival = (graine_festival + 1) % 100000; rendre(); },

  /* — Kaléidoscope — */
  "kaleidoscope-relancer": () => { graine_kaleidoscope = (graine_kaleidoscope + 1) % 100000; rendre(); },

  /* — Double programme — */
  "double-relancer": () => { graine_double = (graine_double + 1) % 100000; rendre(); },
  "double-accord": (el) => {
    accord_double = accord_double === el.dataset.id ? null : el.dataset.id;
    graine_double = (graine_double + 1) % 100000;
    rendre();
  },

  /* — Mode aveugle — */
  "aveugle-accepter": () => { aveugle_revele = true; rendre(); },
  "aveugle-passer": () => {
    graine_aveugle = (graine_aveugle + 1) % 100000;
    aveugle_cle = null; aveugle_revele = false;
    rendre();
  },

  /* — Rituels — */
  "rituel-jour": (el) => { rituel_jour = parseInt(el.dataset.jour, 10); rendre({focus:false}); },
  "creer-rituel": () => {
    const profil = profil_actif();
    if(!brouillon_rituel.trim()){ signaler("Donne un nom à ce rituel."); return; }
    profil.rituels = creer_rituel(profil.rituels || [], brouillon_rituel, rituel_jour, criteres_atelier());
    brouillon_rituel = "";
    sauver();
    signaler("Rituel créé.");
  },
  "supprimer-rituel": (el) => {
    const profil = profil_actif();
    profil.rituels = supprimer_rituel(profil.rituels || [], el.dataset.id);
    sauver();
    signaler("Rituel supprimé.");
  },

  /* — Import de collection — */
  "import-analyser": () => {
    import_resultat = reconnaitre_titres(brouillon_import, CATALOGUE);
    rendre({focus:false});
  },
  "import-ranger": () => {
    const profil = profil_actif();
    if(!import_resultat || import_resultat.reconnus.length === 0) return;
    profil.collections = creer_collection(profil.collections || [], "Liste importée");
    const creee = profil.collections[profil.collections.length - 1];
    creee.cles = import_resultat.reconnus.map(oeuvre => cle_oeuvre(oeuvre));
    import_resultat = null;
    brouillon_import = "";
    sauver();
    vue = "collections";
    signaler("Collection créée avec " + creee.cles.length + " titres.");
  },

  /* — Almanach — */
  "almanach-mois": (el) => { almanach_mois = parseInt(el.dataset.mois, 10); rendre({focus:false}); },

  /* — Notes de séance (F12) — */
  "consigner-seance": () => {
    const profil = profil_actif();
    if(!fiche_cle){ return; }
    profil.seances = consigner_seance(profil.seances || [], {
      cle: fiche_cle,
      date: new Date().toISOString().slice(0, 10),
      lieu: brouillon_seance.lieu,
      avec: brouillon_seance.avec,
      note: brouillon_seance.note
    });
    brouillon_seance = {lieu:"", avec:"", note:""};
    sauver();
    signaler("Séance consignée.");
  },

  /* — Horaire de soirée (F18) — */
  "heure-soiree": (el) => { heure_soiree = el.dataset.heure; rendre({focus:false}); }
});

/**
 * Redessine l'écran en rendant au champ son curseur là où il était.
 * Sans cela, taper une lettre ferait perdre le focus et la position.
 * Effet de bord assumé : déclenche un rendu et déplace le focus.
 * @param {string} id - identifiant du champ à retrouver après le rendu
 */
function rendre_en_gardant_le_curseur(id){
  const champ_avant = document.getElementById(id);
  const position = champ_avant ? champ_avant.selectionStart : null;
  rendre({focus: false});
  const champ_apres = document.getElementById(id);
  if(!champ_apres) return;
  champ_apres.focus();
  if(position !== null && champ_apres.setSelectionRange){
    try { champ_apres.setSelectionRange(position, position); }
    catch(erreur){ /* certains types de champ refusent la sélection : sans gravité */ }
  }
}

// Saisies en direct des champs de ce module.
app.addEventListener("input", evenement => {
  const champ = evenement.target;

  // Champs dont l'écran affiche des résultats en direct : on redessine.
  if(champ.id === "saisie-degres"){
    brouillon_degres = champ.value;
    rendre_en_gardant_le_curseur("saisie-degres");
    return;
  }
  if(champ.id === "saisie-ambiance"){
    brouillon_ambiance = champ.value;
    rendre_en_gardant_le_curseur("saisie-ambiance");
    return;
  }

  // Champs simplement mémorisés : le rendu viendra au clic sur un bouton.
  if(champ.id === "saisie-rituel") brouillon_rituel = champ.value;
  if(champ.id === "saisie-liste") brouillon_import = champ.value;
  if(champ.id === "seance-lieu") brouillon_seance.lieu = champ.value;
  if(champ.id === "seance-avec") brouillon_seance.avec = champ.value;
  if(champ.id === "seance-note") brouillon_seance.note = champ.value;
});
