/** Date courante, isolée ici : les fonctions du moteur la reçoivent en paramètre. */
function maintenant(){ return new Date(); }

/** Ligne de titre réutilisable, avec accès à la fiche. */
function ligne_titre(oeuvre, complement){
  return '<li class="liste__item">'
    + '<button class="liste__titre" data-agir="fiche" data-cle="' + echapper(cle_oeuvre(oeuvre)) + '">'
    + echapper(oeuvre.t) + '</button>'
    + '<span class="liste__meta">' + echapper(oeuvre.r) + ' · ' + oeuvre.a + ' · ' + echapper(oeuvre.d)
    + (complement ? ' · ' + echapper(complement) : '') + '</span></li>';
}

/** Palette SVG d'une œuvre (F3). Aucune image chargée : cinq rectangles calculés. */
function palette_svg(oeuvre){
  const couleurs = palette_oeuvre(oeuvre);
  let bandes = "";
  couleurs.forEach((couleur, rang) => {
    bandes += '<rect x="' + (rang * 20) + '" y="0" width="20" height="28" fill="' + couleur + '"/>';
  });
  return '<svg class="palette" viewBox="0 0 100 28" role="img" aria-label="Palette de couleurs du titre">'
    + bandes + '</svg>';
}

/** Constellation SVG d'une filmographie (F14). */
function constellation_svg(oeuvres){
  const donnees = constellation(oeuvres);
  if(donnees.points.length < 2) return "";
  let points = "";
  for(const point of donnees.points){
    const x = 6 + point.x * 88;
    const y = 46 - point.y * 34;
    points += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="1.8">'
      + '<title>' + echapper(point.oeuvre.t + " (" + point.oeuvre.a + ")") + '</title></circle>';
  }
  return '<figure class="constellation">'
    + '<svg viewBox="0 0 100 54" role="img" aria-label="Répartition des œuvres par année et exigence">'
    + '<line x1="6" y1="48" x2="94" y2="48" class="axe"/>'
    + '<line x1="6" y1="48" x2="6" y2="8" class="axe"/>'
    + points + '</svg>'
    + '<figcaption>De ' + donnees.min + ' à ' + donnees.max
    + ' — plus le point est haut, plus le film demande d\'attention.</figcaption></figure>';
}

/* ── F1. Le sablier ───────────────────────────────────────────── */

function ecran_sablier(profil){
  const paliers = [45, 60, 90, 100, 120, 150, 180, 240];
  let html = '<section class="ecran">' + entete("Le sablier", "accueil")
    + '<h2 class="titre-question" tabindex="-1" data-focus>Combien de temps as-tu ?</h2>'
    + '<p class="sous-titre">On ne cherche pas ce qui rentre : on cherche ce qui remplit.</p>'
    + '<div class="options options--grille">';
  for(const palier of paliers){
    html += '<button class="option' + (sablier_minutes === palier ? " option--choisie" : "") + '"'
      + ' data-agir="sablier-duree" data-minutes="' + palier + '">'
      + '<span class="option__marque"></span><span class="option__texte"><strong>'
      + formater_duree(palier) + '</strong></span></button>';
  }
  html += '</div>'
    + '<div class="bascule">'
    + '<button class="lien' + (sablier_mode === "un" ? " lien--actif" : "") + '" data-agir="sablier-mode" data-mode="un">Un seul titre</button>'
    + '<span class="lien-sep">·</span>'
    + '<button class="lien' + (sablier_mode === "soiree" ? " lien--actif" : "") + '" data-agir="sablier-mode" data-mode="soiree">Une soirée entière</button>'
    + '</div>' + filet();

  if(sablier_mode === "un"){
    const vues = (profil.journal || []).filter(e => e.statut === "deja_vu").map(e => e.cle);
    const trouves = tenir_dans(CATALOGUE, sablier_minutes, {exclure: vues, combien: 14});
    html += trouves.length === 0
      ? '<p class="vide">Rien ne remplit exactement ce créneau. Essaie une autre durée.</p>'
      : '<ul class="liste">' + trouves.map(o =>
          ligne_titre(o, formater_duree(duree_minutes(o.d)))).join("") + '</ul>';
  } else {
    const soiree = remplir_soiree(CATALOGUE, sablier_minutes, graine_sablier);
    if(soiree.titres.length === 0){
      html += '<p class="vide">Pas de combinaison trouvée pour ce créneau.</p>';
    } else {
      const horaires = horaires_soiree(soiree.titres, heure_soiree, 15);
      html += '<p class="sous-titre">' + soiree.titres.length + ' titres, '
        + formater_duree(soiree.total) + ' de projection, '
        + formater_duree(Math.max(0, soiree.reste)) + ' de battement.</p>'
        + '<ul class="liste">' + horaires.map(creneau =>
            ligne_titre(creneau.oeuvre, creneau.debut + " → " + creneau.fin)).join("") + '</ul>'
        + '<button class="bouton bouton--second" data-agir="sablier-relancer">Une autre combinaison</button>';
    }
  }
  return html + bandeau() + '</section>';
}

    html += '<ul class="liste liste--compacte">' + trouves.map(o =>

    html += '<button class="option' + (rituel_jour === index ? " option--choisie" : "") + '"'
      + ' data-agir="rituel-jour" data-jour="' + index + '">'
      + '<span class="option__marque"></span><span class="option__texte"><strong>'
      + nom.charAt(0).toUpperCase() + nom.slice(1) + '</strong></span></button>';
  });
  html += '</div>'
    + '<button class="bouton" data-agir="creer-rituel">Créer ce rituel</button>' + filet();

  if(rituels.length === 0){
    html += '<p class="vide">Aucun rituel pour l\'instant.</p>';
  } else {
    const aujourdhui = rituel_du_jour(rituels, maintenant());
    for(const rituel of rituels){
      const actif = aujourdhui && aujourdhui.id === rituel.id;
      const propositions_rituel = filtrer_avance(CATALOGUE, rituel.criteres || {}).slice(0, 3);
      html += '<div class="bloc' + (actif ? " bloc--actif" : "") + '">'
        + '<h3 class="section-titre">' + echapper(rituel.nom)
        + ' <span class="etiquette">' + echapper(JOURS_SEMAINE[rituel.jour]) + '</span>'
        + (actif ? ' <span class="etiquette etiquette--vive">c\'est aujourd\'hui</span>' : '') + '</h3>'
        + (propositions_rituel.length
            ? '<ul class="liste">' + propositions_rituel.map(o => ligne_titre(o, String(o.a))).join("") + '</ul>'
            : '<p class="vide">Aucun titre ne correspond.</p>')
        + '<button class="lien lien--mini" data-agir="supprimer-rituel" data-id="' + echapper(rituel.id) + '">Supprimer</button>'
        + '</div>';
    }
  }
  return html + bandeau() + '</section>';
}

/* ── F15. L'import de collection ──────────────────────────────── */

/* ── F16. La recherche par ambiance ───────────────────────────── */

function ecran_ambiance(){
  let html = '<section class="ecran">' + entete("Par l'ambiance", "accueil")
    + '<h2 class="titre-question" tabindex="-1" data-focus>Décris ce que tu veux ressentir</h2>'
    + '<p class="sous-titre">Écris librement : « quelque chose de doux, sous la pluie, un peu ancien ».</p>'
    + '<input class="champ" id="saisie-ambiance" type="search" autocomplete="off"'
    + ' placeholder="doux, pluie, ancien, costume" value="' + echapper(brouillon_ambiance) + '">';

  if(brouillon_ambiance.trim()){
    const lecture = interpreter_ambiance(brouillon_ambiance);
    if(lecture.reconnus.length === 0){
      html += '<p class="vide">Aucun mot d\'ambiance reconnu. Essaie : doux, tendu, soleil, pluie, ancien, drôle, exigeant.</p>';
    } else {
      html += '<p class="sous-titre">Compris : ' + echapper(lecture.reconnus.join(", ")) + '</p>';
      const criteres = Object.assign({}, lecture.criteres);
      if(lecture.texte) criteres.texte = lecture.texte;
      const trouves = filtrer_avance(CATALOGUE, criteres).slice(0, 30);
      html += trouves.length === 0
        ? '<p class="vide">Rien ne réunit toutes ces conditions. Retire un mot.</p>'
        : '<ul class="liste">' + trouves.map(o => ligne_titre(o, String(o.a))).join("") + '</ul>';
    }
  }
  return html + bandeau() + '</section>';
}

/* ── F20. L'almanach ──────────────────────────────────────────── */

const NOMS_MOIS = ["janvier","février","mars","avril","mai","juin",
                   "juillet","août","septembre","octobre","novembre","décembre"];

function ecran_almanach(profil){
  const annee = maintenant().getFullYear();
  const semaines = almanach(CATALOGUE, profil, annee, 52);
  let html = '<section class="ecran">' + entete("Almanach", "accueil")
    + '<h2 class="titre-question" tabindex="-1" data-focus>Une année, une suggestion par semaine</h2>'
    + '<p class="sous-titre">Accordée aux saisons. Reproductible : la même année donne le même almanach.</p>'
    + '<div class="bascule bascule--mois">';
  NOMS_MOIS.forEach((nom, index) => {
    html += '<button class="lien' + (almanach_mois === index ? " lien--actif" : "") + '"'
      + ' data-agir="almanach-mois" data-mois="' + index + '">' + nom + '</button>';
  });
  html += '</div>' + filet();

  const du_mois = semaines.filter(entree => entree.mois === almanach_mois && entree.oeuvre);
  html += du_mois.length === 0
    ? '<p class="vide">Rien pour ce mois.</p>'
    : '<ul class="liste">' + du_mois.map(entree =>
        ligne_titre(entree.oeuvre, "semaine " + entree.semaine)).join("") + '</ul>';
  return html + bandeau() + '</section>';
}

/**
 * Redessine l'écran en rendant au champ son curseur là où il était.
 * Sans cela, taper une lettre ferait perdre le focus et la position.
 * Effet de bord assumé : déclenche un rendu et déplace le focus.
 * @param {string} id - identifiant du champ à retrouver après le rendu
 */
function rendre_en_gardant_le_curseur(id){
  const champ_avant = document.getElementById(id);
  const position = champ_avant ? champ_avant.selectionStart : null;
  rendre({focus: false});
  const champ_apres = document.getElementById(id);
  if(!champ_apres) return;
  champ_apres.focus();
  if(position !== null && champ_apres.setSelectionRange){
    try { champ_apres.setSelectionRange(position, position); }
    catch(erreur){ /* certains types de champ refusent la sélection : sans gravité */ }
  }
}

// Saisies en direct des champs de ce module.
app.addEventListener("input", evenement => {
  const champ = evenement.target;

  // Champs dont l'écran affiche des résultats en direct : on redessine.
  if(champ.id === "saisie-degres"){
    brouillon_degres = champ.value;
    rendre_en_gardant_le_curseur("saisie-degres");
    return;
  }
  if(champ.id === "saisie-ambiance"){
    brouillon_ambiance = champ.value;
    rendre_en_gardant_le_curseur("saisie-ambiance");
    return;
  }

  // Champs simplement mémorisés : le rendu viendra au clic sur un bouton.
  if(champ.id === "saisie-rituel") brouillon_rituel = champ.value;
  if(champ.id === "saisie-liste") brouillon_import = champ.value;
  if(champ.id === "seance-lieu") brouillon_seance.lieu = champ.value;
  if(champ.id === "seance-avec") brouillon_seance.avec = champ.value;
  if(champ.id === "seance-note") brouillon_seance.note = champ.value;
});
