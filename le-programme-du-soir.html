/** Copie profonde sans partage de référence. */
function copier(valeur){ return JSON.parse(JSON.stringify(valeur)); }

/**
 * Convertit un état enregistré par une version antérieure vers le schéma courant.
 * @param {object} brut
 * @param {object[]} catalogue
 * @returns {object}
 */
function migrer(brut, catalogue){
  if(!brut || !Array.isArray(brut.profils) || brut.profils.length === 0) return null;
  const par_titre = new Map();
  for(const oeuvre of catalogue){
    if(!par_titre.has(normaliser(oeuvre.t))) par_titre.set(normaliser(oeuvre.t), oeuvre);
  }
  const profils = brut.profils.map(ancien => {
    const affinites = Object.assign(
      {registres:{}, climats:{}, epoques:{}, fins:{}, exigence:2, aimes:[], tiedes:[], exclus:[]},
      ancien.affinites || {}
    );
    if(!Array.isArray(affinites.tiedes)) affinites.tiedes = [];
    if(!Array.isArray(affinites.exclus)) affinites.exclus = [];
    if(!Array.isArray(affinites.aimes)) affinites.aimes = [];

    const journal = (ancien.journal || []).map(entree => {
      if(entree.cle) return entree;
      const trouve = par_titre.get(normaliser(entree.titre));
      return {
        cle: trouve ? cle_oeuvre(trouve) : normaliser(entree.titre) + "|film",
        titre: entree.titre,
        format: trouve ? trouve.f : "film",
        statut: entree.statut || "deja_vu",
        note: typeof entree.note === "number" ? entree.note : null,
        commentaire: entree.commentaire || "",
        date: entree.date || new Date().toISOString()
      };
    });
    // Les anciens repères étaient séparés par des virgules ; on passe à une ligne par titre.
    const reperes = typeof ancien.reperes === "string" && ancien.reperes.indexOf("\n") === -1
      ? ancien.reperes.split(",").map(t => t.trim()).filter(Boolean).join("\n")
      : (ancien.reperes || "");

    return {
      id: ancien.id, prenom: ancien.prenom, theme: ancien.theme || "vert",
      reperes, affinites, journal,
      aVoir: Array.isArray(ancien.aVoir) ? ancien.aVoir : [],
      // Schéma 4 : collections personnelles et recherches épinglées.
      collections: Array.isArray(ancien.collections) ? ancien.collections : [],
      recherches: Array.isArray(ancien.recherches) ? ancien.recherches : [],
      // Schéma 5 : rituels hebdomadaires et notes de séance.
      rituels: Array.isArray(ancien.rituels) ? ancien.rituels : [],
      seances: Array.isArray(ancien.seances) ? ancien.seances : []
    };
  });
  return {version: VERSION_SCHEMA, profils, actif: brut.actif || null, ajouts: brut.ajouts || []};
}

/**
 * Lit l'état persistant. Ne lève jamais.
 * Priorité : API d'artefact, puis stockage local du navigateur, puis mémoire de session.
 * @returns {Promise<object|null>}
 */
function lire_etat(){
  return new Promise(resoudre => {
    if(window.storage && typeof window.storage.get === "function"){
      window.storage.get(CLE_STOCKAGE)
        .then(resultat => {
          try { resoudre(resultat && resultat.value ? JSON.parse(resultat.value) : null); }
          catch(e){ resoudre(null); }
        })
        .catch(() => resoudre(lire_local()));
      return;
    }
    resoudre(lire_local());
  });
}

/** Lecture directe du stockage du navigateur. Ne lève jamais. */
function lire_local(){
  try {
    const brut = window.localStorage.getItem(CLE_STOCKAGE);
    return brut ? JSON.parse(brut) : memoire_secours;
  } catch(e){ return memoire_secours; }
}

/**
 * Écrit l'état persistant. Ne lève jamais.
 * @param {object} valeur
 */
function ecrire_etat(valeur){
  memoire_secours = valeur;
  const texte = JSON.stringify(valeur);
  if(window.storage && typeof window.storage.set === "function"){
    window.storage.set(CLE_STOCKAGE, texte).catch(() => {});
    return;
  }
  try { window.localStorage.setItem(CLE_STOCKAGE, texte); } catch(e){}
}

function sauver(){ ecrire_etat(etat); }

      + '<em>' + vus + ' titre' + (vus > 1 ? "s" : "") + ' vu' + (vus > 1 ? "s" : "")
      + ' · ' + profil.aVoir.length + ' à voir</em></button>'
      + (etat.profils.length > 1
          ? '<button class="lien lien--mini" data-agir="supprimer-profil" data-id="' + echapper(profil.id) + '">retirer</button>'
          : '')
      + '</div>';
  }
  html += '</div>'
    + '<button class="bouton bouton--primaire" data-agir="aller" data-vue="creation">Créer un profil</button>'
    + '<button class="bouton bouton--second" data-agir="aller" data-vue="donnees">Sauvegarde et restauration</button>'
    + '<p class="compteur">' + catalogue_complet().length + ' titres au catalogue</p>'
    + bandeau() + '</section>';
  return html;
}

function ecran_creation(){

  if(pas === 0){
    html += '<h2 class="titre-question" tabindex="-1" data-focus>Comment tu t\'appelles ?</h2>'

      + (question.multi ? '<p class="aide aide--serree">Plusieurs réponses possibles.</p>' : '')

    html += '<h2 class="titre-question" tabindex="-1" data-focus>Tes références</h2>'

/** Questions de séance applicables à l'humeur en cours. */
function questions_applicables(){
  return SESSION.filter(question => typeof question.si !== "function" || question.si(humeur));
}

function ecran_session(){
  const questions = questions_applicables();
  const index = Math.min(pas, questions.length - 1);
  const question = questions[index];
  const derniere = index === questions.length - 1;
  const complet = questions.every(q => humeur[q.id]);

  let html = '<section class="ecran">'
    + '<header class="entete">'
    + '<button class="lien lien--retour" data-agir="session-retour">← Retour</button>'
    + '<span class="eyebrow">Séance · ' + (index + 1) + ' / ' + questions.length + '</span></header>'
    + jauge((index + 1) / questions.length)
    + '<h2 class="titre-question" tabindex="-1" data-focus>' + echapper(question.q) + '</h2>'
    + options_html(question, humeur[question.id], true);
  if(derniere){
    html += '<button class="bouton bouton--primaire" data-agir="lancer"' + (complet ? "" : " disabled") + '>'
      + 'Allumer la lanterne</button>';
  }
  return html + '</section>';
}

function ecran_fiche(profil){
  const catalogue = catalogue_complet();
  const oeuvre = catalogue.find(candidat => cle_oeuvre(candidat) === fiche_cle);
  if(!oeuvre){
    return '<section class="ecran">' + entete("Fiche", "accueil")
      + '<p class="vide">Ce titre n\'est plus au catalogue.</p></section>';
  }
  const entree = entree_journal(profil, oeuvre);
  const dansListe = profil.aVoir.indexOf(fiche_cle) !== -1;
  const voisins = trouver_voisins(oeuvre, catalogue);
  const minutes = duree_minutes(oeuvre.d);

  const traits = [
    ["Registre", oeuvre.g.join(", ")],
    ["Climat", oeuvre.c],
    ["Époque", {passe:"passé", present:"présent", imaginaire:"imaginaire"}[oeuvre.e]],
    ["Fin", oeuvre.fin],
    ["Exigence", ["", "fluide", "moyenne", "élevée"][oeuvre.x]],
    ["En famille", oeuvre.fam ? "oui" : "non"]
  ];

  let html = '<section class="ecran">' + entete("Fiche", ecran_retour)
    + '<h2 class="cartel__titre" tabindex="-1" data-focus>' + echapper(oeuvre.t) + '</h2>'
    + '<p class="cartel__signature"><button class="lien-auteur" data-agir="realisateur" data-nom="' + echapper(oeuvre.r) + '">' + echapper(oeuvre.r) + '</button> · ' + oeuvre.a + '</p>'
    + '<p class="cartel__format">' + LIBELLES_FORMAT[oeuvre.f] + ' · ' + echapper(oeuvre.d)
    + (minutes ? ' · ' + formater_duree(minutes) : '') + '</p>'
    + filet()
    + '<p class="cartel__pitch">' + echapper(oeuvre.p) + '</p>'
    + '<p class="eyebrow eyebrow--interne">Signalement</p>';
  for(const [cle, valeur] of traits){
    html += '<div class="stat"><span class="stat__cle">' + echapper(cle) + '</span>'
      + '<span class="stat__val">' + echapper(valeur) + '</span></div>';
  }
  // Distribution : chaque nom ouvre la page de l'acteur.
  if(Array.isArray(oeuvre.dist) && oeuvre.dist.length){
    html += '<p class="eyebrow eyebrow--interne">À l\'écran</p><div class="puces">'
      + oeuvre.dist.map(acteur => '<button class="puce" data-agir="acteur" data-nom="'
          + echapper(acteur) + '">' + echapper(acteur) + '</button>').join("")
      + '</div>';
  }

  // Le pont vers le livre d'origine, et les autres versions s'il en existe.
  if(oeuvre.src){
    html += '<p class="eyebrow eyebrow--interne">D\'après</p>'
      + '<p class="source"><span class="source__oeuvre">' + echapper(oeuvre.src.oeuvre) + '</span>'
      + ' <span class="source__nature">(' + echapper(oeuvre.src.nature) + ')</span> de '
      + '<button class="lien-auteur" data-agir="auteur" data-nom="' + echapper(oeuvre.src.auteur) + '">'
      + echapper(oeuvre.src.auteur) + '</button></p>';
    const versions = meme_source(catalogue_complet(), oeuvre);
    if(versions.length){
      html += '<p class="aide aide--serree">Autre' + (versions.length > 1 ? "s" : "") + ' version'
        + (versions.length > 1 ? "s" : "") + ' au catalogue : '
        + versions.map(autre => '<button class="lien lien--mini" data-agir="fiche" data-cle="'
            + echapper(cle_oeuvre(autre)) + '">' + echapper(autre.t) + ' (' + autre.a + ')</button>').join(", ")
        + '</p>';
    }
  }

  html += '<p class="eyebrow eyebrow--interne">Étiquettes</p><div class="puces">'
    + oeuvre.tg.map(t => '<button class="puce" data-agir="filtrer-etiquette" data-etiquette="'
        + echapper(t) + '">' + echapper(t) + '</button>').join("")
    + '</div>'
    + '<p class="eyebrow eyebrow--interne">Où le trouver</p>'
    + '<p class="dispo__texte">' + (oeuvre.pf ? echapper(oeuvre.pf) : "Catalogues variables — vérifie le lien") + '</p>'
    + '<a class="dispo__lien" href="' + lien_recherche(oeuvre.t) + '" target="_blank" rel="noreferrer">Chercher sur JustWatch ↗</a>';

  html += '<p class="eyebrow eyebrow--interne">Ton avis</p><div class="etoiles">';
  for(let n = 1; n <= 5; n++){
    const pleine = entree && entree.note >= n;
    html += '<button class="etoile' + (pleine ? " etoile--pleine" : "") + '" data-agir="noter"'
      + ' data-cle="' + echapper(fiche_cle) + '" data-note="' + n + '"'
      + ' aria-label="Noter ' + n + ' sur 5">' + (pleine ? "◆" : "◇") + '</button>';
  }
  html += '</div>';
  if(entree && typeof entree.note === "number"){
    html += '<p class="note-info">Noté ' + entree.note + ' sur 5 — le profil en a tenu compte</p>';
  }

  html += '<label class="eyebrow eyebrow--interne" for="saisie-commentaire">Ta note personnelle</label>'
    + '<textarea class="champ champ--long" id="saisie-commentaire" rows="3">'
    + echapper(entree ? entree.commentaire : "") + '</textarea>'
    + '<button class="bouton bouton--second" data-agir="commenter" data-cle="' + echapper(fiche_cle) + '">Enregistrer la note</button>';

  html += '<p class="eyebrow eyebrow--interne">Classer</p><div class="puces">';
  for(const statut of ["pris", "en_cours", "deja_vu", "refuse", "jamais"]){
    const actif = entree && entree.statut === statut;
    html += '<button class="puce' + (actif ? " puce--active" : "") + '" data-agir="statut"'
      + ' data-cle="' + echapper(fiche_cle) + '" data-statut="' + statut + '">'
      + LIBELLES_STATUT[statut] + '</button>';
  }
  html += '</div><div class="actions">'
    + '<button class="bouton bouton--fin" data-agir="avoir" data-cle="' + echapper(fiche_cle) + '">'
    + (dansListe ? "Retirer de « à voir »" : "Ajouter à « à voir »") + '</button>';
  if(entree){
    html += '<button class="bouton bouton--fin" data-agir="oublier" data-cle="' + echapper(fiche_cle) + '">Oublier</button>';
  }
  html += '</div><div class="actions">'
    + '<button class="bouton bouton--fin" data-agir="vers-marathon" data-cle="' + echapper(fiche_cle) + '">Ajouter à la soirée</button>'
    + '<button class="bouton bouton--fin" data-agir="vers-collection" data-cle="' + echapper(fiche_cle) + '">Ranger dans une collection</button>'
    + '<button class="bouton bouton--fin" data-agir="vers-comparaison" data-cle="' + echapper(fiche_cle) + '">Comparer ce titre</button>'
    + '<button class="bouton bouton--fin" data-agir="fil-depuis" data-cle="' + echapper(fiche_cle) + '">Tirer le fil depuis ici</button>'
    + '</div>';

  // F3 — palette déduite du climat, de l'époque et de la fin.
  html += '<p class="eyebrow eyebrow--interne">Sa couleur</p>' + palette_svg(oeuvre);

  // F12 — carnet de séance : où, avec qui, ce qu'il en reste.
  const seances_passees = seances_de(profil.seances || [], fiche_cle);
  html += '<p class="eyebrow eyebrow--interne">Carnet de séance</p>';
  if(seances_passees.length > 0){
    html += '<ul class="liste liste--compacte">' + seances_passees.map(seance =>
      '<li class="liste__item"><span class="liste__titre">'
      + echapper(seance.date || "sans date")
      + (seance.lieu ? ' — ' + echapper(seance.lieu) : '')
      + (seance.avec ? ' — avec ' + echapper(seance.avec) : '') + '</span>'
      + (seance.note ? '<span class="liste__meta">' + echapper(seance.note) + '</span>' : '')
      + '</li>').join("") + '</ul>';
  }
  html += '<input class="champ" id="seance-lieu" type="text" placeholder="Où ?" value="'
    + echapper(brouillon_seance.lieu) + '">'
    + '<input class="champ" id="seance-avec" type="text" placeholder="Avec qui ?" value="'
    + echapper(brouillon_seance.avec) + '">'
    + '<textarea class="champ champ--zone" id="seance-note" rows="2" placeholder="Ce qu\'il en reste">'
    + echapper(brouillon_seance.note) + '</textarea>'
    + '<button class="bouton bouton--second" data-agir="consigner-seance">Consigner cette séance</button>';

  if(voisins.length > 0){
    html += '<p class="eyebrow eyebrow--interne">Dans la même famille</p><ul class="liste">'
      + voisins.map(voisin => ligne_liste(voisin)).join("") + '</ul>';
  }
  return html + bandeau() + '</section>';
}

function ecran_explorer(profil){
  const catalogue = catalogue_complet();
  let resultats = chercher(catalogue, recherche);
  const tris = {
    titre:  (a, b) => a.t.localeCompare(b.t, "fr"),
    annee:  (a, b) => b.a - a.a,
    auteur: (a, b) => a.r.localeCompare(b.r, "fr"),
    duree:  (a, b) => (duree_minutes(a.d) || 9999) - (duree_minutes(b.d) || 9999)
  };
  resultats = resultats.slice().sort(tris[recherche.tri] || tris.titre);

  const etiquettes = inventorier_etiquettes(catalogue).slice(0, 24);
  let html = '<section class="ecran">' + entete("Explorer", "accueil")
    + '<h2 class="titre-question" tabindex="-1" data-focus>Le catalogue</h2>'
    + '<input class="champ" id="saisie-recherche" placeholder="Titre, réalisateur, étiquette…" '
    + 'value="' + echapper(recherche.texte) + '" data-agir-saisie="recherche">'
    + '<p class="eyebrow eyebrow--interne">Format</p><div class="puces">';
  for(const [valeur, libelle] of [["tout","Tous"],["film","Films"],["serie","Séries"],["doc","Documentaires"]]){
    html += '<button class="puce' + (recherche.format === valeur ? " puce--active" : "") + '"'
      + ' data-agir="filtrer-format" data-format="' + valeur + '">' + libelle + '</button>';
  }
  html += '</div><p class="eyebrow eyebrow--interne">Trier par</p><div class="puces">';
  for(const [valeur, libelle] of [["titre","Titre"],["annee","Année"],["auteur","Réalisateur"],["duree","Durée"]]){
    html += '<button class="puce' + (recherche.tri === valeur ? " puce--active" : "") + '"'
      + ' data-agir="trier" data-tri="' + valeur + '">' + libelle + '</button>';
  }
  html += '</div><p class="eyebrow eyebrow--interne">Étiquettes</p><div class="puces">'
    + '<button class="puce' + (recherche.etiquette === "" ? " puce--active" : "") + '"'
    + ' data-agir="filtrer-etiquette" data-etiquette="">Toutes</button>';
  for(const [etiquette, compte] of etiquettes){
    html += '<button class="puce' + (recherche.etiquette === etiquette ? " puce--active" : "") + '"'
      + ' data-agir="filtrer-etiquette" data-etiquette="' + echapper(etiquette) + '">'
      + echapper(etiquette) + ' <span style="opacity:.5">' + compte + '</span></button>';
  }
  html += '</div><p class="compteur">' + resultats.length + ' résultat' + (resultats.length > 1 ? "s" : "") + '</p>';

  if(resultats.length === 0){
    html += '<p class="vide">Aucun titre ne correspond.</p>';
  } else {
    html += '<ul class="liste">';
    for(const oeuvre of resultats.slice(0, 120)){
      const entree = entree_journal(profil, oeuvre);
      const marque = entree ? LIBELLES_STATUT[entree.statut] : (oeuvre.a + " · " + LIBELLES_FORMAT[oeuvre.f]);
      html += ligne_liste(oeuvre, marque);
    }
    html += '</ul>';
    if(resultats.length > 120) html += '<p class="note-info">Affichage limité aux 120 premiers — affine la recherche.</p>';
  }
  html += '<button class="bouton bouton--second" data-agir="aller" data-vue="ajout">Ajouter un titre au catalogue</button>';
  return html + bandeau() + '</section>';
}

function ecran_avoir(profil){
  const oeuvres = resoudre_cles(profil.aVoir, catalogue_complet());
  let html = '<section class="ecran">' + entete("À voir", "accueil")
    + '<h2 class="titre-question" tabindex="-1" data-focus>Ta liste</h2>';
  if(oeuvres.length === 0){
    html += '<p class="aide">Rien en attente. Depuis une fiche ou un programme, « à voir plus tard » remplit cette liste.</p>';
  } else {
    html += '<p class="aide aide--serree">Range-les dans l\'ordre où tu veux les voir.</p><ol class="file">';
    oeuvres.forEach((oeuvre, rang) => {
      html += '<li class="file__ligne"><div class="file__corps">'
        + '<button class="liste__titre" data-agir="fiche" data-cle="' + echapper(cle_oeuvre(oeuvre)) + '">' + echapper(oeuvre.t) + '</button>'
        + '<span class="liste__meta">' + LIBELLES_FORMAT[oeuvre.f] + ' · ' + oeuvre.a + '</span></div>'
        + '<div class="file__boutons">'
        + '<button class="rang" data-agir="avoir-tete" data-rang="' + rang + '" ' + (rang === 0 ? "disabled" : "") + ' aria-label="En tête">⤒</button>'
        + '<button class="rang" data-agir="avoir-monter" data-rang="' + rang + '" ' + (rang === 0 ? "disabled" : "") + ' aria-label="Monter">↑</button>'
        + '<button class="rang" data-agir="avoir-descendre" data-rang="' + rang + '" ' + (rang === oeuvres.length - 1 ? "disabled" : "") + ' aria-label="Descendre">↓</button>'
        + '<button class="rang" data-agir="vers-marathon" data-cle="' + echapper(cle_oeuvre(oeuvre)) + '" aria-label="Vers la soirée">▶</button>'
        + '<button class="rang rang--retirer" data-agir="avoir" data-cle="' + echapper(cle_oeuvre(oeuvre)) + '" aria-label="Retirer">✕</button>'
        + '</div></li>';
    });
    html += '</ol>';
  }
  return html + bandeau() + '</section>';
}

function ecran_journal(profil){
  const catalogue = catalogue_complet();
  const index = new Map(catalogue.map(oeuvre => [cle_oeuvre(oeuvre), oeuvre]));
  let html = '<section class="ecran">' + entete("Historique", "accueil")
    + '<h2 class="titre-question" tabindex="-1" data-focus>Ce qui est passé</h2>';
  if(profil.journal.length === 0){
    html += '<p class="aide">Rien encore. Ce que tu retiens ou écartes s\'inscrit ici, et ne te sera plus proposé.</p>';
  } else {
    html += '<ul class="liste">';
    for(const entree of profil.journal.slice().reverse()){
      const oeuvre = index.get(entree.cle);
      const note = typeof entree.note === "number" ? " · " + entree.note + "/5" : "";
      html += '<li>'
        + (oeuvre
            ? '<button class="liste__titre" data-agir="fiche" data-cle="' + echapper(entree.cle) + '">' + echapper(entree.titre) + '</button>'
            : '<span class="liste__titre">' + echapper(entree.titre) + '</span>')
        + '<span class="liste__meta">' + (LIBELLES_STATUT[entree.statut] || entree.statut) + note + '</span>'
        + '<button class="lien lien--mini" data-agir="oublier" data-cle="' + echapper(entree.cle) + '">oublier</button></li>';
    }
    html += '</ul>';
  }
  return html + bandeau() + '</section>';
}

function ecran_stats(profil){
  const catalogue = catalogue_complet();
  const stats = calculer_statistiques(profil, catalogue);
  const temps = calculer_temps(profil, catalogue);
  let html = '<section class="ecran">' + entete("Statistiques", "accueil")
    + '<h2 class="titre-question" tabindex="-1" data-focus>Ce que tu regardes</h2>';

  if(stats.total === 0){
    html += '<p class="aide">Pas encore assez de matière. Reviens quand quelques titres seront passés.</p>';
    return html + '</section>';
  }
  const heures = Math.round(temps.minutes / 60);
  html += '<div class="stat"><span class="stat__cle">Titres vus ou retenus</span><span class="stat__val">' + stats.total + '</span></div>'
    + '<div class="stat"><span class="stat__cle">Temps de film cumulé</span><span class="stat__val">'
    + (heures > 0 ? heures + " h" : "—") + '</span></div>'
    + '<div class="stat"><span class="stat__cle">Séries entamées</span><span class="stat__val">' + temps.series + '</span></div>';
  if(stats.moyenne !== null){
    html += '<div class="stat"><span class="stat__cle">Note moyenne (' + stats.notes + ')</span>'
      + '<span class="stat__val">' + stats.moyenne.toFixed(1) + ' / 5</span></div>';
  }

  html += '<p class="eyebrow eyebrow--interne">Par format</p>';
  for(const [cle, libelle] of [["film","Films"],["serie","Séries"],["doc","Documentaires"]]){
    const valeur = stats.formats[cle] || 0;
    html += '<div class="stat"><span class="stat__cle">' + libelle + '</span><span class="stat__val">' + valeur + '</span></div>'
      + '<div class="barre" style="width:' + (stats.total ? (valeur / stats.total) * 100 : 0) + '%"></div>';
  }

  if(stats.decennies.length > 0){
    const sommet = Math.max(...stats.decennies.map(paire => paire[1]));
    html += '<p class="eyebrow eyebrow--interne">Par décennie</p>';
    for(const [decennie, compte] of stats.decennies){
      html += '<div class="stat"><span class="stat__cle">' + decennie + 's</span>'
        + '<span class="stat__val">' + compte + '</span></div>'
        + '<div class="barre" style="width:' + (compte / sommet) * 100 + '%"></div>';
    }
  }
  if(stats.auteurs.length > 0){
    html += '<p class="eyebrow eyebrow--interne">Réalisateurs les plus vus</p>';
    for(const [auteur, compte] of stats.auteurs){
      html += '<div class="stat"><span class="stat__cle">' + echapper(auteur) + '</span>'
        + '<span class="stat__val">' + compte + '</span></div>';
    }
  }
  return html + bandeau() + '</section>';
}

/** Ordre d'affichage des anomalies : le plus grave d'abord. */
const ORDRE_GRAVITE = ["bloquant", "sérieux", "signal"];
/** Nombre d'anomalies détaillées par nature avant repli. */
const DETAIL_PAR_NATURE = 8;

function ecran_audit(){
  const catalogue = catalogue_complet();
  const {anomalies, resume} = auditer_catalogue(catalogue);

  let html = '<section class="ecran">' + entete("Vérification", "donnees")
    + '<h2 class="titre-question" tabindex="-1" data-focus>État du catalogue</h2>'
    + '<div class="stat"><span class="stat__cle">Titres</span><span class="stat__val">' + resume.titres + '</span></div>'
    + '<div class="stat"><span class="stat__cle">Réalisateurs distincts</span><span class="stat__val">' + resume.realisateurs + '</span></div>'
    + '<div class="stat"><span class="stat__cle">Étiquettes distinctes</span><span class="stat__val">' + resume.etiquettes + '</span></div>';

  if(resume.total === 0){
    html += '<p class="aide">Aucune anomalie. Le catalogue est cohérent.</p>';
    return html + bandeau() + '</section>';
  }

  for(const gravite of ORDRE_GRAVITE){
    const compte = resume.parGravite[gravite];
    html += '<div class="stat"><span class="stat__cle">' + echapper(gravite.charAt(0).toUpperCase() + gravite.slice(1))
      + '</span><span class="stat__val">' + compte + '</span></div>';
  }

  for(const gravite of ORDRE_GRAVITE){
    const duNiveau = anomalies.filter(anomalie => anomalie.gravite === gravite);
    if(duNiveau.length === 0) continue;

    const natures = new Map();
    for(const anomalie of duNiveau){
      if(natures.has(anomalie.nature)) natures.get(anomalie.nature).push(anomalie);
      else natures.set(anomalie.nature, [anomalie]);
    }
    for(const [nature, liste] of [...natures].sort((a, b) => b[1].length - a[1].length)){
      html += '<p class="eyebrow eyebrow--interne">' + echapper(nature) + ' — ' + liste.length + '</p><ul class="liste">';
      for(const anomalie of liste.slice(0, DETAIL_PAR_NATURE)){
        html += '<li><span class="liste__titre">' + echapper(anomalie.sujet) + '</span>'
          + '<span class="liste__meta">' + echapper(anomalie.detail) + '</span></li>';
      }
      if(liste.length > DETAIL_PAR_NATURE){
        html += '<li><span class="liste__meta">et ' + (liste.length - DETAIL_PAR_NATURE) + ' autre'
          + (liste.length - DETAIL_PAR_NATURE > 1 ? 's' : '') + '</span></li>';
      }
      html += '</ul>';
    }
  }
  return html + bandeau() + '</section>';
}

const SANS_PROFIL = ["profils", "creation", "donnees", "audit"];

function appliquer_theme(cle){
  const theme = THEMES[cle] || THEMES.vert;
  const racine = document.documentElement.style;
  racine.setProperty("--fond", theme.fond);
  racine.setProperty("--panneau", theme.panneau);
  racine.setProperty("--accent", theme.accent);
  racine.setProperty("--second", theme.second);
  racine.setProperty("--texte", theme.texte);
  racine.setProperty("--discret", theme.discret);
}

const INTENSITE = {programme:.75, cycle:.7, session:.45, fiche:.35};

/**
 * Redessine l'écran courant.
 * @param {object} options - {focus: false} pour ne pas déplacer le focus
 */
function rendre(options = {}){
  const profil = profil_actif();
  if(!profil && SANS_PROFIL.indexOf(vue) === -1) vue = "profils";
  if(vue === "cycle" && !cycle_courant) vue = "cycles";

  appliquer_theme(profil ? profil.theme : "vert");
  const lanterne = document.getElementById("lanterne");
  if(lanterne) lanterne.style.opacity = INTENSITE[vue] || .2;

  const produire = ECRANS[vue] || ECRANS.profils;
  app.innerHTML = produire(profil);

  if(options.focus === false) return;
  const cible = app.querySelector("[data-focus]");
  if(cible) cible.focus({preventScroll:true});
}

function aller(destination){
  if(destination === "fiche") ecran_retour = vue === "fiche" ? ecran_retour : vue;
  vue = destination;
  message = "";
  rendre();
}

function oeuvre_par_cle(cle){
  return catalogue_complet().find(oeuvre => cle_oeuvre(oeuvre) === cle) || null;
}

function valeur_champ(id){
  const noeud = document.getElementById(id);
  return noeud ? noeud.value : "";
}

const ACTIONS = {

  aller: (el) => aller(el.dataset.vue),

  ouvrir: (el) => { etat.actif = el.dataset.id; sauver(); aller("accueil"); },

  "supprimer-profil": (el) => {
    if(etat.profils.length <= 1) return;
    etat.profils = etat.profils.filter(profil => profil.id !== el.dataset.id);
    if(etat.actif === el.dataset.id) etat.actif = null;
    sauver(); rendre();
  },

  theme: (el) => {
    const profil = profil_actif();
    if(!profil) return;
    profil.theme = el.dataset.theme; sauver(); rendre();
  },

  repondre: (el) => {
    const {champ, valeur, multi} = el.dataset;
    const cible = vue === "creation" ? brouillon.reponses : humeur;
    if(multi){
      const liste = Array.isArray(cible[champ]) ? cible[champ] : [];
      cible[champ] = liste.indexOf(valeur) !== -1 ? liste.filter(v => v !== valeur) : liste.concat([valeur]);
      rendre();
      return;
    }
    cible[champ] = valeur;
    if(vue === "creation"){
      if(pas < PROFILAGE.length + 1) pas++;
      rendre();
      return;
    }
    // En séance : changer de format peut faire apparaître ou disparaître la question de durée.
    if(champ === "format" && valeur !== "film") delete humeur.duree;
    const questions = questions_applicables();
    if(pas < questions.length - 1) pas++;
    rendre();
  },

  "creation-retour": () => {
    if(pas === 0){ brouillon = {reponses:{}}; aller("profils"); return; }
    if(pas === PROFILAGE.length + 1) brouillon.reperes = valeur_champ("saisie-reperes");
    pas--; rendre();
  },

  "creation-suivant": () => {
    const total = PROFILAGE.length + 2;
    if(pas === 0){
      const prenom = valeur_champ("saisie-prenom").trim();
      if(!prenom){ signaler("Il faut un prénom pour continuer."); return; }
      brouillon.prenom = prenom;
    }
    if(pas === total - 1){
      brouillon.reperes = valeur_champ("saisie-reperes");
      const nouveau = {
        id: "p" + Date.now().toString(36),
        prenom: brouillon.prenom,
        theme: "vert",
        journal: [],
        aVoir: [],
        reperes: brouillon.reperes,
        affinites: deduire_affinites(brouillon.reponses),
        collections: [],
        recherches: [],
        rituels: [],
        seances: []
      };
      etat.profils.push(nouveau);
      etat.actif = nouveau.id;
      brouillon = {reponses:{}};
      pas = 0;
      sauver();
      aller("accueil");
      return;
    }
    pas++; rendre();
  },

  "ouvrir-session": () => {
    pas = 0; humeur = {}; propositions = []; ecartes = [];
    profil_session = null;
    aller("session");
  },

  "session-retour": () => {
    if(pas === 0){ aller("accueil"); return; }
    pas--; rendre();
  },

  lancer: () => {
    const profil = profil_session || profil_actif();
    const questions = questions_applicables();
    if(!questions.every(question => humeur[question.id])){
      signaler("Il reste une question sans réponse.");
      return;
    }
    graine = Date.now() % 100000;
    propositions = composer({profil, humeur, catalogue: catalogue_complet(), ecartes, graine});
    aller("programme");
  },

  relancer: () => {
    const profil = profil_session || profil_actif();
    ecartes = ecartes.concat(propositions.map(cle_oeuvre));
    graine = (graine * 7 + 13) % 100000;
    propositions = composer({profil, humeur, catalogue: catalogue_complet(), ecartes, graine});
    rendre();
  },

  surprise: () => {
    const profil = profil_actif();
    const oeuvre = tirer_au_sort({profil, catalogue: catalogue_complet(), graine: Date.now() % 100000});

    fiche_cle = cle_oeuvre(oeuvre);
    aller("fiche");
  },

  fiche: (el) => { fiche_cle = el.dataset.cle; aller("fiche"); },

  statut: (el) => {
    const profil = profil_actif();
    const oeuvre = oeuvre_par_cle(el.dataset.cle);
    if(!profil || !oeuvre) return;
    inscrire_journal(profil, oeuvre, {statut: el.dataset.statut});
    if(el.dataset.statut !== "refuse"){
      profil.aVoir = profil.aVoir.filter(cle => cle !== el.dataset.cle);
    }
    sauver();
    signaler(oeuvre.t + " — " + (LIBELLES_STATUT[el.dataset.statut] || "").toLowerCase());

  avoir: (el) => {
    const profil = profil_actif();
    const cle = el.dataset.cle;
    if(!profil) return;
    if(profil.aVoir.indexOf(cle) !== -1){
      profil.aVoir = profil.aVoir.filter(existante => existante !== cle);
      sauver(); signaler("Retiré de la liste.");
    } else {
      profil.aVoir.push(cle);
      sauver(); signaler("Ajouté à « à voir ».");
    }
  },

  noter: (el) => {
    const profil = profil_actif();
    const oeuvre = oeuvre_par_cle(el.dataset.cle);
    if(!profil || !oeuvre) return;
    const note = parseInt(el.dataset.note, 10);
    const entree = entree_journal(profil, oeuvre);
    const champs = {note, statut: entree && entree.statut !== "refuse" ? entree.statut : "deja_vu"};
    const saisi = document.getElementById("saisie-commentaire");
    if(saisi) champs.commentaire = saisi.value;
    inscrire_journal(profil, oeuvre, champs);
    profil.affinites = apprendre(profil.affinites, oeuvre, note);
    sauver();
    signaler(note >= 4 ? "Noté — le profil s'ajuste vers ce genre de titres."
           : note <= 2 ? "Noté — ce genre de titres sera moins proposé."
           : "Noté.");
  },

  commenter: (el) => {
    const profil = profil_actif();
    const oeuvre = oeuvre_par_cle(el.dataset.cle);
    if(!profil || !oeuvre) return;
    inscrire_journal(profil, oeuvre, {commentaire: valeur_champ("saisie-commentaire")});

  },

  oublier: (el) => {
    const profil = profil_actif();
    if(!profil) return;
    profil.journal = profil.journal.filter(entree => entree.cle !== el.dataset.cle);

  "filtrer-format": (el) => { recherche.format = el.dataset.format; aller("explorer"); },

  "filtrer-etiquette": (el) => {

  },

  trier: (el) => { recherche.tri = el.dataset.tri; rendre(); },

  "basculer-aime": (el) => {
    const profil = profil_actif();

    const etiquette = el.dataset.etiquette;
    profil.reperes = valeur_champ("saisie-reperes") || profil.reperes;

      ? af.aimes.filter(existante => existante !== etiquette)
      : af.aimes.concat([etiquette]);
    sauver(); rendre();
  },

  "basculer-exclu": (el) => {
    const profil = profil_actif();
    const af = profil.affinites;
    const etiquette = el.dataset.etiquette;
    profil.reperes = valeur_champ("saisie-reperes") || profil.reperes;
    if(!Array.isArray(af.exclus)) af.exclus = [];
    af.exclus = af.exclus.indexOf(etiquette) !== -1
      ? af.exclus.filter(existante => existante !== etiquette)
      : af.exclus.concat([etiquette]);
    sauver(); rendre();
  },

  "oublier-tiede": (el) => {
    const profil = profil_actif();
    profil.affinites.tiedes = profil.affinites.tiedes.filter(t => t !== el.dataset.etiquette);
    sauver(); rendre();
  },

  exigence: (el) => {
    const profil = profil_actif();
    profil.reperes = valeur_champ("saisie-reperes") || profil.reperes;
    profil.affinites.exigence = parseInt(el.dataset.niveau, 10);
    sauver(); rendre();
  },

  "enregistrer-reglages": () => {
    const profil = profil_actif();
    const nom = valeur_champ("saisie-nom").trim();
    if(nom) profil.prenom = nom;
    profil.reperes = valeur_champ("saisie-reperes");
    sauver();
    aller("accueil");
  },

  "dupliquer-profil": () => {
    const profil = profil_actif();
    const copie = copier(profil);
    copie.id = "p" + Date.now().toString(36);
    copie.prenom = profil.prenom + " (copie)";
    etat.profils.push(copie);
    sauver(); signaler("Profil dupliqué.");
  },

  "vider-journal": () => {
    const profil = profil_actif();
    profil.journal = [];
    sauver(); signaler("Historique vidé — tout redevient proposable.");
  },

  "ajout-choix": (el) => {
    brouillon_ajout[el.dataset.champ] = el.dataset.valeur;
    for(const identifiant of ["t","a","r","d","p","tg"]){
      const noeud = document.getElementById("ajout-" + identifiant);
      if(noeud) brouillon_ajout[identifiant] = noeud.value;
    }
    rendre();
  },

  "enregistrer-titre": () => {
    for(const identifiant of ["t","a","r","d","p","tg"]){
      brouillon_ajout[identifiant] = valeur_champ("ajout-" + identifiant);
    }
    const oeuvre = {
      t: (brouillon_ajout.t || "").trim(),
      a: parseInt(brouillon_ajout.a, 10),
      r: (brouillon_ajout.r || "").trim() || "Inconnu",
      f: brouillon_ajout.f,
      d: (brouillon_ajout.d || "").trim() || "—",
      p: (brouillon_ajout.p || "").trim() || "Sans description.",
      g: brouillon_ajout.g ? [brouillon_ajout.g] : [],
      c: brouillon_ajout.c,
      e: brouillon_ajout.e,
      x: parseInt(brouillon_ajout.x, 10),
      fin: brouillon_ajout.fin,
      fam: brouillon_ajout.fam === "oui",
      tg: (brouillon_ajout.tg || "").split(",").map(t => normaliser(t).replace(/ /g, "-")).filter(Boolean),
      v: []
    };
    const problemes = valider_oeuvre(oeuvre);
    if(problemes.length > 0){ signaler(problemes[0]); return; }
    if(catalogue_complet().some(existante => cle_oeuvre(existante) === cle_oeuvre(oeuvre))){
      signaler("Ce titre est déjà au catalogue."); return;
    }
    etat.ajouts.push(oeuvre);
    brouillon_ajout = {};
    sauver();
    recherche = {texte: "", format: "tout", etiquette: "", tri: "titre"};
    signaler("« " + oeuvre.t + " » ajouté au catalogue.");
    aller("explorer");
  },

  "lancer-cycle": (el) => {
    const profil = profil_actif();
    cycle_courant = CYCLES.find(cycle => cycle.id === el.dataset.cycle) || null;
    if(!cycle_courant) return;
    const semence = el.dataset.rejouer ? Date.now() % 100000 : graine_du_jour(new Date(), cycle_courant.id);
    cycle_titres = composer_cycle({cycle: cycle_courant, profil, catalogue: catalogue_complet(), graine: semence});
    aller("cycle");
  },

  "lancer-duo": (el) => {
    const premier = profil_actif();
    const second = etat.profils.find(profil => profil.id === el.dataset.id);
    if(!premier || !second) return;
    profil_session = fusionner_profils(premier, second);
    pas = 0; humeur = {}; propositions = []; ecartes = [];
    aller("session");
  },

  exporter: () => {
    const contenu = JSON.stringify(etat, null, 2);
    try {
      const lien = document.createElement("a");
      lien.href = URL.createObjectURL(new Blob([contenu], {type:"application/json"}));
      lien.download = "programme-du-soir-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(lien);
      lien.click();
      document.body.removeChild(lien);
      URL.revokeObjectURL(lien.href);
      signaler("Sauvegarde téléchargée.");
    } catch(e){
      signaler("Téléchargement impossible ici — utilise « copier ».");
    }
  },

  "copier-sauvegarde": () => copier_texte(JSON.stringify(etat), "Sauvegarde copiée."),

  importer: () => {
    const brut = valeur_champ("saisie-import").trim();
    if(!brut){ signaler("Colle d'abord une sauvegarde."); return; }
    let lu;
    try { lu = JSON.parse(brut); }
    catch(e){ signaler("Ce texte n'est pas une sauvegarde valide."); return; }
    const migre = migrer(lu, catalogue_complet());
    if(!migre){ signaler("Sauvegarde illisible : aucun profil trouvé."); return; }
    etat = migre;
    if(!etat.profils.some(profil => profil.id === etat.actif)) etat.actif = null;
    sauver();
    vue = "profils";
    signaler("Sauvegarde restaurée.");
  },

  "copier-programme": () => {
    const lignes = propositions.map(oeuvre =>
      oeuvre.t + " (" + oeuvre.r + ", " + oeuvre.a + ") — " + oeuvre.p);
    copier_texte("Le programme du soir — " + date_du_jour() + "\n\n" + lignes.join("\n\n"), "Programme copié.");
  },

  imprimer: () => window.print()
};

/**
 * Copie du texte dans le presse-papiers, avec repli sur une zone de saisie temporaire.
 * @param {string} texte
 * @param {string} confirmation
 */
function copier_texte(texte, confirmation){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texte)
      .then(() => signaler(confirmation))
      .catch(() => signaler("Copie refusée par le navigateur."));
    return;
  }
  try {
    const zone = document.createElement("textarea");
    zone.value = texte;
    zone.style.position = "fixed";
    zone.style.opacity = "0";
    document.body.appendChild(zone);
    zone.select();
    document.execCommand("copy");
    document.body.removeChild(zone);
    signaler(confirmation);
  } catch(e){
    signaler("Copie impossible dans ce navigateur.");
  }
}

app.addEventListener("click", evenement => {
  const declencheur = evenement.target.closest("[data-agir]");
  if(!declencheur || !app.contains(declencheur)) return;
  const action = ACTIONS[declencheur.dataset.agir];
  if(action) action(declencheur, evenement);
});

app.addEventListener("input", evenement => {
  if(evenement.target.dataset.agirSaisie === "recherche"){
    recherche.texte = evenement.target.value;
    recherche.etiquette = "";
    const position = evenement.target.selectionStart;
    rendre({focus:false});
    const champ = document.getElementById("saisie-recherche");
    if(champ){ champ.focus(); champ.setSelectionRange(position, position); }
  }
});

document.addEventListener("keydown", evenement => {
  const cible = evenement.target;
  const saisie = cible && (cible.tagName === "INPUT" || cible.tagName === "TEXTAREA");
  if(evenement.metaKey || evenement.ctrlKey || evenement.altKey) return;

  if(evenement.key === "Escape" && !saisie){
    const retours = {session:"session-retour", creation:"creation-retour"};
    if(retours[vue]){ ACTIONS[retours[vue]](); return; }
    if(vue !== "accueil" && vue !== "profils"){ aller(etat.actif ? "accueil" : "profils"); }
    return;
  }
  if(saisie) return;

  if((vue === "session" || vue === "creation") && /^[1-9]$/.test(evenement.key)){
    const boutons = app.querySelectorAll('.option[data-agir="repondre"]');
    const choisi = boutons[parseInt(evenement.key, 10) - 1];
    if(choisi){ evenement.preventDefault(); choisi.click(); }
    return;
  }
  if(evenement.key === "Enter" && vue === "session"){
    const lancer = app.querySelector('[data-agir="lancer"]:not([disabled])');
    if(lancer){ evenement.preventDefault(); lancer.click(); }
  }
});

/** Démarre l'application : lecture du stockage, migration, premier rendu. */
function amorcer(){
  lire_etat().then(sauvegarde => {
    const migre = migrer(sauvegarde, catalogue_complet());
    if(migre){
      etat = migre;
    } else {
      etat = {version: VERSION_SCHEMA, profils: [copier(PROFIL_APOLLINE)], actif: null, ajouts: []};
    }
    if(!Array.isArray(etat.ajouts)) etat.ajouts = [];
    if(!etat.profils.some(profil => profil.id === etat.actif)) etat.actif = null;
    vue = etat.actif ? "accueil" : "profils";
    rendre();
  });
}

amorcer();

/**
 * Construit une rangée de pastilles à choix multiple pour un axe de l'atelier.
 * @param {string} axe - nom du tableau dans l'état `atelier`
 * @param {Array<[string,string]>} options - couples [valeur, libellé]
 * @param {string[]} selection
 * @returns {string}
 */
function pastilles_axe(axe, options, selection){
  let html = '<div class="puces">';
  for(const [valeur, libelle] of options){
    const actif = selection.indexOf(valeur) !== -1;
    html += '<button class="puce' + (actif ? " puce--active" : "") + '" data-agir="atelier-axe"'
      + ' data-axe="' + echapper(axe) + '" data-valeur="' + echapper(valeur) + '">' + echapper(libelle) + '</button>';
  }
  return html + '</div>';
}

/**
 * Rassemble les critères courants de l'atelier sous la forme attendue par filtrer_avance.
 * Fonction pure : lit l'état de l'atelier et en renvoie une copie indépendante.
 * @returns {object}
 */
function criteres_atelier(){
  return {
    texte: atelier.texte,
    formats: atelier.formats.slice(), registres: atelier.registres.slice(),
    climats: atelier.climats.slice(), epoques: atelier.epoques.slice(),
    fins: atelier.fins.slice(), decennies: atelier.decennies.slice(),
    exigenceMax: atelier.exigenceMax, familleSeule: atelier.familleSeule,
    dureeMax: atelier.dureeMax, tagsInclus: atelier.tagsInclus.slice(),
    plateforme: atelier.plateforme
  };
}

/** Sélecteur de poids de 0 à 3 pour une facette de l'humeur fine. */

  let html = '<div class="curseur"><span class="curseur__nom">' + echapper(cle) + '</span><div class="curseur__crans">';
  for(let n = 0; n <= 3; n++){
    html += '<button class="cran' + (valeur === n ? " cran--actif" : "") + '" data-agir="' + action + '"'
      + ' data-cle="' + echapper(cle) + '" data-niveau="' + n + '" aria-label="' + n + '">' + n + '</button>';
  }
  return html + '</div></div>';
}

/**
 * Sélectionne quelques œuvres variées (réalisateurs distincts) dans une liste.
 * @param {object[]} oeuvres
 * @param {number} combien
 * @returns {object[]}
 */
function varier_par_auteur(oeuvres, combien){
  const retenus = [], auteurs = [];
  for(const oeuvre of oeuvres){
    if(retenus.length >= combien) break;
    if(auteurs.indexOf(oeuvre.r) !== -1) continue;
    retenus.push(oeuvre); auteurs.push(oeuvre.r);
  }
  return retenus;
}

let pointage = {texte:"", format:"tout", decennie:null};
let graine_gouts = 1;

/** Rangée d'étoiles cliquables pour noter une œuvre directement depuis une liste. */
function etoiles_ligne(cle, note){
  let html = '<div class="etoiles etoiles--mini">';
  for(let n = 1; n <= 5; n++){
    const pleine = typeof note === "number" && note >= n;
    html += '<button class="etoile' + (pleine ? " etoile--pleine" : "") + '" data-agir="pointer-note"'
      + ' data-cle="' + echapper(cle) + '" data-note="' + n + '" aria-label="Noter ' + n + ' sur 5">'
      + (pleine ? "◆" : "◇") + '</button>';
  }
  return html + '</div>';
}

/** Petit palmarès d'un axe (registres ou climats) sous forme de barres. */
function barres_axe(valeurs, noms){
  const tries = Object.entries(valeurs).sort((a, b) => b[1] - a[1]);
  let html = '<div class="barres">';
  for(const [cle, valeur] of tries){
    html += '<div class="barre"><span class="barre__nom">' + echapper(noms[cle] || cle) + '</span>'
      + jauge(borner(valeur, 0, 4) / 4) + '</div>';
  }
  return html + '</div>';
}

function ecran_profil_cinema(profil){
  if(!profil) return '<section class="ecran">' + entete("Accueil", "accueil") + '<p class="vide">Aucun profil actif.</p></section>';
  const catalogue = catalogue_complet();
  const pass = passeport(profil.journal, catalogue);
  const empreinte = empreinte_gouts(profil.journal, catalogue);

  let html = '<section class="ecran">' + entete("Accueil", "accueil")
    + '<h2 class="titre-question" tabindex="-1" data-focus>Mon cinéma</h2>';

  if(pass.vus === 0){
    html += '<p class="aide">Rien n\'est encore marqué comme vu. Pointe les films que tu connais : '
      + 'plus j\'en sais, plus mes suggestions te ressembleront.</p>'
      + '<button class="bouton bouton--primaire" data-agir="aller" data-vue="pointage">Pointer mes films vus</button>';
    return html + bandeau() + '</section>';
  }

  // Passeport cinéphile
  const heures = pass.minutes >= 60 ? Math.round(pass.minutes / 60) + " h de film" : null;
  const morceaux = [];
  morceaux.push(pass.vus + " vu" + (pass.vus > 1 ? "s" : ""));
  if(pass.notes > 0) morceaux.push(pass.notes + " noté" + (pass.notes > 1 ? "s" : ""));
  if(heures) morceaux.push(heures);
  html += '<p class="total-duree">' + morceaux.join(" · ") + '</p>';

  html += '<div class="passeport">';
  if(pass.noteMoyenne !== null){
    html += '<p class="passeport__ligne"><span class="passeport__cle">Note moyenne</span> '
      + (Math.round(pass.noteMoyenne * 10) / 10) + ' sur 5</p>';
  }
  if(pass.registreDominant){
    html += '<p class="passeport__ligne"><span class="passeport__cle">Tu cherches surtout</span> '
      + echapper((NOMS_REGISTRE[pass.registreDominant] || pass.registreDominant).toLowerCase()) + '</p>';
  }
  if(pass.climatDominant){
    html += '<p class="passeport__ligne"><span class="passeport__cle">Ton décor de prédilection</span> '
      + echapper((NOMS_CLIMAT[pass.climatDominant] || pass.climatDominant).toLowerCase()) + '</p>';
  }
  if(pass.decenniesVisitees.length){
    const top = pass.decenniesVisitees.slice(0, 3).map(d => d.decennie + "s").join(", ");
    html += '<p class="passeport__ligne"><span class="passeport__cle">Décennies</span> ' + top + '</p>';
  }
  if(pass.paysTraverses.length){
    const top = pass.paysTraverses.slice(0, 4).map(p => p.pays).join(", ");
    html += '<p class="passeport__ligne"><span class="passeport__cle">Tu voyages vers</span> ' + echapper(top) + '</p>';
  }
  if(pass.realisateursFavoris.length){
    const top = pass.realisateursFavoris.slice(0, 3).map(r => r.nom).join(", ");
    html += '<p class="passeport__ligne"><span class="passeport__cle">Réalisateurs revus</span> ' + echapper(top) + '</p>';
  }
  html += '</div>';

  // Films préférés
  const favoris = films_favoris(profil.journal, catalogue, 6);
  if(favoris.length){
    html += '<p class="eyebrow eyebrow--interne">Tes films préférés</p><ul class="liste">';
    for(const {oeuvre, note} of favoris){
      html += '<li><button class="liste__titre" data-agir="fiche" data-cle="' + echapper(cle_oeuvre(oeuvre)) + '">'
        + echapper(oeuvre.t) + '</button>'
        + '<span class="liste__meta">' + echapper(oeuvre.r) + '</span>'
        + '<span class="note-pastille">' + "◆".repeat(note) + '</span></li>';
    }
    html += '</ul>';
  }

  // Empreinte
  html += '<p class="eyebrow eyebrow--interne">Ce que tes films disent de toi</p>'
    + barres_axe(empreinte.affinites.registres, NOMS_REGISTRE)
    + barres_axe(empreinte.affinites.climats, NOMS_CLIMAT);

  html += '<div class="actions">'
    + '<button class="bouton bouton--primaire" data-agir="aller" data-vue="suggestions_gouts">Suggestions d\'après mes goûts</button>'
    + '<button class="bouton bouton--second" data-agir="aller" data-vue="pointage">Pointer d\'autres films</button>'
    + '<button class="bouton bouton--second" data-agir="aller" data-vue="carnet">Mon carnet de bord</button>'
    + '<button class="bouton bouton--second" data-agir="recalibrer">Recalibrer toutes mes recommandations</button>'
    + '</div>';
  return html + bandeau() + '</section>';
}

function ecran_pointage(profil){
  if(!profil) return '<section class="ecran">' + entete("Mon cinéma", "profil_cinema") + '<p class="vide">Aucun profil actif.</p></section>';
  const catalogue = catalogue_complet();
  const vus = profil.journal.filter(e => e.statut === "deja_vu" || e.statut === "pris").length;
  const decenniesPresentes = [...new Set(catalogue.map(o => Math.floor(o.a / 10) * 10))].sort((a, b) => a - b);

  const criteres = {
    texte: pointage.texte,
    formats: pointage.format === "tout" ? [] : [pointage.format],
    decennies: pointage.decennie ? [pointage.decennie] : []
  };
  const resultats = filtrer_avance(catalogue, criteres).sort((a, b) => a.t.localeCompare(b.t, "fr"));

  let html = '<section class="ecran">' + entete("Mon cinéma", "profil_cinema")
    + '<h2 class="titre-question" tabindex="-1" data-focus>J\'ai vu ces films</h2>'
    + '<p class="aide">Note ceux que tu connais, ou marque-les simplement « vu ». Cherche un titre, ou parcours par décennie.</p>'
    + '<p class="compteur compteur--fort">' + vus + ' film' + (vus > 1 ? "s" : "") + ' marqué' + (vus > 1 ? "s" : "") + ' comme vu' + (vus > 1 ? "s" : "") + '</p>'
    + '<input class="champ" id="saisie-pointage" placeholder="Chercher un titre, un réalisateur…" '
    + 'value="' + echapper(pointage.texte) + '" data-agir-saisie="pointage">';

  html += '<div class="puces">';
  for(const [valeur, libelle] of [["tout","Tous"],["film","Films"],["serie","Séries"],["doc","Docs"]]){
    html += '<button class="puce' + (pointage.format === valeur ? " puce--active" : "") + '" data-agir="pointage-format" data-format="' + valeur + '">' + libelle + '</button>';
  }
  html += '</div><div class="puces">';
  for(const d of decenniesPresentes){
    html += '<button class="puce' + (pointage.decennie === d ? " puce--active" : "") + '" data-agir="pointage-decennie" data-decennie="' + d + '">' + d + 's</button>';
  }
  html += '</div>';

  html += '<ul class="liste liste--pointage">';
  for(const oeuvre of resultats.slice(0, 60)){
    const entree = entree_journal(profil, oeuvre);
    const estVu = entree && (entree.statut === "deja_vu" || entree.statut === "pris");
    const note = entree ? entree.note : null;
    html += '<li class="pointe"><div class="pointe__titre">'
      + '<button class="liste__titre" data-agir="fiche" data-cle="' + echapper(cle_oeuvre(oeuvre)) + '">' + echapper(oeuvre.t) + '</button>'
      + '<span class="liste__meta">' + LIBELLES_FORMAT[oeuvre.f] + ' · ' + oeuvre.a + ' · ' + echapper(oeuvre.r) + '</span></div>'
      + '<div class="pointe__controles">' + etoiles_ligne(cle_oeuvre(oeuvre), note)
      + '<button class="puce puce--mini' + (estVu ? " puce--active" : "") + '" data-agir="pointer-vu" data-cle="' + echapper(cle_oeuvre(oeuvre)) + '">vu</button>'
      + '</div></li>';
  }
  html += '</ul>';
  if(resultats.length > 60) html += '<p class="note-info">Les 60 premiers sont affichés — affine par la recherche.</p>';
  if(resultats.length === 0) html += '<p class="vide">Aucun titre ne correspond.</p>';
  return html + bandeau() + '</section>';
}

function ecran_suggestions_gouts(profil){
  if(!profil) return '<section class="ecran">' + entete("Mon cinéma", "profil_cinema") + '<p class="vide">Aucun profil actif.</p></section>';
  const catalogue = catalogue_complet();
  const empreinte = empreinte_gouts(profil.journal, catalogue);

  let html = '<section class="ecran">' + entete("Mon cinéma", "profil_cinema")
    + '<h2 class="titre-question" tabindex="-1" data-focus>D\'après tes goûts</h2>';

  if(empreinte.vus < 3){
    html += '<p class="aide">Marque au moins trois films que tu as aimés pour que je cerne ce qui te plaît. '
      + 'Ensuite, je pioche là-dedans.</p>'
      + '<button class="bouton bouton--primaire" data-agir="aller" data-vue="pointage">Pointer mes films</button>';
    return html + bandeau() + '</section>';
  }

  const recommandations = recommander_depuis_empreinte(catalogue, empreinte, profil, {graine: graine_gouts, combien: 3});
  if(recommandations.length === 0){
    html += '<p class="vide">Tu as déjà vu presque tout ce qui te ressemble. Élargis un peu tes envies dans l\'atelier ?</p>';
    return html + bandeau() + '</section>';
  }

  html += '<p class="aide">Choisis d\'après ce que tu regardes déjà.</p>';
  for(const {oeuvre, proches} of recommandations){
    html += cartel_html(oeuvre, {profil, entree: entree_journal(profil, oeuvre)});
    const raison = proches.length
      ? 'Parce que tu as aimé ' + proches.map(echapper).join(" et ") + '.'
      : 'Dans la lignée de ce que tu regardes.';
    html += '<p class="pourquoi-gout">' + raison + '</p>';
  }
  html += '<button class="bouton bouton--second" data-agir="relancer-gouts">Autres idées</button>';

  // F17 — le contrepoint : le titre le plus éloigné de tes habitudes.
  const oppose = contrepoint(catalogue, profil);
  if(oppose){
    html += filet() + '<p class="eyebrow eyebrow--interne">Le contrepoint</p>'
      + '<p class="aide">À l\'opposé de ce que tu choisis d\'habitude : '
      + echapper(oppose.ecarts.join(", ")) + '. À prendre ou à laisser.</p>'
      + cartel_html(oppose.oeuvre, {profil, entree: entree_journal(profil, oppose.oeuvre)});
  }
  return html + bandeau() + '</section>';
}

Object.assign(ACTIONS, {

  "pointer-note": (el) => {
    const profil = profil_actif();
    const oeuvre = oeuvre_par_cle(el.dataset.cle);
    if(!profil || !oeuvre) return;
    const note = parseInt(el.dataset.note, 10);
    const entree = entree_journal(profil, oeuvre);
    // Recliquer la même note l'efface (le film reste vu, mais sans note).
    if(entree && entree.note === note){
      inscrire_journal(profil, oeuvre, {note: null, statut: "deja_vu"});
    } else {
      inscrire_journal(profil, oeuvre, {note, statut: "deja_vu"});
    }
    sauver();
    rendre({focus:false});
  },

  "pointer-vu": (el) => {
    const profil = profil_actif();
    const oeuvre = oeuvre_par_cle(el.dataset.cle);
    if(!profil || !oeuvre) return;
    const cle = cle_oeuvre(oeuvre);
    const entree = entree_journal(profil, oeuvre);

    if(!entree){ // jamais rencontré : on le marque vu
      inscrire_journal(profil, oeuvre, {statut: "deja_vu"});
      sauver(); rendre({focus:false});
      return;
    }
    if(!est_vu(entree.statut)){ // écarté, en cours… : on bascule vers vu sans rien perdre
      inscrire_journal(profil, oeuvre, {statut: "deja_vu"});
      sauver(); rendre({focus:false});
      return;
    }
    // Décocher : on n'efface que si rien de personnel n'est en jeu.
    const porteUnAvis = typeof entree.note === "number"
      || (entree.commentaire || "").trim() !== "";
    if(porteUnAvis){
      signaler("Ce titre porte une note ou un commentaire. Reclique l'étoile pour effacer la note, puis retire-le.");
      return;
    }
    profil.journal = profil.journal.filter(e => e.cle !== cle);
    sauver(); rendre({focus:false});
  },

  "pointage-format": (el) => { pointage.format = el.dataset.format; rendre({focus:false}); },

  "pointage-decennie": (el) => {
    const d = parseInt(el.dataset.decennie, 10);
    pointage.decennie = pointage.decennie === d ? null : d;
    rendre({focus:false});
  },

  "relancer-gouts": () => { graine_gouts = (graine_gouts + 1) % 100000; rendre(); },

  recalibrer: () => {
    const profil = profil_actif();
    const empreinte = empreinte_gouts(profil.journal, catalogue_complet());
    if(empreinte.vus < 3){ signaler("Marque quelques films d'abord — il me faut de la matière."); return; }
    profil.affinites = profil_recalibre(profil.affinites, empreinte, 0.6);
    sauver();
    signaler("C'est fait : toutes tes recommandations tiennent compte de tes films vus.");
  }
});

  }
  if(oeuvres.length === 0){
    html += '<p class="aide">Collection vide. Ajoute des titres depuis une fiche, l\'atelier ou l\'explorateur.</p>';
  } else {
    html += liste_oeuvres(oeuvres, profil, {action:"retirer-collection", libelle:"retirer"});
  }
  return html + bandeau() + '</section>';
}

/* ── T6. Le fil des voisins ──────────────────────────────────── */

function ecran_fil(profil){
  const catalogue = catalogue_complet();
  if(fil.length === 0){
    return '<section class="ecran">' + entete("Accueil", "accueil")
      + '<h2 class="titre-question" tabindex="-1" data-focus>Le fil</h2>'
      + '<p class="aide">Pars d\'un titre et laisse-toi porter de proche en proche. Choisis un point de départ '
      + 'depuis une fiche, ou lance-toi au hasard.</p>'
      + '<button class="bouton bouton--primaire" data-agir="fil-hasard">Commencer au hasard</button>'
      + bandeau() + '</section>';
  }
  const courante = oeuvre_par_cle(fil[fil.length - 1]);
  if(!courante){
    return '<section class="ecran">' + entete("Accueil", "accueil")
      + '<p class="vide">Ce titre n\'existe plus au catalogue.</p></section>';
  }
  const toile = toile_voisins(courante, catalogue, 6);

  let html = '<section class="ecran">' + entete("Accueil", "accueil")
    + '<h2 class="titre-question" tabindex="-1" data-focus>Le fil</h2>';

  if(fil.length > 1){
    const traverses = resoudre_cles(fil.slice(0, -1), catalogue).map(o => echapper(o.t));
    html += '<p class="ariane">' + traverses.join(" → ") + ' →</p>';
  }
  html += cartel_html(courante, {profil, entree: entree_journal(profil, courante)});
  html += '<p class="eyebrow eyebrow--interne">Tire vers…</p><ul class="liste">';
  for(const {oeuvre, lien} of toile.voisins){
    html += '<li><button class="liste__titre" data-agir="fil-avancer" data-cle="' + echapper(cle_oeuvre(oeuvre)) + '">'
      + echapper(oeuvre.t) + '</button>'
      + '<span class="liste__meta">' + echapper(lien) + '</span></li>';
  }
  html += '</ul><div class="actions">';
  if(fil.length > 1) html += '<button class="bouton bouton--second" data-agir="fil-reculer">Revenir en arrière</button>';
  html += '<button class="bouton bouton--second" data-agir="fil-hasard">Repartir d\'ailleurs</button>'
    + '<button class="bouton bouton--second" data-agir="fil-vider">Fermer le fil</button></div>';
  return html + bandeau() + '</section>';
}

/* ── T7. Comparateur et défis ────────────────────────────────── */

function bloc_comparaison(premiere, seconde){
  const bilan = comparer(premiere, seconde);
  const c = bilan.communs;
  const points = [];
  if(c.realisateur) points.push("le même réalisateur, " + echapper(premiere.r));
  if(c.acteurs.length) points.push("à l'écran : " + c.acteurs.map(echapper).join(", "));
  if(c.auteurSource) points.push("tous deux tirés de " + echapper(c.auteurSource));
  if(c.registres.length) points.push("la même façon de saisir : " + c.registres.map(r => (NOMS_REGISTRE[r] || r).toLowerCase()).join(", "));
  if(c.climat) points.push("le même décor : " + (NOMS_CLIMAT[c.climat] || c.climat).toLowerCase());
  if(c.epoque) points.push("la même époque : " + (NOMS_EPOQUE[c.epoque] || c.epoque).toLowerCase());
  if(c.fin) points.push("une fin de même nature : " + (NOMS_FIN[c.fin] || c.fin).toLowerCase());
  if(c.etiquettes.length) points.push("des motifs partagés : " + c.etiquettes.slice(0, 5).map(echapper).join(", "));

  let html = '<div class="passeport"><p class="eyebrow eyebrow--interne">Ce qui les rapproche</p>';
  html += points.length
    ? '<ul class="puces-texte"><li>' + points.join('</li><li>') + '</li></ul>'
    : '<p class="aide">Rien de commun, ou presque — c\'est déjà un renseignement.</p>';
  html += '<p class="eyebrow eyebrow--interne">Ce qui les sépare</p><ul class="puces-texte">'
    + '<li>' + bilan.ecarts.annees + ' an' + (bilan.ecarts.annees > 1 ? "s" : "") + ' d\'écart</li>';
  if(bilan.ecarts.duree !== null && bilan.ecarts.duree > 0){
    html += '<li>' + bilan.ecarts.duree + ' minutes de différence</li>';
  }
  if(bilan.ecarts.exigence > 0){
    html += '<li>l\'un demande sensiblement plus d\'attention que l\'autre</li>';
  }
  return html + '</ul></div>';
}

function ecran_comparateur(profil){
  const catalogue = catalogue_complet();
  const oeuvres = resoudre_cles(comparaison, catalogue);

  let html = '<section class="ecran">' + entete("Accueil", "accueil")
    + '<h2 class="titre-question" tabindex="-1" data-focus>Deux titres face à face</h2>'
    + '<p class="aide">Choisis deux titres depuis leur fiche, l\'explorateur ou l\'atelier, et vois ce qui les relie.</p>';

  if(oeuvres.length === 0){
    html += '<p class="vide">Aucun titre retenu pour l\'instant.</p>';
  } else {
    for(const oeuvre of oeuvres){
      html += cartel_html(oeuvre, {profil, entree: entree_journal(profil, oeuvre), actions:false})
        + '<button class="lien lien--mini" data-agir="retirer-comparaison" data-cle="' + echapper(cle_oeuvre(oeuvre)) + '">retirer</button>';
    }
    if(oeuvres.length === 2) html += bloc_comparaison(oeuvres[0], oeuvres[1]);
    else html += '<p class="aide">Il en manque un second.</p>';
    html += '<button class="bouton bouton--second" data-agir="vider-comparaison">Tout retirer</button>';
  }
  return html + bandeau() + '</section>';
}

function ecran_defis(profil){

/* ── T8. Le carnet de bord ───────────────────────────────────── */

function ecran_carnet(profil){
  const catalogue = catalogue_complet();
  const mois = chronique(profil.journal, catalogue);
  const pass = passeport(profil.journal, catalogue);
  const manques = angles_morts(profil.journal, catalogue);

  let html = '<section class="ecran">' + entete("Mon cinéma", "profil_cinema")
    + '<h2 class="titre-question" tabindex="-1" data-focus>Carnet de bord</h2>';

  if(pass.vus === 0){
    html += '<p class="aide">Le carnet se remplira à mesure que tu pointes des films.</p>'
      + '<button class="bouton bouton--primaire" data-agir="aller" data-vue="pointage">Pointer mes films</button>';
    return html + bandeau() + '</section>';
  }

  if(mois.length){
    const sommet = Math.max(...mois.map(m => m.nombre));
    html += '<p class="eyebrow eyebrow--interne">Mois après mois</p><div class="barres">';
    for(const entree of mois.slice(-12)){
      html += '<div class="barre"><span class="barre__nom">' + echapper(entree.libelle) + '</span>'
        + jauge(entree.nombre / sommet) + '<span class="barre__valeur">' + entree.nombre + '</span></div>';
    }
    html += '</div>';
  }

  if(pass.decenniesVisitees.length){
    const sommet = Math.max(...pass.decenniesVisitees.map(d => d.nombre));
    html += '<p class="eyebrow eyebrow--interne">Décennies traversées</p><div class="barres">';
    for(const {decennie, nombre} of [...pass.decenniesVisitees].sort((a, b) => a.decennie - b.decennie)){
      html += '<div class="barre"><span class="barre__nom">' + decennie + 's</span>'
        + jauge(nombre / sommet) + '<span class="barre__valeur">' + nombre + '</span></div>';
    }
    html += '</div>';
  }

  if(pass.paysTraverses.length){
    html += '<p class="eyebrow eyebrow--interne">Pays et aires visités</p><div class="puces">';
    for(const {pays, nombre} of pass.paysTraverses){
      html += '<span class="puce puce--active">' + echapper(pays) + ' <span style="opacity:.6">' + nombre + '</span></span>';
    }
    html += '</div>';
  }

  const listeManques = [];
  if(manques.decennies.length) listeManques.push("les années " + manques.decennies.slice(0, 4).map(d => d + "s").join(", "));
  if(manques.formats.length) listeManques.push(manques.formats.map(f => LIBELLES_FORMAT[f].toLowerCase()).join(" et "));
  if(manques.climats.length) listeManques.push("le climat « " + manques.climats.map(c => (NOMS_CLIMAT[c] || c).toLowerCase()).join(" », « ") + " »");
  if(manques.pays.length) listeManques.push(manques.pays.slice(0, 4).join(", "));

  if(listeManques.length){
    html += '<p class="eyebrow eyebrow--interne">Tes angles morts</p>'
      + '<p class="aide">Tu n\'as encore rien vu du côté de : ' + echapper(listeManques.join(" ; ")) + '.</p>'
      + '<button class="bouton bouton--second" data-agir="aller" data-vue="defis">Me lancer un défi</button>';
  }

  // F7 — l'audace des choix, mois par mois.
  const barometre = barometre_audace(profil.journal || [], CATALOGUE);
  if(barometre.length >= 2){
    const maxi = Math.max(...barometre.map(point => point.audace));
    html += '<p class="eyebrow eyebrow--interne">Baromètre d\'audace</p>'
      + '<p class="aide">Moyenne d\'exigence des titres vus, mois par mois. Plus la barre monte, '
      + 'plus tu as choisi des films qui demandent de l\'attention.</p>'
      + '<ul class="liste liste--compacte">' + barometre.slice(-12).map(point =>
          '<li class="liste__item"><span class="liste__titre">' + echapper(point.libelle) + '</span>'
          + jauge(maxi ? point.audace / 3 : 0)
          + '<span class="liste__meta">' + point.audace.toFixed(2) + ' sur 3 · '
          + point.nombre + ' titre' + (point.nombre > 1 ? 's' : '') + '</span></li>').join("")
      + '</ul>';
  }

  // F19 — ce que tu vois, comparé à ce qui existe.
  const reflets = miroir(profil.journal || [], CATALOGUE)
    .filter(ligne => Math.abs(ligne.part_vue - ligne.part_catalogue) >= 0.05);
  if(reflets.length > 0){
    html += '<p class="eyebrow eyebrow--interne">Le miroir</p>'
      + '<p class="aide">Ce que tu regardes, comparé à ce que contient le catalogue.</p>'
      + '<ul class="liste liste--compacte">' + reflets.map(ligne => {
          const ecart = Math.round((ligne.part_vue - ligne.part_catalogue) * 100);
          return '<li class="liste__item"><span class="liste__titre">'
            + echapper(ligne.axe + " · " + ligne.valeur) + '</span>'
            + '<span class="liste__meta">' + Math.round(ligne.part_vue * 100) + ' % chez toi, '
            + Math.round(ligne.part_catalogue * 100) + ' % au catalogue — '
            + (ecart > 0 ? '+' : '') + ecart + ' point' + (Math.abs(ecart) > 1 ? 's' : '') + '</span></li>';
        }).join("") + '</ul>';
  }
  return html + bandeau() + '</section>';
}

    Object.assign(atelier, recherche.criteres);
    aller("atelier");
  },

    const profil = profil_actif();
    profil.recherches = supprimer_recherche(profil.recherches || [], el.dataset.id);
    sauver(); rendre();
  },

  /* — Le fil des voisins — */
  "fil-depuis": (el) => { fil = [el.dataset.cle]; aller("fil"); },

  "fil-avancer": (el) => { fil = fil.concat([el.dataset.cle]); rendre(); },

  "fil-reculer": () => { fil = fil.slice(0, -1); rendre(); },

  "fil-vider": () => { fil = []; rendre(); },

  "fil-hasard": () => {
    const catalogue = catalogue_complet();
    const alea = fabriquer_alea(Date.now() % 100000);
    fil = [cle_oeuvre(catalogue[Math.floor(alea() * catalogue.length)])];
    rendre();
  },

  /* — Comparateur — */
  "vers-comparaison": (el) => {
    const cle = el.dataset.cle;
    if(comparaison.indexOf(cle) !== -1){ signaler("Ce titre est déjà en lice."); return; }
    comparaison = comparaison.length >= 2 ? [comparaison[1], cle] : comparaison.concat([cle]);
    const oeuvre = oeuvre_par_cle(cle);
    signaler(comparaison.length === 2
      ? "Deux titres en lice — « Comparer deux titres » depuis l'accueil."
      : "« " + (oeuvre ? oeuvre.t : "Titre") + " » retenu. Il en faut un second.");
  },

  "retirer-comparaison": (el) => {
    comparaison = comparaison.filter(cle => cle !== el.dataset.cle);
    rendre({focus:false});
  },

  "vider-comparaison": () => { comparaison = []; rendre(); },

  /* — Défis — */
  "defi-nouveau": () => { defi_courant = null; graine_defi = (graine_defi + 1) % 100000; rendre(); },
  "defi-autre-titre": () => { graine_defi = (graine_defi + 1) % 100000; rendre(); },
  "defi-choisir": (el) => { defi_courant = el.dataset.id; graine_defi = (graine_defi + 1) % 100000; rendre(); },

  /* — Suggestion du moment — */
  "basculer-moment": () => {
    moment_actif = !moment_actif;
    signaler(moment_actif ? "La suggestion suivra de nouveau la saison." : "Suggestion du moment désactivée.");
  },

  "moment-fiche": (el) => { fiche_cle = el.dataset.cle; aller("fiche"); }
});

/** Palette SVG d'une œuvre (F3). Aucune image chargée : cinq rectangles calculés. */
function palette_svg(oeuvre){
  const couleurs = palette_oeuvre(oeuvre);
  let bandes = "";
  couleurs.forEach((couleur, rang) => {
    bandes += '<rect x="' + (rang * 20) + '" y="0" width="20" height="28" fill="' + couleur + '"/>';
  });
  return '<svg class="palette" viewBox="0 0 100 28" role="img" aria-label="Palette de couleurs du titre">'
    + bandes + '</svg>';
}

/** Constellation SVG d'une filmographie (F14). */
function constellation_svg(oeuvres){
  const donnees = constellation(oeuvres);
  if(donnees.points.length < 2) return "";
  let points = "";
  for(const point of donnees.points){
    const x = 6 + point.x * 88;
    const y = 46 - point.y * 34;
    points += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="1.8">'
      + '<title>' + echapper(point.oeuvre.t + " (" + point.oeuvre.a + ")") + '</title></circle>';
  }
  return '<figure class="constellation">'
    + '<svg viewBox="0 0 100 54" role="img" aria-label="Répartition des œuvres par année et exigence">'
    + '<line x1="6" y1="48" x2="94" y2="48" class="axe"/>'
    + '<line x1="6" y1="48" x2="6" y2="8" class="axe"/>'
    + points + '</svg>'
    + '<figcaption>De ' + donnees.min + ' à ' + donnees.max
    + ' — plus le point est haut, plus le film demande d\'attention.</figcaption></figure>';
}

  let html = '<section class="ecran">' + entete("Le sablier", "accueil")
    + '<h2 class="titre-question" tabindex="-1" data-focus>Combien de temps as-tu ?</h2>'
    + '<p class="sous-titre">On ne cherche pas ce qui rentre : on cherche ce qui remplit.</p>'
    + '<div class="options options--grille">';
  for(const palier of paliers){
    html += '<button class="option' + (sablier_minutes === palier ? " option--choisie" : "") + '"'
      + ' data-agir="sablier-duree" data-minutes="' + palier + '">'
      + '<span class="option__marque"></span><span class="option__texte"><strong>'
      + formater_duree(palier) + '</strong></span></button>';
  }
  html += '</div>'
    + '<div class="bascule">'
    + '<button class="lien' + (sablier_mode === "un" ? " lien--actif" : "") + '" data-agir="sablier-mode" data-mode="un">Un seul titre</button>'
    + '<span class="lien-sep">·</span>'
    + '<button class="lien' + (sablier_mode === "soiree" ? " lien--actif" : "") + '" data-agir="sablier-mode" data-mode="soiree">Une soirée entière</button>'
    + '</div>' + filet();

  if(sablier_mode === "un"){
    const vues = (profil.journal || []).filter(e => e.statut === "deja_vu").map(e => e.cle);
    const trouves = tenir_dans(CATALOGUE, sablier_minutes, {exclure: vues, combien: 14});
    html += trouves.length === 0
      ? '<p class="vide">Rien ne remplit exactement ce créneau. Essaie une autre durée.</p>'
      : '<ul class="liste">' + trouves.map(o =>
          ligne_titre(o, formater_duree(duree_minutes(o.d)))).join("") + '</ul>';
  } else {
    const soiree = remplir_soiree(CATALOGUE, sablier_minutes, graine_sablier);
    if(soiree.titres.length === 0){
      html += '<p class="vide">Pas de combinaison trouvée pour ce créneau.</p>';
    } else {
      const horaires = horaires_soiree(soiree.titres, heure_soiree, 15);
      html += '<p class="sous-titre">' + soiree.titres.length + ' titres, '
        + formater_duree(soiree.total) + ' de projection, '
        + formater_duree(Math.max(0, soiree.reste)) + ' de battement.</p>'
        + '<ul class="liste">' + horaires.map(creneau =>
            ligne_titre(creneau.oeuvre, creneau.debut + " → " + creneau.fin)).join("") + '</ul>'
        + '<button class="bouton bouton--second" data-agir="sablier-relancer">Une autre combinaison</button>';
    }
  }
  return html + bandeau() + '</section>';
}

    html += '<button class="lien' + (almanach_mois === index ? " lien--actif" : "") + '"'
      + ' data-agir="almanach-mois" data-mois="' + index + '">' + nom + '</button>';
