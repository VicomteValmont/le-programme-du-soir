{t:"Le Testament du docteur Mabuse",a:1933,r:"Fritz Lang",f:"film",d:"2 h 02",p:"Un criminel interné dicte des plans de terreur depuis sa cellule, et quelqu'un les exécute.",g:["tension"],c:"ville",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","berlin","complot","police","pouvoir"],v:["M le maudit","Le Docteur Mabuse"],hist:"Interdit par Goebbels, qui aurait ensuite proposé à Lang de diriger le cinéma allemand. Lang a quitté le pays, selon son récit, le soir même."},
{t:"La Grève",a:1925,r:"Sergueï Eisenstein",f:"film",d:"1 h 22",p:"Des ouvriers cessent le travail, la police infiltre, et la répression tombe.",g:["tension","apprendre"],c:"ville",e:"passe",x:3,fin:"sombre",fam:false,tg:["muet","noir-et-blanc","russie","travail","politique"],v:["Le Cuirassé Potemkine","Octobre"]},
{t:"Octobre",a:1928,r:"Sergueï Eisenstein",f:"film",d:"1 h 43",p:"La révolution de 1917 reconstituée dix ans plus tard, dans les lieux mêmes où elle s'est produite.",g:["eblouissement","apprendre"],c:"ville",e:"passe",x:3,fin:"douce",fam:false,tg:["muet","noir-et-blanc","russie","histoire","politique"],v:["Le Cuirassé Potemkine","La Grève"],hist:"La prise du palais d'Hiver rejouée pour le film a mobilisé plus de figurants que l'événement réel, et ses images ont depuis été prises pour des archives authentiques."},
{t:"Alexandre Nevski",a:1938,r:"Sergueï Eisenstein",f:"film",d:"1 h 52",p:"Un prince russe repousse les chevaliers teutoniques sur un lac gelé qui cède sous leur armure.",g:["eblouissement","tension"],c:"pluie",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","russie","guerre","musique","hiver"],v:["Le Cuirassé Potemkine","Octobre"],hist:"La bataille du lac a été tournée en plein été, sur du verre et de l'asphalte peints en blanc. La partition de Prokofiev est jouée en concert comme une œuvre autonome."},
{t:"La Mère",a:1926,r:"Vsevolod Poudovkine",f:"film",d:"1 h 29",p:"Une femme dénonce son fils révolutionnaire par naïveté, puis prend sa place dans le combat.",g:["tension"],c:"ville",e:"passe",x:3,fin:"sombre",fam:false,tg:["muet","noir-et-blanc","russie","famille","politique"],v:["Le Cuirassé Potemkine","La Grève"],src:{auteur:"Maxime Gorki",oeuvre:"La Mère",nature:"roman"}},
{t:"L'Homme à la caméra",a:1929,r:"Dziga Vertov",f:"doc",d:"1 h 08",p:"Une journée en URSS filmée par un cameraman qu'on voit filmer, monter, et se montrer.",g:["eblouissement","apprendre"],c:"ville",e:"passe",x:3,fin:"ouverte",fam:false,tg:["muet","noir-et-blanc","russie","cinema","immersion"],v:["Berlin, symphonie d'une grande ville","Le Cuirassé Potemkine"],hist:"Régulièrement classé premier documentaire de tous les temps par les sondages de critiques. Vertov y invente ou systématise presque tous les trucages connus du montage."},
{t:"La Terre",a:1930,r:"Alexandre Dovjenko",f:"film",d:"1 h 15",p:"Un village ukrainien reçoit son premier tracteur, et un jeune paysan meurt d'y avoir cru.",g:["eblouissement"],c:"soleil",e:"passe",x:3,fin:"douce",fam:false,tg:["muet","noir-et-blanc","russie","campagne","nature"],v:["La Mère","Octobre"]},
{t:"La Charrette fantôme",a:1921,r:"Victor Sjöström",f:"film",d:"1 h 47",p:"Le dernier mort de l'année conduit la charrette de la Mort pendant douze mois. Un ivrogne apprend que ce sera lui.",g:["tension","eblouissement"],c:"pluie",e:"passe",x:3,fin:"douce",fam:false,tg:["muet","noir-et-blanc","suede","etrange","spiritualite"],v:["Le Vent","Le Septième Sceau"],hist:"Les surimpressions du spectre ont demandé de tourner chaque plan quatre fois sur la même pellicule. Bergman a dit avoir revu ce film une fois par an toute sa vie."},
{t:"La Légende de Gösta Berling",a:1924,r:"Mauritz Stiller",f:"film",d:"3 h 03",p:"Un pasteur défroqué erre dans la Suède du XIXe siècle entre les grandes demeures.",g:["eblouissement"],c:"pluie",e:"passe",x:3,fin:"douce",fam:false,tg:["muet","noir-et-blanc","suede","hiver","romanesque"],v:["La Charrette fantôme","Le Vent"],hist:"Premier grand rôle de Greta Garbo, dix-huit ans, qui a suivi Stiller à Hollywood l'année suivante."},
{t:"Vampyr",a:1932,r:"Carl Theodor Dreyer",f:"film",d:"1 h 15",p:"Un voyageur arrive dans un village où une jeune femme s'éteint, et où les ombres se déplacent seules.",g:["tension"],c:"pluie",e:"passe",x:3,fin:"douce",fam:false,tg:["noir-et-blanc","etrange","malaise","reve","village"],v:["Nosferatu","La Passion de Jeanne d'Arc"],hist:"Dreyer a fait filmer à travers une gaze pour obtenir un flou laiteux, et n'a presque pas utilisé de dialogue : le film sort parlant mais reste construit comme un muet."},
{t:"Le Maître du logis",a:1925,r:"Carl Theodor Dreyer",f:"film",d:"1 h 47",p:"Un tyran domestique est remis à sa place par l'ancienne nourrice de sa femme.",g:["tension","rire"],c:"pluie",e:"passe",x:3,fin:"douce",fam:false,tg:["muet","noir-et-blanc","danemark","famille","huis-clos"],v:["La Passion de Jeanne d'Arc","Vampyr"]},
{t:"J'accuse",a:1919,r:"Abel Gance",f:"film",d:"2 h 46",p:"Un poète revient du front et convoque les morts de la guerre pour qu'ils jugent les vivants.",g:["tension","eblouissement"],c:"ailleurs",e:"passe",x:3,fin:"sombre",fam:false,tg:["muet","noir-et-blanc","guerre","france","poesie"],v:["Napoléon","La Grande Illusion"],hist:"Gance a tourné la marche des morts avec de vrais permissionnaires de Verdun ; la plupart sont retournés au front et y sont morts dans les semaines suivantes."},
{t:"La Roue",a:1923,r:"Abel Gance",f:"film",d:"4 h 30",p:"Un cheminot élève une orpheline recueillie dans un accident, et l'aime sans pouvoir le dire.",g:["tension","eblouissement"],c:"ailleurs",e:"passe",x:3,fin:"sombre",fam:false,tg:["muet","noir-et-blanc","train","france","montagne"],v:["Napoléon","J'accuse"],hist:"Le montage accéléré des séquences de locomotive, jusqu'à une image par plan, a bouleversé les avant-gardes européennes et influencé le montage soviétique."},
{t:"L'Argent",a:1928,r:"Marcel L'Herbier",f:"film",d:"2 h 15",p:"Un banquier ruine un rival en finançant son exploit aérien, puis lui prend sa femme.",g:["tension","eblouissement"],c:"ville",e:"passe",x:3,fin:"sombre",fam:false,tg:["muet","noir-et-blanc","paris","argent","decor"],v:["Metropolis","L'Inhumaine"],hist:"L'Herbier a tourné à la Bourse de Paris avec quinze caméras et deux mille figurants, dans les conditions du direct."},
{t:"Un chien andalou",a:1929,r:"Luis Buñuel",f:"film",d:"0 h 21",p:"Des images sans lien logique, dont un œil tranché au rasoir, assemblées pour qu'aucune explication ne tienne.",g:["eblouissement"],c:"ville",e:"passe",x:3,fin:"ouverte",fam:false,tg:["muet","noir-et-blanc","reve","etrange","art"],v:["L'Âge d'or","Le Sang d'un poète"],hist:"Buñuel et Dalí se sont interdit toute image qui aurait pu recevoir une explication rationnelle. Buñuel gardait des pierres en poche à la première, craignant une émeute."},
{t:"L'Âge d'or",a:1930,r:"Luis Buñuel",f:"film",d:"1 h 03",p:"Deux amants sont sans cesse séparés par la société, l'Église et les convenances.",g:["eblouissement","rire"],c:"ville",e:"passe",x:3,fin:"ouverte",fam:false,tg:["noir-et-blanc","satire","desir","etrange","spiritualite"],v:["Un chien andalou","Le Charme discret de la bourgeoisie"],hist:"Des ligues d'extrême droite ont saccagé la salle à Paris ; le film a été interdit cinquante ans en France."},
{t:"Le Sang d'un poète",a:1930,r:"Jean Cocteau",f:"film",d:"0 h 55",p:"Un peintre traverse un miroir et parcourt un couloir d'hôtel où chaque porte ouvre sur une obsession.",g:["eblouissement"],c:"ville",e:"passe",x:3,fin:"ouverte",fam:false,tg:["noir-et-blanc","reve","art","etrange","poesie"],v:["Orphée","Un chien andalou"]},
{t:"La Chute de la maison Usher",a:1928,r:"Jean Epstein",f:"film",d:"1 h 03",p:"Un peintre achève le portrait de sa femme, et la vie du modèle passe dans la toile.",g:["tension","eblouissement"],c:"pluie",e:"passe",x:3,fin:"sombre",fam:false,tg:["muet","noir-et-blanc","manoir","etrange","peinture"],v:["Nosferatu","Vampyr"],src:{auteur:"Edgar Allan Poe",oeuvre:"La Chute de la maison Usher",nature:"nouvelle"}},
{t:"Une page folle",a:1926,r:"Teinosuke Kinugasa",f:"film",d:"1 h 00",p:"Un ancien marin devient homme de peine dans l'asile où sa femme est internée.",g:["tension","eblouissement"],c:"pluie",e:"passe",x:3,fin:"ouverte",fam:false,tg:["muet","noir-et-blanc","japon","hopital","reve"],v:["Le Cabinet du docteur Caligari","Vampyr"],hist:"Perdu pendant quarante-cinq ans, le film a été retrouvé en 1971 par le réalisateur lui-même, dans une réserve à riz de son jardin."},
{t:"Gosses de Tokyo",a:1932,r:"Yasujirō Ozu",f:"film",d:"1 h 31",p:"Deux garçons découvrent que leur père, qu'ils admirent, s'aplatit devant son patron.",g:["rire","tension"],c:"ville",e:"passe",x:2,fin:"douce",fam:true,tg:["muet","noir-et-blanc","japon","enfance","famille"],v:["Le Voyage à Tokyo","Le Fils unique"]},
{t:"Le Fils unique",a:1936,r:"Yasujirō Ozu",f:"film",d:"1 h 23",p:"Une mère de province vient voir à Tokyo le fils pour qui elle s'est saignée, et découvre sa vie médiocre.",g:["tension"],c:"ville",e:"passe",x:3,fin:"douce",fam:false,tg:["noir-et-blanc","japon","famille","societe","dignite"],v:["Le Voyage à Tokyo","Gosses de Tokyo"],hist:"Premier film parlant d'Ozu, qui avait résisté six ans au son. Il en a fait un usage si économe que les silences y pèsent plus que les répliques."},
{t:"L'Élégie de Naniwa",a:1936,r:"Kenji Mizoguchi",f:"film",d:"1 h 11",p:"Une standardiste d'Osaka devient la maîtresse de son patron pour payer les dettes de son père.",g:["tension"],c:"ville",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","japon","femmes","argent","societe"],v:["Les Sœurs de Gion","Les Contes de la lune vague"]},
{t:"Les Sœurs de Gion",a:1936,r:"Kenji Mizoguchi",f:"film",d:"1 h 09",p:"Deux geishas de Kyoto s'opposent : l'une respecte les usages, l'autre les exploite. Les deux perdent.",g:["tension"],c:"ville",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","japon","femmes","societe","costume"],v:["L'Élégie de Naniwa","Les Contes de la lune vague"]},
{t:"Le Conte des chrysanthèmes tardifs",a:1939,r:"Kenji Mizoguchi",f:"film",d:"2 h 22",p:"Un acteur de kabuki médiocre est sauvé par une servante qui sacrifie tout à son art.",g:["tension","eblouissement"],c:"ville",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","japon","scene","femmes","dignite"],v:["Les Sœurs de Gion","Les Contes de la lune vague"],hist:"Mizoguchi filme presque tout en plans-séquences éloignés, refusant le gros plan : la caméra reste à la distance de quelqu'un qui n'oserait pas s'approcher."},
{t:"Humanité et ballons de papier",a:1937,r:"Sadao Yamanaka",f:"film",d:"1 h 26",p:"Dans une ruelle d'Edo, un samouraï sans maître et un coiffeur tentent un coup qui les dépasse.",g:["tension"],c:"pluie",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","japon","societe","village","dignite"],v:["Le Conte des chrysanthèmes tardifs"],hist:"Yamanaka a été envoyé au front le jour de la sortie et y est mort à vingt-neuf ans. Seuls trois de ses vingt-six films ont survécu."},
{t:"Scarface",a:1932,r:"Howard Hawks",f:"film",d:"1 h 33",p:"Un tueur de Chicago monte au sommet de la pègre et surveille sa sœur plus que ses rivaux.",g:["tension"],c:"ville",e:"passe",x:2,fin:"sombre",fam:false,tg:["noir-et-blanc","police","argent","chute","annees30"],v:["Le Petit César","L'Ennemi public"],hist:"La censure a exigé un sous-titre moralisateur et une fin réécrite. Hawks a tourné les deux versions et laissé les distributeurs choisir."},
{t:"L'Ennemi public",a:1931,r:"William A. Wellman",f:"film",d:"1 h 23",p:"Deux gamins de Chicago montent dans la contrebande d'alcool, et l'un y prend goût.",g:["tension"],c:"ville",e:"passe",x:2,fin:"sombre",fam:false,tg:["noir-et-blanc","police","argent","famille","annees30"],v:["Scarface","Le Petit César"]},
{t:"Le Petit César",a:1931,r:"Mervyn LeRoy",f:"film",d:"1 h 19",p:"Un petit voyou ambitieux prend la tête d'un gang et ne sait pas s'arrêter.",g:["tension"],c:"ville",e:"passe",x:2,fin:"sombre",fam:false,tg:["noir-et-blanc","police","argent","chute","annees30"],v:["Scarface","L'Ennemi public"]},
{t:"Je suis un évadé",a:1932,r:"Mervyn LeRoy",f:"film",d:"1 h 33",p:"Un vétéran innocent est condamné aux travaux forcés, s'évade, et ne peut plus jamais s'arrêter de fuir.",g:["tension"],c:"soleil",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","prison","evasion","societe","proces"],v:["Les Évadés","Les Raisins de la colère"],hist:"Le film a provoqué une réforme du bagne en Géorgie. L'homme dont il s'inspire a été gracié des années plus tard, en partie grâce à lui."},
{t:"Dracula",a:1931,r:"Tod Browning",f:"film",d:"1 h 15",p:"Un comte transylvanien s'installe à Londres et choisit ses proies parmi ses voisins.",g:["tension"],c:"pluie",e:"passe",x:1,fin:"douce",fam:false,tg:["noir-et-blanc","etrange","londres","manoir","annees30"],v:["Frankenstein","Nosferatu"],src:{auteur:"Bram Stoker",oeuvre:"Dracula",nature:"roman"}},
{t:"Freaks",a:1932,r:"Tod Browning",f:"film",d:"1 h 04",p:"Une trapéziste épouse un homme de petite taille pour son héritage. Les artistes de la baraque la jugent.",g:["tension"],c:"ailleurs",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","scene","malaise","societe","vengeance"],v:["Dracula","Elephant Man"],hist:"Interdit trente ans au Royaume-Uni et amputé d'un quart aux États-Unis, le film a détruit la carrière de Browning avant d'être réhabilité par la contre-culture des années soixante."},
{t:"La Momie",a:1932,r:"Karl Freund",f:"film",d:"1 h 13",p:"Un prêtre égyptien ressuscité cherche dans le Caire moderne la réincarnation de son amour.",g:["tension"],c:"soleil",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","egypte","etrange","amour","annees30"],v:["Dracula","Frankenstein"]},
{t:"La Soupe au canard",a:1933,r:"Leo McCarey",f:"film",d:"1 h 08",p:"Un fantoche prend le pouvoir en Freedonia et déclare la guerre à un pays voisin pour une insulte.",g:["rire"],c:"ville",e:"passe",x:1,fin:"douce",fam:true,tg:["noir-et-blanc","comedie","satire","politique","absurde"],v:["Une nuit à l'opéra","Le Dictateur"],hist:"Échec commercial à sa sortie, il a été interdit en Italie par Mussolini, qui s'y est reconnu. C'est devenu la référence de la satire politique burlesque."},
{t:"Une nuit à l'opéra",a:1935,r:"Sam Wood",f:"film",d:"1 h 36",p:"Trois trublions sabotent une production d'opéra pour aider deux jeunes chanteurs.",g:["rire"],c:"ville",e:"passe",x:1,fin:"douce",fam:true,tg:["noir-et-blanc","comedie","scene","musique","absurde"],v:["La Soupe au canard","Le Dictateur"],hist:"La scène de la cabine bondée a été rodée sur scène devant un public pendant des semaines, chronomètre en main, avant d'être tournée."},
{t:"L'Extravagant Mr. Deeds",a:1936,r:"Frank Capra",f:"film",d:"1 h 55",p:"Un provincial hérite d'une fortune, veut la distribuer, et on le fait passer pour fou.",g:["rire","refuge"],c:"ville",e:"passe",x:1,fin:"douce",fam:true,tg:["noir-et-blanc","comedie","argent","proces","societe"],v:["Monsieur Smith au Sénat","La Vie est belle"],prix:["Oscar de la meilleure réalisation 1937"]},
{t:"Vous ne l'emporterez pas avec vous",a:1938,r:"Frank Capra",f:"film",d:"2 h 06",p:"Une famille d'excentriques refuse de vendre sa maison au père du fiancé de leur fille.",g:["rire","refuge"],c:"ville",e:"passe",x:1,fin:"douce",fam:true,tg:["noir-et-blanc","comedie","famille","maison","argent"],v:["L'Extravagant Mr. Deeds","La Vie est belle"],prix:["Oscar du meilleur film 1939"]},
{t:"L'Impossible Monsieur Bébé",a:1938,r:"Howard Hawks",f:"film",d:"1 h 42",p:"Un paléontologue timide, une héritière ingérable et un léopard apprivoisé dans le Connecticut.",g:["rire"],c:"ailleurs",e:"passe",x:1,fin:"douce",fam:true,tg:["noir-et-blanc","comedie","animaux","absurde","amour"],v:["Indiscrétions","New York-Miami"],hist:"Échec cuisant qui a valu à Katharine Hepburn l'étiquette de « poison au box-office ». Le film est aujourd'hui le modèle de la comédie loufoque."},
{t:"Ninotchka",a:1939,r:"Ernst Lubitsch",f:"film",d:"1 h 50",p:"Une commissaire soviétique envoyée à Paris pour redresser trois camarades dévoyés découvre les chapeaux.",g:["rire"],c:"ville",e:"passe",x:2,fin:"douce",fam:true,tg:["noir-et-blanc","paris","comedie","satire","amour"],v:["Sérénade à trois","Indiscrétions"],hist:"L'affiche annonçait « Garbo rit ! » : c'était sa première comédie après treize ans de rôles tragiques."},
{t:"Sérénade à trois",a:1933,r:"Ernst Lubitsch",f:"film",d:"1 h 31",p:"Une dessinatrice vit avec un peintre et un dramaturge, et refuse de choisir.",g:["rire"],c:"ville",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","paris","comedie","desir","art"],v:["Ninotchka","Haute Pègre"],hist:"Sorti juste avant l'application stricte du code Hays, il n'a pas pu être réédité pendant trente ans à cause de son ménage à trois assumé."},
{t:"Haute Pègre",a:1932,r:"Ernst Lubitsch",f:"film",d:"1 h 23",p:"Deux voleurs élégants s'associent pour dépouiller une riche parfumeuse, et l'un s'attache.",g:["rire"],c:"ville",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","comedie","imposteur","paris","amour"],v:["Sérénade à trois","Ninotchka"]},
{t:"Les Aventures de Robin des Bois",a:1938,r:"Michael Curtiz & William Keighley",f:"film",d:"1 h 42",p:"Un noble saxon prend le maquis contre le prince Jean, en collants verts et en Technicolor.",g:["eblouissement","rire"],c:"ailleurs",e:"passe",x:1,fin:"douce",fam:true,tg:["couleur","aventure","angleterre","foret","costume"],v:["Capitaine Blood","Le Voleur de Bagdad"],prix:["3 Oscars 1939"],hist:"L'un des premiers grands films en Technicolor trichrome, dont les couleurs saturées ont fixé pour longtemps l'imagerie du film d'aventures."},
{t:"Capitaine Blood",a:1935,r:"Michael Curtiz",f:"film",d:"1 h 59",p:"Un médecin irlandais condamné au bagne s'évade et devient le pirate le plus courtois des Caraïbes.",g:["eblouissement"],c:"soleil",e:"passe",x:1,fin:"douce",fam:true,tg:["noir-et-blanc","aventure","mer","evasion","costume"],v:["Les Aventures de Robin des Bois","Pirates des Caraïbes : La Malédiction du Black Pearl"],hist:"Errol Flynn, inconnu, a obtenu le rôle après le désistement de Robert Donat ; il est devenu star en une seule sortie."},
{t:"Le Mouchard",a:1935,r:"John Ford",f:"film",d:"1 h 31",p:"Un colosse dénonce son ami de l'IRA pour vingt livres, puis erre dans Dublin avec l'argent.",g:["tension"],c:"pluie",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","irlande","nuit","dignite","politique"],v:["Vers sa destinée","Le Vent se lève (Irlande)"],prix:["4 Oscars 1936"]},
{t:"Vers sa destinée",a:1939,r:"John Ford",f:"film",d:"1 h 40",p:"Le jeune Abraham Lincoln, avocat de campagne, défend deux frères accusés de meurtre.",g:["refuge","apprendre"],c:"ailleurs",e:"passe",x:2,fin:"douce",fam:true,tg:["noir-et-blanc","amerique","proces","biopic","campagne"],v:["Le Mouchard","La Chevauchée fantastique"]},
{t:"Sur la piste des Mohawks",a:1939,r:"John Ford",f:"film",d:"1 h 44",p:"Un couple de colons défriche la vallée de la Mohawk pendant la guerre d'Indépendance.",g:["eblouissement"],c:"ailleurs",e:"passe",x:2,fin:"douce",fam:true,tg:["couleur","amerique","guerre","campagne","famille"],v:["La Chevauchée fantastique","Le Dernier des Mohicans"]},
{t:"Fury",a:1936,r:"Fritz Lang",f:"film",d:"1 h 32",p:"Un innocent arrêté par erreur est presque lynché par une foule, et revient hanter ceux qui l'ont voulu mort.",g:["tension"],c:"ville",e:"passe",x:3,fin:"ouverte",fam:false,tg:["noir-et-blanc","proces","societe","vengeance","amerique"],v:["Je suis un évadé","M le maudit"],hist:"Premier film américain de Lang, tourné deux ans après son départ d'Allemagne. Il y transpose la peur de la foule qu'il avait filmée dans M le maudit."},
{t:"Une étoile est née",a:1937,r:"William A. Wellman",f:"film",d:"1 h 51",p:"Une jeune actrice monte pendant que son mari, star déclinante, sombre dans l'alcool.",g:["tension"],c:"ville",e:"passe",x:2,fin:"sombre",fam:false,tg:["couleur","cinema","amour","chute","amerique"],v:["Boulevard du crépuscule","La Comtesse aux pieds nus"],prix:["Oscar du meilleur scénario original 1938"]},
{t:"Grand Hôtel",a:1932,r:"Edmund Goulding",f:"film",d:"1 h 52",p:"Un hôtel de Berlin, une danseuse épuisée, un baron voleur et un comptable qui va mourir.",g:["eblouissement"],c:"ville",e:"passe",x:2,fin:"ouverte",fam:false,tg:["noir-et-blanc","hotel","berlin","fresque","argent"],v:["The Grand Budapest Hotel","Le Dernier des hommes"],prix:["Oscar du meilleur film 1932"],hist:"Seul film à avoir remporté l'Oscar du meilleur film sans aucune autre nomination. Il a inventé le récit choral situé dans un lieu unique."},
{t:"La Reine Christine",a:1933,r:"Rouben Mamoulian",f:"film",d:"1 h 39",p:"La reine de Suède, élevée en homme, abdique pour un ambassadeur espagnol.",g:["eblouissement"],c:"pluie",e:"passe",x:2,fin:"sombre",fam:false,tg:["noir-et-blanc","suede","costume","pouvoir","amour"],v:["Sissi","Le Guépard"],hist:"Le plan final, où Garbo fixe l'horizon sans expression, a été obtenu en lui demandant de ne penser à rien : chacun y projette ce qu'il veut."},
{t:"Docteur Jekyll et M. Hyde",a:1931,r:"Rouben Mamoulian",f:"film",d:"1 h 38",p:"Un médecin londonien libère sa part la plus basse par une potion, et ne sait plus la rappeler.",g:["tension"],c:"pluie",e:"passe",x:2,fin:"sombre",fam:false,tg:["noir-et-blanc","londres","etrange","identite","science"],v:["L'Homme invisible","Frankenstein"],prix:["Oscar du meilleur acteur 1932"],src:{auteur:"Robert Louis Stevenson",oeuvre:"L'Étrange Cas du docteur Jekyll et de M. Hyde",nature:"roman"}},
{t:"Rue sans issue",a:1937,r:"William Wyler",f:"film",d:"1 h 33",p:"Une impasse new-yorkaise où un immeuble de luxe donne sur un taudis, et où les gamins regardent.",g:["tension"],c:"ville",e:"passe",x:2,fin:"ouverte",fam:false,tg:["noir-et-blanc","new-york","societe","enfance","argent"],v:["Les Raisins de la colère","La Foule"]},
{t:"Boudu sauvé des eaux",a:1932,r:"Jean Renoir",f:"film",d:"1 h 25",p:"Un libraire repêche un clochard dans la Seine et l'installe chez lui. Le clochard s'y installe vraiment.",g:["rire"],c:"ailleurs",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","paris","comedie","satire","fleuve"],v:["Le Crime de Monsieur Lange","La Règle du jeu"]},
{t:"Le Crime de Monsieur Lange",a:1936,r:"Jean Renoir",f:"film",d:"1 h 20",p:"Les employés d'une imprimerie reprennent l'affaire quand le patron s'enfuit, puis il revient.",g:["rire","tension"],c:"ville",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","paris","travail","politique","voisinage"],v:["Boudu sauvé des eaux","La Grande Illusion"],hist:"Écrit avec Jacques Prévert dans l'élan du Front populaire, le film est le seul de Renoir à mettre en scène une coopérative ouvrière qui fonctionne."},
{t:"Une partie de campagne",a:1936,r:"Jean Renoir",f:"film",d:"0 h 40",p:"Une famille parisienne déjeune au bord de l'eau, et la fille connaît un après-midi qu'elle n'oubliera pas.",g:["eblouissement","refuge"],c:"soleil",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","france","campagne","desir","fleuve"],v:["La Règle du jeu","Le Crime de Monsieur Lange"],hist:"Interrompu par la pluie et jamais terminé, le film a été monté et sorti dix ans plus tard sans que Renoir y participe.",src:{auteur:"Guy de Maupassant",oeuvre:"Une partie de campagne",nature:"nouvelle"}},
{t:"La Bête humaine",a:1938,r:"Jean Renoir",f:"film",d:"1 h 40",p:"Un mécanicien de locomotive hérité d'une hérédité lourde aime la femme d'un chef de gare meurtrier.",g:["tension"],c:"pluie",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","train","france","desir","adaptation"],v:["Le Quai des brumes","La Règle du jeu"],src:{auteur:"Émile Zola",oeuvre:"La Bête humaine",nature:"roman"}},
{t:"Marius",a:1931,r:"Alexander Korda",f:"film",d:"2 h 07",p:"Sur le Vieux-Port de Marseille, un fils de cafetier rêve de partir en mer et aime Fanny.",g:["refuge"],c:"soleil",e:"passe",x:2,fin:"sombre",fam:true,tg:["noir-et-blanc","marseille","mediterranee","famille","amour"],v:["La Femme du boulanger"],src:{auteur:"Marcel Pagnol",oeuvre:"Marius",nature:"pièce"}},
{t:"La Femme du boulanger",a:1938,r:"Marcel Pagnol",f:"film",d:"2 h 13",p:"La femme du boulanger part avec un berger. Le village entier s'en mêle, parce que le pain ne cuit plus.",g:["rire","refuge"],c:"soleil",e:"passe",x:2,fin:"douce",fam:true,tg:["noir-et-blanc","provence","village","comedie","amour"],v:["Marius","Jean de Florette"],hist:"Orson Welles a dit de Raimu qu'il était le plus grand acteur du monde, et de ce film qu'il l'avait revu plus que tout autre."},
{t:"Angèle",a:1934,r:"Marcel Pagnol",f:"film",d:"2 h 10",p:"Une fille de ferme séduite et abandonnée à la ville revient cachée dans la cave paternelle.",g:["tension","refuge"],c:"soleil",e:"passe",x:3,fin:"douce",fam:false,tg:["noir-et-blanc","provence","campagne","famille","dignite"],v:["La Femme du boulanger","Regain"],src:{auteur:"Jean Giono",oeuvre:"Un de Baumugnes",nature:"roman"}},
{t:"Regain",a:1937,r:"Marcel Pagnol",f:"film",d:"2 h 06",p:"Un village de Provence n'a plus qu'un habitant. Une femme y arrive, et le blé repousse.",g:["refuge"],c:"soleil",e:"passe",x:2,fin:"douce",fam:true,tg:["noir-et-blanc","provence","village","campagne","nature"],v:["Angèle","La Femme du boulanger"],src:{auteur:"Jean Giono",oeuvre:"Regain",nature:"roman"}},
{t:"Zéro de conduite",a:1933,r:"Jean Vigo",f:"film",d:"0 h 44",p:"Des internes se soulèvent contre un pensionnat dirigé par un nain en redingote.",g:["rire","eblouissement"],c:"pluie",e:"passe",x:3,fin:"douce",fam:false,tg:["noir-et-blanc","ecole","enfance","france","reve"],v:["L'Atalante","Les Quatre Cents Coups"],hist:"Interdit par la censure française jusqu'en 1945 pour atteinte à l'autorité. Truffaut en a repris le motif de la révolte scolaire dans Les 400 Coups."},
{t:"Le Million",a:1931,r:"René Clair",f:"film",d:"1 h 21",p:"Un billet de loterie gagnant reste dans une veste, et tout Paris court après la veste.",g:["rire"],c:"ville",e:"passe",x:1,fin:"douce",fam:true,tg:["noir-et-blanc","paris","comedie","musique","poursuite"],v:["Sous les toits de Paris","À nous la liberté"]},
{t:"À nous la liberté",a:1931,r:"René Clair",f:"film",d:"1 h 44",p:"Deux évadés prennent des chemins opposés : l'un devient patron d'usine, l'autre reste libre.",g:["rire","apprendre"],c:"ville",e:"passe",x:2,fin:"douce",fam:true,tg:["noir-et-blanc","travail","satire","comedie","evasion"],v:["Les Temps modernes","Le Million"],hist:"Le producteur a voulu poursuivre Chaplin pour plagiat après Les Temps modernes. Clair, admiratif, a refusé de s'y associer."},
{t:"Sous les toits de Paris",a:1930,r:"René Clair",f:"film",d:"1 h 36",p:"Un chanteur de rue et son ami aiment la même Roumaine, entre deux couplets sur les zincs.",g:["refuge","rire"],c:"ville",e:"passe",x:2,fin:"douce",fam:true,tg:["noir-et-blanc","paris","musique","amitie","amour"],v:["Le Million","Hôtel du Nord"],hist:"L'un des premiers films parlants français, mais Clair y garde de longues séquences muettes : il jugeait le son bavard et s'en méfiait."},
{t:"Hôtel du Nord",a:1938,r:"Marcel Carné",f:"film",d:"1 h 35",p:"Deux amants ratent leur suicide sur le canal Saint-Martin, et la vie de l'hôtel continue autour.",g:["tension","refuge"],c:"ville",e:"passe",x:2,fin:"ouverte",fam:false,tg:["noir-et-blanc","paris","hotel","amour","voisinage"],v:["Le Quai des brumes","Le Jour se lève"],hist:"La réplique d'Arletty sur l'atmosphère est devenue si célèbre qu'elle a fini par éclipser le film entier."},
{t:"Drôle de drame",a:1937,r:"Marcel Carné",f:"film",d:"1 h 49",p:"Un botaniste londonien écrit des romans policiers sous pseudonyme, et doit disparaître pour le cacher.",g:["rire"],c:"pluie",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","londres","comedie","absurde","imposteur"],v:["Hôtel du Nord","Les Enfants du paradis"]},
{t:"La Kermesse héroïque",a:1935,r:"Jacques Feyder",f:"film",d:"1 h 55",p:"En 1616, les hommes d'une ville flamande se cachent devant les Espagnols. Les femmes les accueillent.",g:["rire"],c:"pluie",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","belgique","peinture","satire","femmes"],v:["Les Visiteurs du soir","Le Ventre de l'architecte"],hist:"Les décors reconstituent la peinture flamande du XVIIe siècle plan par plan. Le film a été interdit en Belgique occupée, jugé insultant pour la nation."},
{t:"Un carnet de bal",a:1937,r:"Julien Duvivier",f:"film",d:"2 h 10",p:"Une veuve retrouve le carnet de son premier bal et va revoir, un par un, ceux qui l'y ont invitée.",g:["tension","refuge"],c:"pluie",e:"passe",x:2,fin:"sombre",fam:false,tg:["noir-et-blanc","france","memoire","melancolie","fresque"],v:["Pépé le Moko","Le Jour se lève"]},
{t:"La Bandera",a:1935,r:"Julien Duvivier",f:"film",d:"1 h 40",p:"Un meurtrier parisien s'engage dans la Légion espagnole au Maroc pour disparaître.",g:["tension"],c:"soleil",e:"passe",x:2,fin:"sombre",fam:false,tg:["noir-et-blanc","desert","afrique","fuite","guerre"],v:["Pépé le Moko","Le Quai des brumes"]},
{t:"L'Homme qui en savait trop",a:1934,r:"Alfred Hitchcock",f:"film",d:"1 h 15",p:"Un couple anglais en vacances en Suisse apprend un attentat, et on leur enlève leur fille pour les taire.",g:["tension"],c:"pluie",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","suisse","poursuite","famille","complot"],v:["Les 39 Marches","Une femme disparaît"]},
{t:"Chantage",a:1929,r:"Alfred Hitchcock",f:"film",d:"1 h 24",p:"Une jeune femme tue un agresseur, et un maître chanteur a vu. Son fiancé est policier.",g:["tension"],c:"ville",e:"passe",x:2,fin:"sombre",fam:false,tg:["noir-et-blanc","londres","police","secret","malaise"],v:["Les 39 Marches","L'Inconnu du Nord-Express"],hist:"Premier film parlant britannique. Commencé muet, il a été partiellement retourné quand le studio a exigé le son en cours de production."},
{t:"Jeune et innocent",a:1937,r:"Alfred Hitchcock",f:"film",d:"1 h 20",p:"Un homme accusé à tort d'un meurtre fuit avec la fille du chef de la police.",g:["tension","rire"],c:"ailleurs",e:"passe",x:1,fin:"douce",fam:true,tg:["noir-et-blanc","angleterre","poursuite","enquete","amour"],v:["Les 39 Marches","La Mort aux trousses"],hist:"Le plan qui traverse une salle de bal entière pour finir sur l'œil d'un batteur grimé a demandé une grue construite pour l'occasion."},
{t:"La Vie privée d'Henry VIII",a:1933,r:"Alexander Korda",f:"film",d:"1 h 37",p:"Le roi enchaîne les épouses entre deux plats, sans que l'appétit ni la couronne y perdent.",g:["rire","eblouissement"],c:"pluie",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","angleterre","costume","pouvoir","satire"],v:["Les Quatre Plumes blanches","Le Discours d'un roi"],prix:["Oscar du meilleur acteur 1934"],hist:"Premier film britannique à remporter un Oscar, il a ouvert le marché américain au cinéma anglais."},
{t:"Les Quatre Plumes blanches",a:1939,r:"Zoltan Korda",f:"film",d:"2 h 09",p:"Un officier qui démissionne à la veille du départ pour le Soudan reçoit quatre plumes de lâcheté.",g:["eblouissement","tension"],c:"soleil",e:"passe",x:2,fin:"douce",fam:true,tg:["couleur","desert","guerre","angleterre","dignite"],v:["Lawrence d'Arabie","La Vie privée d'Henry VIII"]},
{t:"Choses à venir",a:1936,r:"William Cameron Menzies",f:"film",d:"1 h 40",p:"Cent ans d'histoire à venir : une guerre de trente ans, une peste, puis une cité de verre.",g:["eblouissement","apprendre"],c:"ville",e:"imaginaire",x:3,fin:"ouverte",fam:false,tg:["sf","noir-et-blanc","guerre","decor","science"],v:["Metropolis","Le Jour où la Terre s'arrêta"],src:{auteur:"H. G. Wells",oeuvre:"La Machine à explorer le temps",nature:"roman"}},
{t:"Le Roman d'un tricheur",a:1936,r:"Sacha Guitry",f:"film",d:"1 h 21",p:"Un homme raconte sa vie de tricheur en voix off, et les personnages ne parlent presque jamais.",g:["rire"],c:"ville",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","paris","recit","comedie","imposteur"],v:["Drôle de drame","Le Million"],hist:"Guitry raconte tout le film en commentaire, procédé si inhabituel que Truffaut l'a désigné comme l'ancêtre direct de la Nouvelle Vague."},
{t:"Extase",a:1933,r:"Gustav Machatý",f:"film",d:"1 h 22",p:"Une jeune mariée quitte un mari trop vieux et rencontre un ingénieur au bord d'un lac.",g:["tension","eblouissement"],c:"soleil",e:"passe",x:3,fin:"ouverte",fam:false,tg:["noir-et-blanc","tchequie","desir","nature","femmes"],v:["Une partie de campagne","L'Âge d'or"],hist:"Condamné par le Vatican pour sa scène de nu et de plaisir féminin, il a valu à Hedy Lamarr une réputation dont elle a mis vingt ans à se défaire."},
{t:"Le Chemin de la vie",a:1931,r:"Nikolaï Ekk",f:"film",d:"1 h 55",p:"Des enfants des rues soviétiques sont rassemblés dans une commune de travail plutôt qu'en prison.",g:["apprendre","refuge"],c:"pluie",e:"passe",x:3,fin:"douce",fam:false,tg:["noir-et-blanc","russie","enfance","travail","societe"],v:["La Mère","Sur le chemin de l'école"],hist:"Premier film parlant soviétique, primé à la première Mostra de Venise en 1932."},
{t:"L'Inhumaine",a:1924,r:"Marcel L'Herbier",f:"film",d:"2 h 15",p:"Une cantatrice célèbre méprise ses admirateurs, jusqu'à ce qu'un ingénieur feigne d'en mourir.",g:["eblouissement"],c:"ville",e:"passe",x:3,fin:"douce",fam:false,tg:["muet","noir-et-blanc","decor","art","scene"],v:["L'Argent","Metropolis"],hist:"Décors signés Fernand Léger et Robert Mallet-Stevens, musique de Darius Milhaud : le film est une vitrine des arts décoratifs de 1925."},
{t:"Ménilmontant",a:1926,r:"Dimitri Kirsanoff",f:"film",d:"0 h 38",p:"Deux sœurs orphelines montent à Paris et aiment le même homme, sans un seul carton d'intertitre.",g:["tension"],c:"ville",e:"passe",x:3,fin:"douce",fam:false,tg:["muet","noir-et-blanc","paris","femmes","solitude"],v:["Une partie de campagne","La Foule"]},
{t:"La Souriante Madame Beudet",a:1923,r:"Germaine Dulac",f:"film",d:"0 h 38",p:"Une femme mariée à un lourdaud imagine sa mort, puis charge vraiment le revolver.",g:["tension"],c:"pluie",e:"passe",x:3,fin:"sombre",fam:false,tg:["muet","noir-et-blanc","france","femmes","reve"],v:["Ménilmontant","La Chute de la maison Usher"],hist:"Souvent cité comme le premier film féministe de l'histoire du cinéma, réalisé par l'une des rares femmes cinéastes de son temps."},
{t:"Le Signe de Zorro",a:1920,r:"Fred Niblo",f:"film",d:"1 h 47",p:"Un aristocrate californien indolent devient la nuit un justicier masqué qui signe d'un Z.",g:["rire","eblouissement"],c:"soleil",e:"passe",x:1,fin:"douce",fam:true,tg:["muet","noir-et-blanc","aventure","imposteur","costume"],v:["Robin des Bois","Capitaine Blood"],hist:"Douglas Fairbanks a inventé avec ce film la figure du héros à double identité, matrice directe de Batman et de tous les justiciers masqués."},
{t:"Robin des Bois",a:1922,r:"Allan Dwan",f:"film",d:"2 h 23",p:"Le comte de Huntingdon revient de croisade et trouve l'Angleterre aux mains du prince Jean.",g:["eblouissement"],c:"ailleurs",e:"passe",x:1,fin:"douce",fam:true,tg:["muet","noir-et-blanc","aventure","angleterre","foret"],v:["Le Signe de Zorro","Les Aventures de Robin des Bois"],hist:"Le château construit pour le film était le plus grand décor jamais bâti à Hollywood, et l'est resté une décennie."},
{t:"Les Nuits de Chicago",a:1927,r:"Josef von Sternberg",f:"film",d:"1 h 22",p:"Un gangster recueille une clocharde et la relève, sans voir qu'elle et son avocat s'attachent.",g:["tension"],c:"ville",e:"passe",x:3,fin:"douce",fam:false,tg:["muet","noir-et-blanc","nuit","police","amour"],v:["Le Petit César","L'Ange bleu"],prix:["Oscar du meilleur scénario original 1929"],hist:"Tenu pour le premier film de gangsters de l'histoire, il a fixé les codes que Scarface et Le Petit César reprendront cinq ans plus tard."},
{t:"Le Cabinet des figures de cire",a:1924,r:"Paul Leni",f:"film",d:"1 h 23",p:"Un poète écrit trois histoires pour trois mannequins de cire : un calife, un tsar, et Jack l'Éventreur.",g:["tension","eblouissement"],c:"ville",e:"passe",x:3,fin:"ouverte",fam:false,tg:["muet","noir-et-blanc","etrange","decor","conte"],v:["Le Cabinet du docteur Caligari","Le Golem"]},
{t:"Variétés",a:1925,r:"Ewald André Dupont",f:"film",d:"1 h 35",p:"Un trapéziste quitte sa femme pour une danseuse, et retrouve son rival en haut du trapèze.",g:["tension"],c:"ville",e:"passe",x:3,fin:"sombre",fam:false,tg:["muet","noir-et-blanc","scene","desir","vengeance"],v:["Loulou","Le Dernier des hommes"],hist:"La caméra montée sur le trapèze, qui balance avec les acrobates, a fait sensation et lancé la mode de la caméra mobile aux États-Unis."},
{t:"Ivan le Terrible",a:1944,r:"Sergueï Eisenstein",f:"film",d:"1 h 39",p:"Le premier tsar de Russie affronte les boyards, et finit seul dans ses palais peints.",g:["eblouissement","tension"],c:"pluie",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","russie","pouvoir","decor","histoire"],v:["Alexandre Nevski","Le Guépard"],hist:"Staline a fait interdire la seconde partie, y ayant reconnu sa propre police politique. Eisenstein est mort avant de tourner la troisième."},
{t:"Laura",a:1944,r:"Otto Preminger",f:"film",d:"1 h 28",p:"Un inspecteur enquête sur le meurtre d'une femme dont le portrait le fascine, jusqu'à ce qu'elle rentre chez elle.",g:["tension"],c:"ville",e:"passe",x:2,fin:"douce",fam:false,tg:["noir","noir-et-blanc","enquete","new-york","obsession"],v:["Le Faucon maltais","Assurance sur la mort"],hist:"Le producteur voulait renvoyer Preminger et confier le film à un autre. Le studio a cédé après une projection test où le public a applaudi le retour de Laura."},
{t:"La Griffe du passé",a:1947,r:"Jacques Tourneur",f:"film",d:"1 h 37",p:"Un pompiste tranquille est rattrapé par l'homme pour qui il a jadis retrouvé une femme.",g:["tension"],c:"ville",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir","noir-et-blanc","fuite","desir","secret"],v:["Assurance sur la mort","Le Grand Sommeil"],hist:"Souvent tenu pour le film noir le plus achevé du genre : le récit se replie sur lui-même par une série de retours en arrière dont on ne sort jamais vraiment."},
{t:"Les Tueurs",a:1946,r:"Robert Siodmak",f:"film",d:"1 h 43",p:"Un ancien boxeur attend sans bouger les deux hommes venus le tuer. Un assureur veut savoir pourquoi.",g:["tension"],c:"ville",e:"passe",x:2,fin:"sombre",fam:false,tg:["noir","noir-et-blanc","boxe","enquete","argent"],v:["La Griffe du passé","Le Faucon maltais"],hist:"Premier rôle de Burt Lancaster. Les douze premières minutes adaptent la nouvelle de Hemingway au mot près, le reste est inventé.",src:{auteur:"Ernest Hemingway",oeuvre:"Les Tueurs",nature:"nouvelle"}},
{t:"Gilda",a:1946,r:"Charles Vidor",f:"film",d:"1 h 50",p:"Un joueur devient l'homme de confiance d'un patron de casino à Buenos Aires, et retrouve son ancienne amante.",g:["tension"],c:"ville",e:"passe",x:2,fin:"douce",fam:false,tg:["noir","noir-et-blanc","desir","jeu","argent"],v:["Le Grand Sommeil","Casablanca"],hist:"Le numéro où Rita Hayworth retire un gant est resté l'image même du désir censuré : il ne montre rien, et a fait scandale partout."},
{t:"La Dame de Shanghai",a:1947,r:"Orson Welles",f:"film",d:"1 h 27",p:"Un marin irlandais se laisse entraîner par une femme mariée dans un contrat d'assassinat truqué.",g:["tension"],c:"ailleurs",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir","noir-et-blanc","mer","complot","desir"],v:["Citizen Kane","La Griffe du passé"],hist:"La fusillade dans le palais des glaces a demandé la construction de plus de cent miroirs. Le studio a coupé une heure du montage de Welles."},
{t:"Le Carrefour de la mort",a:1947,r:"Henry Hathaway",f:"film",d:"1 h 39",p:"Un petit truand accepte de dénoncer ses complices, et l'un d'eux, un psychopathe rieur, le retrouve.",g:["tension"],c:"ville",e:"passe",x:2,fin:"douce",fam:false,tg:["noir","noir-et-blanc","new-york","police","malaise"],v:["Les Tueurs","Le Faucon maltais"]},
{t:"Les Passagers de la nuit",a:1947,r:"Delmer Daves",f:"film",d:"1 h 46",p:"Un évadé condamné pour le meurtre de sa femme se fait refaire le visage pour prouver son innocence.",g:["tension"],c:"ville",e:"passe",x:2,fin:"douce",fam:false,tg:["noir","noir-et-blanc","evasion","identite","enquete"],v:["Le Grand Sommeil","Le Port de l'angoisse"],hist:"Le premier tiers est filmé entièrement en vue subjective : on ne voit Humphrey Bogart qu'après son opération."},
{t:"Le Démon des armes",a:1950,r:"Joseph H. Lewis",f:"film",d:"1 h 26",p:"Un garçon fasciné par les armes rencontre une tireuse de foire, et ils partent braquer ensemble.",g:["tension"],c:"ville",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir","noir-et-blanc","fuite","desir","poursuite"],v:["Bonnie and Clyde","La Griffe du passé"],hist:"Le braquage de banque est tourné en un seul plan depuis la banquette arrière d'une voiture, sans coupe et sans figuration prévenue."},
{t:"Quand la ville dort",a:1950,r:"John Huston",f:"film",d:"1 h 52",p:"Un cambriolage de bijouterie parfaitement préparé, et cinq hommes que leurs faiblesses trahissent un à un.",g:["tension"],c:"ville",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir","noir-et-blanc","casse","argent","chute"],v:["Le Trésor de la Sierra Madre"],hist:"Modèle fondateur du film de casse : toute la structure du genre, de la préparation à la dislocation de l'équipe, est déjà là."},
{t:"La Femme au portrait",a:1944,r:"Fritz Lang",f:"film",d:"1 h 47",p:"Un professeur d'université sage rencontre la femme d'un tableau et se retrouve avec un cadavre.",g:["tension"],c:"ville",e:"passe",x:2,fin:"douce",fam:false,tg:["noir","noir-et-blanc","new-york","desir","reve"],v:["La Rue rouge","Assurance sur la mort"]},
{t:"La Rue rouge",a:1945,r:"Fritz Lang",f:"film",d:"1 h 42",p:"Un caissier terne peint le dimanche et se laisse dépouiller par une femme qui signe ses toiles.",g:["tension"],c:"ville",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir","noir-et-blanc","peinture","imposteur","chute"],v:["La Femme au portrait","La Chienne"]},
{t:"Le Ministère de la peur",a:1944,r:"Fritz Lang",f:"film",d:"1 h 26",p:"Un homme sorti d'asile gagne un gâteau à une kermesse, et se retrouve traqué par un réseau nazi.",g:["tension"],c:"pluie",e:"passe",x:2,fin:"douce",fam:false,tg:["noir","noir-et-blanc","londres","guerre","espionnage"],v:["Les 39 Marches","Le Troisième Homme"],src:{auteur:"Graham Greene",oeuvre:"Le Ministère de la peur",nature:"roman"}},
{t:"Hantise",a:1944,r:"George Cukor",f:"film",d:"1 h 54",p:"Un mari fait croire à sa femme qu'elle perd la raison, en baissant chaque soir la lumière du gaz.",g:["tension"],c:"pluie",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","londres","malaise","maison","secret"],v:["Rebecca","Les Enchaînés"],prix:["2 Oscars 1945"],hist:"Le film a donné son nom au gaslighting : la manipulation qui consiste à faire douter quelqu'un de sa propre perception."},
{t:"L'Ombre d'un doute",a:1943,r:"Alfred Hitchcock",f:"film",d:"1 h 48",p:"Une adolescente adore son oncle en visite, jusqu'à comprendre ce qu'il fuit.",g:["tension"],c:"ville",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","famille","village","secret","malaise"],v:["Les Enchaînés","L'Inconnu du Nord-Express"],hist:"Hitchcock a plusieurs fois désigné ce film comme son préféré, pour avoir installé le meurtre au cœur d'une famille américaine ordinaire."},
{t:"La Maison du docteur Edwardes",a:1945,r:"Alfred Hitchcock",f:"film",d:"1 h 51",p:"Une psychanalyste protège un homme amnésique accusé de meurtre, et cherche le souvenir qui l'innocenterait.",g:["tension"],c:"pluie",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","hopital","memoire","reve","enquete"],v:["Les Enchaînés","Rebecca"],hist:"La séquence de rêve a été conçue par Salvador Dalí. Le studio en a coupé les trois quarts, jugés incompréhensibles."},
{t:"Lifeboat",a:1944,r:"Alfred Hitchcock",f:"film",d:"1 h 37",p:"Huit naufragés d'un cargo torpillé partagent un canot avec le commandant du sous-marin allemand.",g:["tension"],c:"ailleurs",e:"passe",x:3,fin:"ouverte",fam:false,tg:["noir-et-blanc","huis-clos","mer","guerre","survie"],v:["Douze hommes en colère","Das Boot"],hist:"Tout le film tient dans une barque. Hitchcock, qui apparaissait dans chacun de ses films, s'est glissé ici dans une publicité de journal."},
{t:"Les Plus Belles Années de notre vie",a:1946,r:"William Wyler",f:"film",d:"2 h 50",p:"Trois soldats rentrent dans la même ville américaine et découvrent qu'on ne revient jamais vraiment.",g:["tension","refuge"],c:"ville",e:"passe",x:2,fin:"douce",fam:false,tg:["noir-et-blanc","guerre","famille","amerique","dignite"],v:["Les Raisins de la colère","Voyage au bout de l'enfer"],prix:["7 Oscars 1947, dont meilleur film"],hist:"Harold Russell, vétéran amputé des deux mains, jouait son propre rôle : il est le seul acteur de l'histoire à avoir reçu deux Oscars pour la même interprétation."},
{t:"Qu'elle était verte ma vallée",a:1941,r:"John Ford",f:"film",d:"1 h 58",p:"Un vieil homme se souvient de la vallée galloise de son enfance, avant que la mine ne dévore tout.",g:["refuge","tension"],c:"pluie",e:"passe",x:2,fin:"sombre",fam:true,tg:["noir-et-blanc","famille","travail","memoire","village"],v:["Les Raisins de la colère","Cinema Paradiso"],prix:["5 Oscars 1942, dont meilleur film"],hist:"Le film a battu Citizen Kane à l'Oscar du meilleur film, ce que la postérité n'a jamais pardonné à l'Académie."},

{t:"La Rivière rouge",a:1948,r:"Howard Hawks",f:"film",d:"2 h 13",p:"Un éleveur tyrannique conduit dix mille bêtes vers le Kansas, et son fils adoptif finit par prendre le convoi.",g:["tension","eblouissement"],c:"soleil",e:"passe",x:2,fin:"douce",fam:false,tg:["western","noir-et-blanc","desert","famille","travail"],v:["La Poursuite infernale","Rio Bravo"],hist:"En voyant le film, John Ford aurait dit de John Wayne, qu'il dirigeait depuis vingt ans, qu'il ne savait pas que ce grand imbécile pouvait jouer."},
{t:"Sergent York",a:1941,r:"Howard Hawks",f:"film",d:"2 h 14",p:"Un fermier du Tennessee objecteur de conscience devient le soldat le plus décoré de 1918.",g:["tension","apprendre"],c:"ailleurs",e:"passe",x:2,fin:"douce",fam:true,tg:["noir-et-blanc","guerre","spiritualite","biopic","campagne"],v:["Les Plus Belles Années de notre vie","La Grande Illusion"],prix:["2 Oscars 1942"]},

{t:"Madame Miniver",a:1942,r:"William Wyler",f:"film",d:"2 h 14",p:"Une famille anglaise ordinaire tient sa maison pendant le Blitz, entre le concours de roses et Dunkerque.",g:["refuge","tension"],c:"pluie",e:"passe",x:2,fin:"douce",fam:true,tg:["noir-et-blanc","angleterre","guerre","famille","dignite"],v:["Brève Rencontre","Les Plus Belles Années de notre vie"],prix:["6 Oscars 1943, dont meilleur film"],hist:"Roosevelt a fait diffuser le sermon final à la radio et largué son texte sur l'Europe occupée. Churchill a dit que le film valait une flotte de destroyers."},

{t:"Ossessione",a:1943,r:"Luchino Visconti",f:"film",d:"2 h 20",p:"Un vagabond s'arrête dans une auberge du Pô, et la femme du patron lui propose de s'en débarrasser.",g:["tension"],c:"soleil",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","italie","desir","fleuve","chute"],v:["La Terre tremble","La Griffe du passé"],hist:"Premier film de Visconti, tourné sous le fascisme sans les droits du roman américain dont il s'inspire : le négatif a été saisi et le film longtemps invisible."},

{t:"Chronique d'un amour",a:1950,r:"Michelangelo Antonioni",f:"film",d:"1 h 50",p:"Un industriel milanais fait enquêter sur le passé de sa femme, et rouvre ce qu'il aurait mieux valu laisser.",g:["tension"],c:"pluie",e:"passe",x:3,fin:"ouverte",fam:false,tg:["noir-et-blanc","italie","enquete","desir","malaise"],v:["L'Avventura","Ossessione"]},
{t:"L'Éternel Retour",a:1943,r:"Jean Delannoy",f:"film",d:"1 h 51",p:"Tristan et Iseut transposés dans un manoir français contemporain, avec un philtre servi par erreur.",g:["eblouissement"],c:"pluie",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","conte","manoir","amour","france"],v:["Les Visiteurs du soir","La Belle et la Bête"],hist:"Scénario de Cocteau. Le film a connu un immense succès sous l'Occupation, et sa blondeur affichée lui a valu après-guerre des accusations d'ambiguïté."},

{t:"Le Silence de la mer",a:1949,r:"Jean-Pierre Melville",f:"film",d:"1 h 26",p:"Un officier allemand logé chez un vieil homme et sa nièce parle chaque soir. Ils ne lui répondent jamais.",g:["tension"],c:"pluie",e:"passe",x:3,fin:"sombre",fam:false,tg:["noir-et-blanc","guerre","huis-clos","resistance","dignite"],v:["L'Armée des ombres","Les Visiteurs du soir"],hist:"Melville a tourné sans autorisation des ayants droit, en s'engageant à détruire le film si un jury de résistants le désavouait. Le jury l'a approuvé.",src:{auteur:"Vercors",oeuvre:"Le Silence de la mer",nature:"roman"}},

/**
 * Normalise une chaîne pour comparaison insensible aux accents et à la casse.
 * @param {string} texte
 * @returns {string}
 */
function normaliser(texte){
  return String(texte || "").toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}

/**
 * Clé d'identité d'une œuvre : titre + format.
 * Deux œuvres homonymes de formats différents restent distinctes.
 * @param {object} oeuvre
 * @returns {string}
 */
function cle_oeuvre(oeuvre){
  return normaliser(oeuvre.t) + "|" + oeuvre.f;
}

/**
 * Découpe la liste de repères saisie par la personne.
 * Le saut de ligne est le séparateur principal ; le point-virgule est accepté.
 * La virgule n'est pas un séparateur, pour ne pas couper « Le Bon, la Brute et le Truand ».
 * @param {string} texte
 * @returns {string[]} titres normalisés
 */
function decouper_reperes(texte){
  return String(texte || "").split(/[\n;]/).map(normaliser).filter(Boolean);
}

/**
 * Contracte « de + article » selon l'usage français.
 * @param {string} titre
 * @returns {string}
 */
function elider(titre){
  if(/^Le /.test(titre))  return "du " + titre.slice(3);
  if(/^Les /.test(titre)) return "des " + titre.slice(4);
  if(/^La /.test(titre))  return "de la " + titre.slice(3);
  if(/^L'/.test(titre))   return "de l'" + titre.slice(2);
  return "de " + titre;
}

/**
 * Convertit une durée affichée en minutes. Retourne null si non applicable (série).
 * @param {string} duree - par exemple « 2 h 03 »
 * @returns {number|null}
 */
function duree_minutes(duree){
  const m = /^(\d+)\s*h\s*(\d*)/.exec(String(duree || "").trim());
  if(!m) return null;
  return parseInt(m[1],10) * 60 + (m[2] ? parseInt(m[2],10) : 0);
}

/**
 * Générateur pseudo-aléatoire déterministe (mulberry32).
 * Une même graine produit toujours la même suite : les recommandations
 * sont donc reproductibles et testables.
 * @param {number} graine
 * @returns {function(): number} tirage dans [0, 1[
 */
function fabriquer_alea(graine){
  let etat = graine >>> 0;
  return function(){
    etat = (etat + 0x6D2B79F5) >>> 0;
    let t = Math.imul(etat ^ (etat >>> 15), 1 | etat);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Compte les éléments communs à deux listes. */
function compter_communs(liste_a, liste_b){
  let total = 0;
  for(const element of liste_a){ if(liste_b.indexOf(element) !== -1) total++; }
  return total;
}

/** Échappe le texte destiné à être injecté dans du HTML. */
function echapper(texte){
  return String(texte == null ? "" : texte)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

const BORNES_DUREE = {court:[0,105], normal:[0,140], long:[0,Infinity], tout:[0,Infinity]};

/**
 * Vérifie qu'une œuvre franchit tous les filtres éliminatoires.
 * Fonction pure.
 * @param {object} oeuvre
 * @param {object} profil
 * @param {object} humeur
 * @param {string[]} interdits - clés d'œuvres à ne jamais proposer
 * @returns {string|null} le motif de rejet, ou null si l'œuvre est retenue
 */
function motif_de_rejet(oeuvre, profil, humeur, interdits){
  const af = profil.affinites;
  if(oeuvre.f !== humeur.format) return "format";
  if(interdits.indexOf(cle_oeuvre(oeuvre)) !== -1) return "déjà connu";
  if(humeur.compagnie === "famille" && !oeuvre.fam) return "pas pour la famille";
  if(oeuvre.x > af.exigence) return "trop exigeant";
  for(const exclu of af.exclus || []){
    if(exclu === "sombre"){ if(oeuvre.fin === "sombre") return "fin trop sombre"; continue; }
    if(oeuvre.tg.indexOf(exclu) !== -1) return "étiquette exclue : " + exclu;
  }
  if(humeur.format === "film" && humeur.duree && humeur.duree !== "tout"){
    const minutes = duree_minutes(oeuvre.d);
    const [bas, haut] = BORNES_DUREE[humeur.duree] || BORNES_DUREE.tout;
    if(minutes !== null && (minutes < bas || minutes > haut)) return "durée";
  }
  return null;
}

/**
 * Note une œuvre déjà validée par les filtres. Plus le score est haut, mieux c'est.
 * Fonction pure : le hasard est fourni par l'appelant.
 * @param {object} oeuvre
 * @param {object} profil
 * @param {object} humeur
 * @param {function(): number} alea
 * @returns {{score: number, raisons: string[]}}
 */
function noter(oeuvre, profil, humeur, alea){
  const af = profil.affinites;
  const raisons = [];
  let score = 0;

  if(oeuvre.g.indexOf(humeur.registre) !== -1){ score += 7; raisons.push("registre du soir"); }
  if(humeur.climat !== "tout" && oeuvre.c === humeur.climat){ score += 5; raisons.push("climat demandé"); }
  if(humeur.climat === "tout") score += 1;

  for(const registre of oeuvre.g){ score += (af.registres[registre] || 0); }
  score += (af.climats[oeuvre.c] || 0);
  score += (af.epoques[oeuvre.e] || 0);
  score += (af.fins[oeuvre.fin] || 0);

  const proximite = compter_communs(oeuvre.tg, af.aimes);
  if(humeur.audace === "sure"){ score += proximite * 2.2; if(proximite >= 3) raisons.push("cœur de profil"); }
  if(humeur.audace === "cote"){ if(proximite >= 1 && proximite <= 4){ score += 5; raisons.push("voisinage"); } }
  if(humeur.audace === "angle"){
    if(proximite <= 1){ score += 8; raisons.push("terrain inexploré"); } else { score -= proximite * 1.5; }
  }

  const rejet = compter_communs(oeuvre.tg, af.tiedes || []);
  if(rejet > 0){ score -= rejet * 1.6; raisons.push("contient ce que tu notes mal"); }

  if(humeur.compagnie === "seul" && oeuvre.x === 3) score += 2;
  if(humeur.compagnie === "deux" && oeuvre.x === 3) score -= 1;

  return {score: score + alea() * 3.5, raisons};
}

const JOURS_DE_MISE_AU_PLACARD = 30;

/**
 * Rassemble les clés d'œuvres qu'un profil ne doit pas recevoir.
 * Fonction pure : l'instant est fourni par l'appelant, jamais lu de l'horloge.
 * Un titre simplement écarté pour un soir redevient proposable après un mois ;
 * tous les autres statuts bloquent définitivement, jusqu'à un oubli explicite.
 * @param {object} profil
 * @param {object[]} catalogue
 * @param {number} maintenant - horodatage en millisecondes
 * @returns {string[]}
 */
function calculer_interdits(profil, catalogue, maintenant = Date.now()){
  const reperes = decouper_reperes(profil.reperes);
  const interdits = [];
  for(const entree of profil.journal){
    if(entree.statut === "refuse"){
      const jours = (maintenant - new Date(entree.date).getTime()) / 86400000;
      if(Number.isFinite(jours) && jours > JOURS_DE_MISE_AU_PLACARD) continue;
    }
    interdits.push(entree.cle);
  }
  for(const oeuvre of catalogue){
    if(reperes.indexOf(normaliser(oeuvre.t)) !== -1) interdits.push(cle_oeuvre(oeuvre));
  }
  return interdits;
}

/**
 * Compose une sélection variée. Déterministe à graine égale.
 * @param {object} parametres - {profil, humeur, catalogue, ecartes, graine, combien}
 * @returns {object[]} œuvres retenues, enrichies d'un champ `raisons`
 */
function composer({profil, humeur, catalogue, ecartes = [], graine = 1, combien = 3}){
  const alea = fabriquer_alea(graine);
  const interdits = calculer_interdits(profil, catalogue).concat(ecartes);

  const candidats = [];
  for(const oeuvre of catalogue){
    if(motif_de_rejet(oeuvre, profil, humeur, interdits) !== null) continue;
    const {score, raisons} = noter(oeuvre, profil, humeur, alea);
    candidats.push({oeuvre, score, raisons});
  }
  candidats.sort((a,b) => b.score - a.score);
  if(candidats.length === 0) return [];

  const retenus = [];
  const auteurs = [];
  const decennies = [];
  const plafond = candidats[0].score;
  for(const candidat of candidats){
    if(retenus.length >= combien) break;
    const {oeuvre} = candidat;
    const decennie = Math.floor(oeuvre.a / 10);
    if(auteurs.indexOf(oeuvre.r) !== -1) continue;
    if(retenus.length > 0 && decennies.indexOf(decennie) !== -1 && candidat.score < plafond - 4) continue;
    retenus.push(Object.assign({}, oeuvre, {raisons: candidat.raisons}));
    auteurs.push(oeuvre.r); decennies.push(decennie);
  }
  for(const candidat of candidats){
    if(retenus.length >= combien) break;
    if(!retenus.some(o => cle_oeuvre(o) === cle_oeuvre(candidat.oeuvre))){
      retenus.push(Object.assign({}, candidat.oeuvre, {raisons: candidat.raisons}));
    }
  }
  return retenus;
}

/**
 * Rédige la justification affichée sous un titre.
 * @param {object} oeuvre
 * @param {object} profil
 * @param {object} humeur
 * @returns {string}
 */
function rediger_pourquoi(oeuvre, profil, humeur){
  const morceaux = [RAISON_REGISTRE[humeur.registre] || ""];
  const climat = RAISON_CLIMAT[humeur.climat];
  if(climat) morceaux.push(climat);
  for(const etiquette of oeuvre.tg){
    if(RAISON_TAG[etiquette] && profil.affinites.aimes.indexOf(etiquette) !== -1){
      morceaux.push("Surtout, " + RAISON_TAG[etiquette] + "."); break;
    }
  }
  if(humeur.audace === "angle") morceaux.push("C'est volontairement loin de tes habitudes.");
  return morceaux.filter(Boolean).join(" ");
}

/**
 * Rédige l'écho vers un titre déjà aimé.
 * @param {object} oeuvre
 * @param {object} profil
 * @returns {string}
 */
function rediger_echo(oeuvre, profil){
  const connus = decouper_reperes(profil.reperes);
  for(const voisin of oeuvre.v || []){
    if(connus.indexOf(normaliser(voisin)) !== -1) return "Dans la lignée " + elider(voisin) + ".";
  }
  if(oeuvre.v && oeuvre.v.length) return "Même famille que " + oeuvre.v[0] + ".";
  return "";
}

/**
 * Construit les affinités de départ à partir des réponses de profilage.
 * @param {object} reponses
 * @returns {object}
 */
function deduire_affinites(reponses){
  const af = {
    registres:{eblouissement:1, tension:1, refuge:1, rire:1, apprendre:1},
    climats:{soleil:1, pluie:1, ville:1, ailleurs:1},
    epoques:{passe:1, present:1, imaginaire:1},
    fins:{sombre:1, douce:1, ouverte:1},
    exigence:2, aimes:[], tiedes:[], exclus:[]
  };
  if(reponses.registre) af.registres[reponses.registre] = 3;
  if(reponses.climat) af.climats[reponses.climat] = 3;
  if(reponses.epoque && reponses.epoque !== "tout") af.epoques[reponses.epoque] = 3;
  if(reponses.fin && reponses.fin !== "tout") af.fins[reponses.fin] = 3;
  if(reponses.exigence) af.exigence = parseInt(reponses.exigence, 10);

  const sources = [
    CONSEQUENCES_ENTREE[reponses.entree],
    CONSEQUENCES_CLIMAT[reponses.climat],
    CONSEQUENCES_EPOQUE[reponses.epoque]
  ];
  for(const liste of sources){
    for(const etiquette of liste || []){ if(af.aimes.indexOf(etiquette) === -1) af.aimes.push(etiquette); }
  }
  for(const rejet of reponses.rejets || []){ if(rejet !== "rien") af.exclus.push(rejet); }
  return af;
}

/**
 * Fait évoluer les affinités après notation d'une œuvre.
 * Fonction pure : retourne de nouvelles affinités, sans modifier l'entrée.
 * @param {object} affinites
 * @param {object} oeuvre
 * @param {number} note - de 1 à 5
 * @returns {object}
 */
function apprendre(affinites, oeuvre, note){
  if(typeof note !== "number" || note < 1 || note > 5){
    throw new Error("Note attendue entre 1 et 5, reçu : " + note);
  }
  const suivant = JSON.parse(JSON.stringify(affinites));
  if(note === 3) return suivant;

  const aime = note >= 4;
  const pas = aime ? 0.5 : -0.5;

  for(const registre of oeuvre.g){
    const valeur = (suivant.registres[registre] || 0) + pas;
    suivant.registres[registre] = Math.max(0, Math.min(4, valeur));
  }
  suivant.climats[oeuvre.c] = Math.max(0, Math.min(4, (suivant.climats[oeuvre.c] || 0) + pas));
  suivant.epoques[oeuvre.e] = Math.max(0, Math.min(4, (suivant.epoques[oeuvre.e] || 0) + pas));

  for(const etiquette of oeuvre.tg){
    if(aime){
      suivant.tiedes = suivant.tiedes.filter(t => t !== etiquette);
      if(suivant.aimes.indexOf(etiquette) === -1) suivant.aimes.push(etiquette);
    } else {
      suivant.aimes = suivant.aimes.filter(t => t !== etiquette);
      if(suivant.tiedes.indexOf(etiquette) === -1) suivant.tiedes.push(etiquette);
    }
  }
  return suivant;
}

/**
 * Fusionne deux profils pour une soirée à deux.
 * Le résultat est plus prudent que chacun pris isolément : l'exigence retenue est
 * la plus basse, les exclusions s'additionnent, les goûts se cumulent.
 * @param {object} premier
 * @param {object} second
 * @returns {object} profil synthétique, non persisté
 */
function fusionner_profils(premier, second){
  const a = premier.affinites, b = second.affinites;
  const cumuler = (x, y) => {
    const resultat = {};
    for(const cle of new Set([...Object.keys(x), ...Object.keys(y)])){
      resultat[cle] = (x[cle] || 0) + (y[cle] || 0);
    }
    return resultat;
  };
  const unir = (x, y) => [...new Set([...(x || []), ...(y || [])])];

  return {
    id: premier.id + "+" + second.id,
    prenom: premier.prenom + " et " + second.prenom,
    theme: premier.theme,
    reperes: premier.reperes + "\n" + second.reperes,
    journal: premier.journal.concat(second.journal),
    aVoir: [],
    affinites:{
      registres: cumuler(a.registres, b.registres),
      climats:   cumuler(a.climats, b.climats),
      epoques:   cumuler(a.epoques, b.epoques),
      fins:      cumuler(a.fins, b.fins),
      exigence:  Math.min(a.exigence, b.exigence),
      aimes:     unir(a.aimes, b.aimes),
      tiedes:    unir(a.tiedes, b.tiedes),
      exclus:    unir(a.exclus, b.exclus)
    }
  };
}

/**
 * Cherche dans le catalogue par titre, réalisateur ou étiquette.
 * @param {object[]} catalogue
 * @param {object} criteres - {texte, format, etiquette}
 * @returns {object[]}
 */
function chercher(catalogue, {texte = "", format = "tout", etiquette = ""} = {}){
  const requete = normaliser(texte);
  return catalogue.filter(oeuvre => {
    if(format !== "tout" && oeuvre.f !== format) return false;
    if(etiquette && oeuvre.tg.indexOf(etiquette) === -1) return false;
    if(!requete) return true;
    return normaliser(oeuvre.t).includes(requete)
        || normaliser(oeuvre.r).includes(requete)
        || oeuvre.tg.some(t => normaliser(t).includes(requete))
        || (oeuvre.prix || []).some(prix => normaliser(prix).includes(requete));
  });
}

/**
 * Calcule les statistiques d'un journal.
 * @param {object} profil
 * @param {object[]} catalogue
 * @returns {object}
 */
function calculer_statistiques(profil, catalogue){
  const index = new Map(catalogue.map(oeuvre => [cle_oeuvre(oeuvre), oeuvre]));
  const vus = profil.journal.filter(e => e.statut === "pris" || e.statut === "deja_vu");
  const formats = {film:0, serie:0, doc:0};
  const decennies = {};
  const auteurs = {};
  let notes = 0, somme = 0, total = 0;

  for(const entree of vus){
    const oeuvre = index.get(entree.cle);
    // Une entrée dont l'œuvre a disparu du catalogue (titre ajouté à la main puis
    // supprimé) n'est comptée nulle part : sinon le total dépasserait la somme des
    // formats et les barres de répartition seraient calculées sur un tout faussé.
    if(!oeuvre) continue;
    total++;
    formats[oeuvre.f] = (formats[oeuvre.f] || 0) + 1;
    const decennie = Math.floor(oeuvre.a / 10) * 10;
    decennies[decennie] = (decennies[decennie] || 0) + 1;
    auteurs[oeuvre.r] = (auteurs[oeuvre.r] || 0) + 1;
    if(typeof entree.note === "number"){ notes++; somme += entree.note; }
  }
  const classer = objet => Object.entries(objet).sort((a,b) => b[1] - a[1]);
  return {
    total,
    formats,
    decennies: Object.entries(decennies).sort((a,b) => a[0] - b[0]),
    auteurs: classer(auteurs).slice(0, 5),
    moyenne: notes > 0 ? (somme / notes) : null,
    notes
  };
}
